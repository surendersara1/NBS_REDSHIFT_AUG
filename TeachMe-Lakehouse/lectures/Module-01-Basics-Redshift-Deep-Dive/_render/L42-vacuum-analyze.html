<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 42</text>
<text x="90" y="168" class="title">VACUUM, ANALYZE and Auto Maintenance</text>
<text x="90" y="212" class="sub">Deleted rows are only marked, not removed. Statistics go stale. Redshift now handles most of this &#8212; but you must know when it has not.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Two different jobs that people confuse constantly</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">VACUUM reclaims space and restores sort order. ANALYZE refreshes the statistics the planner uses. A slow query is far more often stale stats than unsorted data.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">WHAT IS AUTOMATIC, AND WHAT IS YOURS</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">AUTO VACUUM AND AUTO ANALYZE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">run in idle periods</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Both run in the background when the cluster is quiet. On a busy cluster with no quiet period, they may never get their turn.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">CHECK, DO NOT ASSUME</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">svv_table_info</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Two numbers tell you everything: unsorted percent and stats_off. Anything above ten on either deserves a look.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">ANALYZE AFTER EVERY BIG LOAD</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">it is cheap, do it explicitly</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Put it at the end of the procedure. Analyzing only the predicate columns is faster than the whole table.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">DEEP COPY BEATS A HUGE VACUUM</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">rebuild instead of repair</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">A badly unsorted large table rebuilds faster than it vacuums. CREATE, INSERT SELECT ordered, swap the names.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">TRUNCATE and DROP need no vacuum. DELETE does.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sqlc">-- the two numbers that matter</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">SELECT</tspan> "table", size, unsorted,</text>
<text x="1298" y="554" class="sql">       stats_off, tbl_rows</text>
<text x="1298" y="578" class="sql"><tspan class="sqlk">FROM</tspan>   svv_table_info</text>
<text x="1298" y="602" class="sql"><tspan class="sqlk">WHERE</tspan>  unsorted &gt; 10</text>
<text x="1298" y="626" class="sql">   <tspan class="sqlk">OR</tspan>  stats_off &gt; 10</text>
<text x="1298" y="650" class="sql"><tspan class="sqlk">ORDER BY</tspan> size <tspan class="sqlk">DESC</tspan>;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">VACUUM takes a lock that blocks writes on</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">that table. Never during the load window.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Only one VACUUM runs at a time, cluster-wide.</text>
<text x="1298" y="852" class="warn">DELETE without VACUUM grows the table</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Deleting a row crosses it off the list rather than tearing out the page. VACUUM rebinds the book. ANALYZE updates the index card the planner reads.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 42</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
