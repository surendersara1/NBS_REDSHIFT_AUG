<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 34</text>
<text x="90" y="168" class="title">Result Caching and Compiled Code</text>
<text x="90" y="212" class="sub">The second run is often a hundred times faster than the first. Knowing why stops you drawing the wrong conclusion when you benchmark.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Two separate caches, and they explain different things</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">The result cache returns a finished answer without touching the compute nodes. The compiled-code cache saves the C++ compilation step for a query shape it has seen before.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">WHAT MAKES A CACHE HIT, AND WHAT BREAKS IT</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">RESULT CACHE &#8212; ON THE LEADER</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">milliseconds, zero compute</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Same SQL text, same user, same permissions, and no change to the underlying tables. Then the answer is returned as-is.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FF6B73">WHAT INVALIDATES IT</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">any write, or a volatile function</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">A load into any referenced table. Also GETDATE, RANDOM, CURRENT_DATE, temp tables and external tables &#8212; never cached.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#5AA9FF">COMPILED CODE CACHE</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">shared across clusters</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Segments are compiled to C++ on first execution. That cost is why a brand-new query shape has a slow first run even on small data.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FFB84D">BENCHMARK HONESTLY</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">turn the cache off first</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">SET enable_result_cache_for_session TO off, then run each variant three times and compare the third. Otherwise you are timing the cache.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">a 40 second query that reruns in 8 ms did not run at all</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sqlc">-- honest timing for a rewrite test</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">SET</tspan> enable_result_cache_for_session</text>
<text x="1298" y="554" class="sql">    <tspan class="sqlk">TO</tspan> off;</text>
<text x="1298" y="584" class="sqlc">-- did it hit the cache?</text>
<text x="1298" y="608" class="sql"><tspan class="sqlk">SELECT</tspan> query_id, elapsed_time,</text>
<text x="1298" y="632" class="sql">       result_cache_hit</text>
<text x="1298" y="656" class="sql"><tspan class="sqlk">FROM</tspan> sys_query_history <tspan class="sqlk">LIMIT</tspan> 20;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">The cache is not a performance strategy &#8212;</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">a dashboard after a load never hits it.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">For that, use a materialized view (Lesson 11).</text>
<text x="1298" y="852" class="warn">whitespace changes still hit</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Ask the same question twice and you get the note the leader kept, not a fresh count of the warehouse. Change one item in stock and the note is torn up.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 34</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
