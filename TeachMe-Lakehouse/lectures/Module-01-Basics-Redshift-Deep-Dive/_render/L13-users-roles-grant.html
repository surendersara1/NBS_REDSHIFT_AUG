<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 13</text>
<text x="90" y="168" class="title">Users, Roles and GRANT</text>
<text x="90" y="212" class="sub">Who is allowed. The pattern that matters is not a grant &#8212; it is keeping the thing that writes and the thing that reads apart.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Grant to roles, never to people &#8212; and never to individual tables</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Table-by-table grants become unauditable within a month. Grant on the schema, with a default privilege so new tables inherit it automatically.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR LAYERS, AND ONE PATTERN</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">USERS &#183; GROUPS &#183; ROLES</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">prefer ROLE</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Roles can be granted to other roles and carry system privileges. Groups are the older mechanism. Use roles for anything new.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">GRANT AT SCHEMA LEVEL</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">+ ALTER DEFAULT PRIVILEGES</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">USAGE on the schema, SELECT on all tables in it, and a default privilege so tomorrow&#8217;s tables are covered without anyone remembering.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">COLUMN AND ROW LEVEL</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">CLS and RLS</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">GRANT SELECT (col_a, col_b) hides a column. An RLS policy narrows which rows a role sees &#8212; both applied by the engine.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">READER / WRITER SPLIT</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">the pattern that matters</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">The ETL role writes and is assumed by jobs, never by people. The BI role reads reporting views only. No human account holds both.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">every grant in Terraform — an access change needs an author and a reviewer</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sql"><tspan class="sqlk">CREATE ROLE</tspan> bi_reader;</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">GRANT USAGE ON SCHEMA</tspan> rpt <tspan class="sqlk">TO ROLE</tspan> bi_reader;</text>
<text x="1298" y="552" class="sql"><tspan class="sqlk">GRANT SELECT ON ALL TABLES IN SCHEMA</tspan> rpt</text>
<text x="1298" y="574" class="sql">      <tspan class="sqlk">TO ROLE</tspan> bi_reader;</text>
<text x="1298" y="608" class="sqlc">-- and cover tomorrow's tables too</text>
<text x="1298" y="632" class="sql"><tspan class="sqlk">ALTER DEFAULT PRIVILEGES IN SCHEMA</tspan> rpt</text>
<text x="1298" y="654" class="sql">  <tspan class="sqlk">GRANT SELECT ON TABLES TO ROLE</tspan> bi_reader;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Without ALTER DEFAULT PRIVILEGES, every new</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">table is invisible until someone re-grants.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Revoke CREATE on public on day one.</text>
<text x="1298" y="852" class="warn">grants clicked in a console are orphans</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Give the job title the keys, not the person. When someone leaves you change one list, instead of searching the building for locks they could open.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 13</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
