<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 44 · ⭐ THE PLAYBOOK</text>
<text x="90" y="168" class="title">Diagnosing A Slow Query</text>
<text x="90" y="212" class="sub">Six questions, in order. Answer them in sequence and you will find the cause almost every time without guessing once.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">A fixed order, so you stop guessing</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Almost everyone starts by rewriting the SQL. That is question six. The first five are cheaper, faster to check, and usually where the answer is.</text>

<text x="90" y="462" class="zhow">2 · THE SIX QUESTIONS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="512" class="bxt-s" style="font-size:22px">ASK THEM IN THIS ORDER. STOP WHEN ONE ANSWERS YES.</text>
<line x1="118" y1="528" x2="1182" y2="528" stroke="#2C3841" stroke-width="2"/>

<circle cx="140" cy="556" r="15" fill="#0B1013" stroke="#3FD98A" stroke-width="2"/>
<text x="140" y="562" class="badge" text-anchor="middle">1</text>
<text x="170" y="552" class="bxt-s" style="font-size:20px;fill:#3FD98A">DID IT QUEUE, OR RUN SLOWLY?</text>
<text x="170" y="576" class="bxs-s" style="font-size:17px">queue_time vs execution_time in sys_query_history. A queuing problem is a WLM problem, not a SQL problem.</text>

<circle cx="140" cy="612" r="15" fill="#0B1013" stroke="#5AA9FF" stroke-width="2"/>
<text x="140" y="618" class="badge" text-anchor="middle">2</text>
<text x="170" y="608" class="bxt-s" style="font-size:20px;fill:#5AA9FF">ARE THE STATISTICS STALE?</text>
<text x="170" y="632" class="bxs-s" style="font-size:17px">stats_off in svv_table_info. ANALYZE is the cheapest fix there is, and it is the answer more often than anything else.</text>

<circle cx="140" cy="668" r="15" fill="#0B1013" stroke="#FF6B73" stroke-width="2"/>
<text x="140" y="674" class="badge" text-anchor="middle">3</text>
<text x="170" y="664" class="bxt-s" style="font-size:20px;fill:#FF6B73">IS ANYTHING BEING BROADCAST?</text>
<text x="170" y="688" class="bxs-s" style="font-size:17px">Search the EXPLAIN plan for DS_BCAST_INNER. Then make the small side DISTSTYLE ALL.</text>

<circle cx="140" cy="724" r="15" fill="#0B1013" stroke="#FFB84D" stroke-width="2"/>
<text x="140" y="730" class="badge" text-anchor="middle">4</text>
<text x="170" y="720" class="bxt-s" style="font-size:20px;fill:#FFB84D">IS IT SPILLING TO DISK?</text>
<text x="170" y="744" class="bxs-s" style="font-size:17px">is_diskbased in svl_query_summary. Caused by broadcast, oversized VARCHARs, or too many WLM slots.</text>

<circle cx="140" cy="780" r="15" fill="#0B1013" stroke="#C9D6DE" stroke-width="2"/>
<text x="140" y="786" class="badge" text-anchor="middle">5</text>
<text x="170" y="776" class="bxt-s" style="font-size:20px">IS IT SCANNING MORE THAN IT NEEDS?</text>
<text x="170" y="800" class="bxs-s" style="font-size:17px">rows vs rows_pre_filter in stl_scan. A bad ratio means the zone maps are not pruning.</text>

<rect x="118" y="820" width="1064" height="52" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="852" class="code" xml:space="preserve" style="fill:#8CE8B8">6 · only now rewrite the SQL. it is rarely the SQL.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sqlc">-- step 4: did any step spill?</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">SELECT</tspan> step, label, rows,</text>
<text x="1298" y="554" class="sql">       is_diskbased, workmem</text>
<text x="1298" y="578" class="sql"><tspan class="sqlk">FROM</tspan>   svl_query_summary</text>
<text x="1298" y="602" class="sql"><tspan class="sqlk">WHERE</tspan>  query = 123456</text>
<text x="1298" y="626" class="sql"><tspan class="sqlk">ORDER BY</tspan> stm, seg, step;</text>
<text x="1298" y="656" class="sqlc">-- any &apos;t&apos; here is your answer</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">The first run includes compilation. Always</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">time the second, with the cache off.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Change one thing at a time, and re-measure.</text>
<text x="1298" y="852" class="warn">confirm with EXPLAIN, not a stopwatch</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A mechanic checks the fuel before rebuilding the engine. Five cheap checks come before the expensive one, and four times in five you never reach it.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 44</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
