<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 08</text>
<text x="90" y="168" class="title">CREATE TABLE, Anatomy Of</text>
<text x="90" y="212" class="sub">The clauses that look like Postgres and mean something different &#8212; and the three that only exist here.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Physical layout is part of the schema, declared at create time</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">In Postgres you create the table and add indexes later. Here, distribution and sort are properties of the table itself &#8212; and changing them means rebuilding it.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">THE CLAUSES, AND WHICH ONES ACTUALLY MATTER</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">DISTSTYLE / DISTKEY</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">Lesson 15</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Where rows land across slices. The single biggest lever on join performance, and the hardest to change afterwards.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">SORTKEY</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">Lesson 16</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Physical order on disk. Lets Redshift skip whole blocks that cannot satisfy your WHERE clause. Usually the date column.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">ENCODE</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">per column</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Compression, chosen per column. AUTO is good; specifying it matters on very large facts. Lesson 17.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">PRIMARY KEY &#183; NOT NULL</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">only NOT NULL is enforced</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">NOT NULL is real. PRIMARY KEY, UNIQUE and FOREIGN KEY are <tspan style="fill:#FFFFFF">informational only</tspan> &#8212; they inform the planner, nothing more (Lesson 18).</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">get DISTKEY and SORTKEY right at create time — everything else is tunable later</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sql"><tspan class="sqlk">CREATE TABLE</tspan> gold.fct_sales_line (</text>
<text x="1298" y="530" class="sql">  sale_date   <tspan class="sqlk">DATE</tspan>    <tspan class="sqlk">NOT NULL</tspan>,</text>
<text x="1298" y="552" class="sql">  store_sk    <tspan class="sqlk">BIGINT</tspan>  <tspan class="sqlk">NOT NULL</tspan>,</text>
<text x="1298" y="574" class="sql">  product_sk  <tspan class="sqlk">BIGINT</tspan>  <tspan class="sqlk">NOT NULL</tspan>,</text>
<text x="1298" y="596" class="sql">  net_amount  <tspan class="sqlk">DECIMAL</tspan>(14,2)</text>
<text x="1298" y="618" class="sql">)</text>
<text x="1298" y="640" class="sql"><tspan class="sqlk">DISTKEY</tspan> (store_sk)</text>
<text x="1298" y="662" class="sql"><tspan class="sqlk">SORTKEY</tspan> (sale_date);</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">You cannot ALTER a DISTKEY or SORTKEY on an</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">existing table &#8212; you rebuild and swap.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">There is no CREATE INDEX to fall back on.</text>
<text x="1298" y="852" class="warn">design it before you load it</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">In Postgres you build the shelves and label them later. Here the labels are part of the shelf, and re-labelling means rebuilding.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 08</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
