<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 03</text>
<text x="90" y="168" class="title">Provisioned vs Serverless</text>
<text x="90" y="212" class="sub">Two ways to buy the same engine. Serverless splits the data from the compute into two objects you will meet constantly.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Same SQL, same features. You are choosing how capacity is bought.</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Provisioned: you pick nodes and they run until you stop them. Serverless: you pick a capacity range and it scales with load. We use Serverless.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR TERMS YOU WILL SEE EVERY DAY</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">NAMESPACE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">the data</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Databases, schemas, tables, users, snapshots. Everything that persists. It exists whether or not anything is running.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">WORKGROUP</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">the compute</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Capacity, network placement, security groups, endpoint. You connect to a workgroup; it reads a namespace.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">RPU</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">Redshift Processing Unit</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">The unit of Serverless capacity, billed per second while queries run. You set a base and a maximum.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">NODE TYPE (PROVISIONED)</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">RA3 uses managed storage</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">If you meet a provisioned cluster, the node type decides slices per node and whether storage scales separately.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">one namespace can be read by more than one workgroup</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="512" class="sqlc">-- where am I, and as whom?</text>
<text x="1298" y="536" class="sql"><tspan class="sqlk">SELECT</tspan> current_database(), current_user,</text>
<text x="1298" y="560" class="sql">       version();</text>
<text x="1298" y="596" class="sqlc">-- what has Serverless been doing?</text>
<text x="1298" y="620" class="sql"><tspan class="sqlk">SELECT</tspan> * <tspan class="sqlk">FROM</tspan> sys_serverless_usage</text>
<text x="1298" y="644" class="sql"><tspan class="sqlk">ORDER BY</tspan> end_time <tspan class="sqlk">DESC LIMIT</tspan> 20;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Serverless is not free when idle &#8212; a dashboard</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">polling every minute keeps it awake all night.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Max RPU is a cost ceiling, not a target.</text>
<text x="1298" y="852" class="warn">find out what queries at 3am</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The namespace is the warehouse and its stock. The workgroup is the shift of staff you have booked to work in it today.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 03</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
