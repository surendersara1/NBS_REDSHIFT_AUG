<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 39 · ⭐ THE ONE FOR YOU</text>
<text x="90" y="168" class="title">Calling Redshift From Node.js</text>
<text x="90" y="212" class="sub">Two clients, two completely different mental models. Choosing the wrong one is the most expensive mistake in this module.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Data API for jobs. A pg pool for interactive reads.</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">The Data API is HTTPS, asynchronous and IAM-authenticated &#8212; no VPC, no pool, no password. node-postgres is a real connection you must manage.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">THE FOUR HABITS TO UNLEARN</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#FF6B73">NO ROW-AT-A-TIME INSERTS</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">write to S3, then COPY</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">A loop of INSERTs is the number one way to destroy a Redshift cluster. Batch to S3 and COPY, always.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">SUBMIT, POLL, FETCH</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">the Data API is not await-a-result</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">ExecuteStatement returns an Id immediately. You poll DescribeStatement, then call GetStatementResult.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">NO SESSION STATE BY DEFAULT</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">unless you pass SessionId</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Each Data API call may land on a new session, so temp tables and SET vanish. Use BatchExecuteStatement or reuse a session.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#3FD98A">PARAMETERS, NEVER CONCATENATION</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">injection and cache misses</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Interpolated literals are injectable and produce a new query shape every call, so nothing is ever compiled twice.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">Redshift is not your OLTP database. Do not treat it like one.</text>

<text x="1270" y="462" class="zsql">3 · THE CODE</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sqlc">// submit &#8212; returns an Id, not rows</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">const</tspan> { Id } = <tspan class="sqlk">await</tspan> rs.send(</text>
<text x="1298" y="554" class="sql">  <tspan class="sqlk">new</tspan> ExecuteStatementCommand({</text>
<text x="1298" y="578" class="sql">    WorkgroupName, Database, Sql,</text>
<text x="1298" y="602" class="sql">    Parameters: [{ name: <tspan class="sqlc">'d'</tspan>,</text>
<text x="1298" y="626" class="sql">                   value: batchDate }],</text>
<text x="1298" y="650" class="sql">  }));</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Data API parameters are all strings, and</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">results come back as typed union fields.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Results paginate &#8212; follow NextToken.</text>
<text x="1298" y="852" class="warn">a serverless connection is not free to open</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">You post the job and get a ticket number. You come back for the result. It is a courier, not a phone call &#8212; and that changes how you write the code around it.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 39</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
