<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 21</text>
<text x="90" y="168" class="title">COPY In Depth</text>
<text x="90" y="212" class="sub">The only load path that scales. Every slice reads its own file in parallel &#8212; which is why the number of files matters as much as the SQL.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Many files in, read in parallel, one file per slice at a time</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">One enormous file is read by one slice while the rest idle. Aim for a multiple of your slice count, each roughly 100MB&#8211;1GB compressed.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR THINGS THAT DECIDE HOW FAST IT LOADS</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">FILE COUNT AND SIZE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">multiple of slice count</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">The single biggest factor. Sixteen slices and one file means fifteen idle workers; sixteen files means all of them working.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">FORMAT</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">PARQUET &gt; CSV</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Parquet is typed and columnar, so there is no parsing and no guessing. CSV needs delimiters, quoting and NULL handling declared.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">A MANIFEST FOR EXACTNESS</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">MANIFEST</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">A prefix loads whatever happens to be there. A manifest names the exact files &#8212; which is what makes a load reproducible.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">COMPRESSION ON FIRST LOAD</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">empty table only</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">COPY into an empty table with no encodings samples the data and applies compression. Into a populated table it does not.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">one big file is the most common reason a load is slow</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sql"><tspan class="sqlk">COPY</tspan> staging.sales_line</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">FROM</tspan> 's3://bucket/raw/sales/dt=2026-08-12/'</text>
<text x="1298" y="552" class="sql"><tspan class="sqlk">IAM_ROLE</tspan> 'arn:aws:iam::...:role/rs-loader'</text>
<text x="1298" y="574" class="sql"><tspan class="sqlk">FORMAT AS PARQUET</tspan>;</text>
<text x="1298" y="610" class="sqlc">-- CSV needs more said out loud</text>
<text x="1298" y="632" class="sql"><tspan class="sqlk">COPY</tspan> t <tspan class="sqlk">FROM</tspan> 's3://.../' <tspan class="sqlk">IAM_ROLE</tspan> '...'</text>
<text x="1298" y="650" class="sql"><tspan class="sqlk">CSV IGNOREHEADER</tspan> 1 <tspan class="sqlk">GZIP</tspan></text>
<text x="1298" y="670" class="sql"><tspan class="sqlk">TIMEFORMAT</tspan> 'auto' <tspan class="sqlk">BLANKSASNULL</tspan>;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">COPY is not idempotent &#8212; running it twice</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">loads the rows twice. Stage, then MERGE.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A prefix picks up files you did not expect.</text>
<text x="1298" y="852" class="warn">never COPY straight into a live table</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Sixteen people at the loading bay. Send one enormous crate and fifteen of them watch; send sixteen and the lorry empties in a sixteenth of the time.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 21</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
