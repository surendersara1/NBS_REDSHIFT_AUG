<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 36</text>
<text x="90" y="168" class="title">Control Flow, Cursors and Exceptions</text>
<text x="90" y="212" class="sub">Everything PL/pgSQL gives you for branching and error handling &#8212; and the loop you must train yourself not to write.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Branching for the pipeline, not for the rows</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Use IF and loops to decide what step runs next. The moment a loop iterates over data rows, you have turned a columnar engine back into a row engine.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">THE FOUR CONSTRUCTS THAT MATTER</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">IF / ELSIF / WHILE / FOR</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">orchestration only</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Skip a step when the batch is empty, loop over a list of ten source tables, retry once. All good uses.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">RAISE &#8212; YOUR ONLY PRINTF</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">INFO, NOTICE, EXCEPTION</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">RAISE INFO writes to the client; RAISE EXCEPTION aborts. There is no debugger here, so log deliberately.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">EXCEPTION WHEN OTHERS</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">OTHERS is the only condition</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">You cannot catch a specific SQL state. Read SQLERRM, write it to an audit table, then re-raise &#8212; never swallow it.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">CURSORS &#8212; ALMOST NEVER</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">a row loop on a columnar engine</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">A cursor over a million rows will run for hours where one MERGE takes seconds. Legitimate only for returning a result set.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">a loop over rows is a bug report you have not filed yet</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sql"><tspan class="sqlk">EXCEPTION WHEN OTHERS THEN</tspan></text>
<text x="1298" y="530" class="sql">  <tspan class="sqlk">INSERT INTO</tspan> etl.run_log</text>
<text x="1298" y="554" class="sql">  <tspan class="sqlk">VALUES</tspan> (run_id, 'FAILED',</text>
<text x="1298" y="578" class="sql">          <tspan class="sqlk">SQLERRM</tspan>, <tspan class="sqlk">GETDATE</tspan>());</text>
<text x="1298" y="608" class="sqlc">-- then hand the error back up</text>
<text x="1298" y="632" class="sql">  <tspan class="sqlk">RAISE</tspan>;</text>
<text x="1298" y="662" class="sqlc">-- silence here costs you a night</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">In an atomic procedure the whole thing rolls</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">back &#8212; including your log row.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Log the failure from the caller, or go</text>
<text x="1298" y="852" class="warn">NONATOMIC on purpose</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Decide which recipes to cook. Do not stand at the counter chopping one onion at a time when the machine will do the whole crate in one pass.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 36</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
