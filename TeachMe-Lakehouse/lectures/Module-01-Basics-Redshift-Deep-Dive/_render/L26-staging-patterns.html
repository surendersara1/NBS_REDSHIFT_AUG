<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 26</text>
<text x="90" y="168" class="title">Staging Patterns</text>
<text x="90" y="212" class="sub">Land it, check it, then move it. The validation gate between staging and the live table is the cheapest quality control you will ever build.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Never write directly into a table someone is querying</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Staging gives you somewhere to count rows, check keys and abandon a bad batch &#8212; while abandoning it is still free and nobody has seen it.</text>

<text x="90" y="462" class="zhow">2 · THE FOUR STEPS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">LAND &#183; VALIDATE &#183; MOVE &#183; CLEAN</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">1 &#183; LAND</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">CREATE TABLE LIKE</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">TRUNCATE the staging table, then COPY into it. Build staging with LIKE so it inherits the target&#8217;s distribution and sort.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">2 &#183; VALIDATE &#8212; THE GATE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">fail here, cheaply</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Row count in range, no null keys, no duplicate merge keys, business total within tolerance of the source. Any failure stops the load here.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">3 &#183; MOVE, IN ONE TRANSACTION</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">MERGE or rename-swap</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">MERGE for scattered rows; rename-swap for a full rebuild. Either way readers see the old table or the new one, never a half-loaded one.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">4 &#183; CLEAN UP</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">TRUNCATE, not DELETE</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Empty staging afterwards. Keep the table itself so its design and grants persist &#8212; recreating it every night loses both.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">a load that cannot be abandoned safely is not finished</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- the rename swap, atomically</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">BEGIN</tspan>;</text>
<text x="1298" y="556" class="sql">  <tspan class="sqlk">ALTER TABLE</tspan> gold.fct  <tspan class="sqlk">RENAME TO</tspan> fct_old;</text>
<text x="1298" y="580" class="sql">  <tspan class="sqlk">ALTER TABLE</tspan> gold.fct_new <tspan class="sqlk">RENAME TO</tspan> fct;</text>
<text x="1298" y="604" class="sql"><tspan class="sqlk">COMMIT</tspan>;</text>
<text x="1298" y="628" class="sql"><tspan class="sqlk">DROP TABLE</tspan> gold.fct_old;</text>
<text x="1298" y="664" class="sqlc">-- readers never see neither table</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A rename swap breaks bound views &#8212; use</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">WITH NO SCHEMA BINDING (Lesson 11).</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Grants follow the table, not the name.</text>
<text x="1298" y="852" class="warn">re-grant after a swap, or check first</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Unload at the bay, check the delivery against the note, then move it to the shelves. Nobody shops in the loading bay.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 26</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
