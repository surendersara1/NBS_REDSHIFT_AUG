<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 19</text>
<text x="90" y="168" class="title">AUTO &#8212; When To Let Redshift Decide</text>
<text x="90" y="212" class="sub">Redshift can choose distribution, sort and encoding for you, and change its mind later. Useful &#8212; and not a substitute for knowing your own join pattern.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Automatic Table Optimization watches your queries and rewrites the table</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">It observes real workload, recommends a distribution and sort key, and applies them in the background. It is genuinely good &#8212; and it needs time and evidence.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">WHAT AUTO ACTUALLY DOES</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">DISTSTYLE AUTO</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">ALL &#8594; EVEN &#8594; KEY</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Starts a small table as ALL, converts to EVEN as it grows, and may adopt a KEY once it sees a repeated join.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">SORTKEY AUTO</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">from observed filters</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Picks a sort column from the predicates it sees repeatedly, and reorganises the table in the background.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">ENCODE AUTO</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">on first COPY</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Samples the incoming data on a COPY into an empty table and applies compression. This one is nearly always right.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">IT NEEDS TIME AND EVIDENCE</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">days, not minutes</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Before it has seen a workload it guesses. On a big fact table you already know the join column &#8212; state it rather than wait.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">AUTO where you do not know · explicit where you do</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- what does Redshift want to change?</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">SELECT</tspan> type, database, table_name,</text>
<text x="1298" y="556" class="sql">       group_id, ddl, auto_eligible</text>
<text x="1298" y="580" class="sql"><tspan class="sqlk">FROM</tspan>   svv_alter_table_recommendations;</text>
<text x="1298" y="616" class="sqlc">-- what has it already done?</text>
<text x="1298" y="640" class="sql"><tspan class="sqlk">SELECT</tspan> * <tspan class="sqlk">FROM</tspan> svl_auto_worker_action</text>
<text x="1298" y="664" class="sql"><tspan class="sqlk">ORDER BY</tspan> eventtime <tspan class="sqlk">DESC LIMIT</tspan> 50;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Reorganisation runs in the background and</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">consumes capacity you did not schedule.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Stating a key disables AUTO for that table.</text>
<text x="1298" y="852" class="warn">do not benchmark a table AUTO is rewriting</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Autopilot is excellent on a route it has flown before. On the first flight, and on the one that matters most, somebody should still be flying.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 19</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
