<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 04</text>
<text x="90" y="168" class="title">Redshift Managed Storage</text>
<text x="90" y="212" class="sub">Storage sits on S3 with a local SSD cache in front of it. That is why you size compute for queries and stop thinking about disk.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Compute and storage scale independently &#8212; and are billed separately</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">In your app database, running out of disk means a bigger machine. Here, storage grows on its own and compute is sized for the query load alone.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR CONSEQUENCES WORTH KNOWING</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">S3 UNDERNEATH, SSD IN FRONT</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">automatic tiering</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Hot blocks stay on local SSD; cold blocks live in S3 and are fetched on demand. You do not manage this.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">PETABYTE SCALE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">no capacity planning</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">You will not run out of space and have to migrate. That entire class of operational work disappears.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">CHEAP SNAPSHOTS</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">incremental</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Backups are incremental against RMS, so they are fast to take and restore, and cheap to keep.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">DATA SHARING BECOMES POSSIBLE</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">datashares</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Because storage is decoupled, another warehouse can read your live data without a copy being made.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">you can outgrow your compute. you will not outgrow your storage.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="512" class="sqlc">-- what is actually taking space?</text>
<text x="1298" y="536" class="sql"><tspan class="sqlk">SELECT</tspan> "schema", "table",</text>
<text x="1298" y="560" class="sql">       size <tspan class="sqlk">AS</tspan> mb, tbl_rows,</text>
<text x="1298" y="584" class="sql">       pct_used</text>
<text x="1298" y="608" class="sql"><tspan class="sqlk">FROM</tspan>   svv_table_info</text>
<text x="1298" y="632" class="sql"><tspan class="sqlk">ORDER BY</tspan> size <tspan class="sqlk">DESC LIMIT</tspan> 20;</text>
<text x="1298" y="666" class="sqlc">-- size is in MB, per table</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Only RA3 and Serverless use RMS. Older DC2</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">clusters have fixed local storage.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Deleted rows still occupy space until VACUUM.</text>
<text x="1298" y="852" class="warn">storage is cheap, not free</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A shop with an unlimited stockroom next door and a small shelf behind the counter. Popular stock stays on the shelf; the rest is fetched.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 04</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
