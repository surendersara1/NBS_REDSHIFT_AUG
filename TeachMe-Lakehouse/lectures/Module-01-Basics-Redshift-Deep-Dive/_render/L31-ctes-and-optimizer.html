<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 31</text>
<text x="90" y="168" class="title">CTEs, Subqueries and the Optimizer</text>
<text x="90" y="212" class="sub">A CTE is not a temp table. Referencing one twice can execute it twice &#8212; which is how a tidy-looking query quietly does the work three times.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">WITH is readability, not materialisation</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Redshift generally inlines a CTE into the surrounding query. That is usually good &#8212; and it means a CTE referenced three times may be computed three times.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR RULES OF THUMB</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">REFERENCED ONCE &#8594; USE A CTE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">free readability</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Inlined, so it costs nothing and makes a long query readable. Name the steps and the SQL documents itself.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FFB84D">REFERENCED TWICE &#8594; TEMP TABLE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">compute once, reuse</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">If an expensive CTE is used more than once, materialise it yourself with CREATE TEMP TABLE and let every reference read the result.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FF6B73">CORRELATED SUBQUERY &#8594; REWRITE</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">it becomes a loop</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">A subquery referencing the outer row runs per row. Turn it into a join or a window function &#8212; almost always possible.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#5AA9FF">FILTER EARLY, INSIDE THE CTE</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">help the pruning</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Put the date predicate where the table is scanned, not in the outer query. It keeps zone-map pruning available (Lesson 16).</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">check the plan — the CTE you assumed ran once may appear twice</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- expensive, and used twice: materialise</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">CREATE TEMP TABLE</tspan> daily <tspan class="sqlk">AS</tspan></text>
<text x="1298" y="556" class="sql"><tspan class="sqlk">SELECT</tspan> sale_date, store_sk,</text>
<text x="1298" y="580" class="sql">       <tspan class="sqlk">SUM</tspan>(net_amount) <tspan class="sqlk">AS</tspan> net</text>
<text x="1298" y="604" class="sql"><tspan class="sqlk">FROM</tspan>   gold.fct_sales_line</text>
<text x="1298" y="628" class="sql"><tspan class="sqlk">WHERE</tspan>  sale_date &gt;= '2026-01-01'</text>
<text x="1298" y="652" class="sql"><tspan class="sqlk">GROUP BY</tspan> 1, 2;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A temp table has no stats until you ANALYZE it,</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">so the next join may be planned badly.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Give temp tables a DISTKEY if you join them.</text>
<text x="1298" y="852" class="warn">ANALYZE your temp tables</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A CTE is a name for a step, not a saved result. Ask for the same expensive step three times and you may pay for it three times.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 31</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
