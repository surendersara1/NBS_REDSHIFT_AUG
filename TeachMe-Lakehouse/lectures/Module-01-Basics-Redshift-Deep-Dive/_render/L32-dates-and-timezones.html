<div id="slide">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 32</text>
<text x="90" y="168" class="title">Dates, Times and Time Zones</text>
<text x="90" y="212" class="sub">Tamimi runs in Asia/Riyadh. Redshift runs in UTC. Every &#8220;yesterday&#8217;s sales are wrong&#8221; ticket you will ever get lives in that gap.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Store UTC. Convert once, at the reporting boundary.</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">A business day is a local-time concept; a timestamp is a physical instant. Keep the two apart, and label every column so nobody has to guess which it is.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">THE FOUR THINGS TO GET RIGHT</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">TIMESTAMP vs TIMESTAMPTZ</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">pick one, everywhere</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">TIMESTAMP stores no zone and is assumed UTC. TIMESTAMPTZ normalises to UTC on write. Mixing them across tables causes silent drift.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">DATE_TRUNC AND THE GRAIN</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">day, week, month</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">DATE_TRUNC('day', ts) is how you get a reporting grain. Truncate the converted local time, never the raw UTC value.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">A REAL DATE DIMENSION</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">fiscal calendars live here</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Fiscal periods, Ramadan, weekends that start Friday &#8212; none of that is derivable from a timestamp. It belongs in dim_date.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">SARGABLE PREDICATES ONLY</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">or you lose the zone map</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Wrapping the sort column in a function defeats pruning. Compare the bare column to a computed literal range instead.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">name it: loaded_at_utc, sale_date_local. never just &apos;date&apos;.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sqlc">-- UTC instant to the local day</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">SELECT</tspan> <tspan class="sqlk">DATE_TRUNC</tspan>('day',</text>
<text x="1298" y="554" class="sql">  <tspan class="sqlk">CONVERT_TIMEZONE</tspan>('UTC',</text>
<text x="1298" y="578" class="sql">    'Asia/Riyadh', sold_at_utc))::<tspan class="sqlk">DATE</tspan></text>
<text x="1298" y="602" class="sql">    <tspan class="sqlk">AS</tspan> sale_date_local</text>
<text x="1298" y="632" class="sqlc">-- sargable: bare column, literal range</text>
<text x="1298" y="656" class="sql"><tspan class="sqlk">WHERE</tspan> sold_at_utc &gt;= '2026-08-09T21:00Z'</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">GETDATE() is UTC, not the store&#8217;s clock.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">CURRENT_DATE in a WHERE makes the load</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">non-reproducible &#8212; pass the date in.</text>
<text x="1298" y="852" class="warn">never DATE_TRUNC the sort key</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The warehouse keeps one clock so every store agrees on what happened first. You translate to local time once, at the very end, for the human reading the report.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 32</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
