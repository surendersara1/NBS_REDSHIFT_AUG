<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 09</text>
<text x="90" y="168" class="title">Data Types That Will Bite You</text>
<text x="90" y="212" class="sub">Four differences from Postgres that cause real bugs &#8212; and one of them silently loses money.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">The type list looks familiar. Four entries behave differently enough to matter.</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Column width is not free here, there is no TEXT, floating point is the wrong choice for money, and JSON is a type called SUPER.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR THAT CATCH POSTGRES DEVELOPERS</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#FF6B73">VARCHAR WIDTH COSTS</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">no TEXT type</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Width affects the memory a query reserves per row. Declaring everything VARCHAR(65535) will make joins and sorts spill to disk.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FFB84D">VARCHAR COUNTS BYTES</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">not characters</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">A multi-byte character can consume four. Arabic and emoji overflow columns sized by counting letters &#8212; a real risk on this data.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#3FD98A">DECIMAL FOR MONEY</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">never FLOAT</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">FLOAT and DOUBLE are approximate. Sum a million of them and the total will not reconcile, and nobody will know why.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#5AA9FF">TIMESTAMP vs TIMESTAMPTZ</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">Lesson 32</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">TIMESTAMP has no zone. Pick one convention across the whole warehouse and write it down, or you get off-by-one-day bugs forever.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">size VARCHAR to the data, not to the maximum you can imagine</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- how wide is the data really?</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">SELECT</tspan> max(octet_length(product_name))</text>
<text x="1298" y="556" class="sql">         <tspan class="sqlk">AS</tspan> max_bytes,</text>
<text x="1298" y="580" class="sql">       max(length(product_name))</text>
<text x="1298" y="604" class="sql">         <tspan class="sqlk">AS</tspan> max_chars</text>
<text x="1298" y="628" class="sql"><tspan class="sqlk">FROM</tspan>   staging.products;</text>
<text x="1298" y="662" class="sqlc">-- size the column from max_bytes</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">COPY fails on a value one byte too long &#8212;</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">and the message names the row, not the fix.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Widening a column later means a rebuild.</text>
<text x="1298" y="852" class="warn">measure the data before you size it</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Declaring every column as huge &#8220;just in case&#8221; is like booking a coach for every passenger. It fits, and it costs you the whole journey.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 09</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
