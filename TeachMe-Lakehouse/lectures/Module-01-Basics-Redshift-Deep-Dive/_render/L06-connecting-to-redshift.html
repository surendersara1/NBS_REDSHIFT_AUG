<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 06</text>
<text x="90" y="168" class="title">Connecting To Redshift</text>
<text x="90" y="212" class="sub">Four ways in. As a Node developer your instinct is a connection pool &#8212; and for most of what you will write, that is the wrong one.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Redshift speaks the Postgres wire protocol &#8212; but it is not an app database</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Connections are a scarce, expensive resource here, and warehouse queries take seconds not milliseconds. Holding a pool open is a habit worth losing.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR DOORS, AND WHEN EACH IS RIGHT</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">REDSHIFT DATA API</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">@aws-sdk/client-redshift-data</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">HTTPS, IAM-authenticated, <tspan style="fill:#FFFFFF">no connection to hold</tspan>. Submit, poll, fetch. The right choice from Lambda and from almost all Node code.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">JDBC / ODBC</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">port 5439</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">What BI tools use. Also the `pg` driver from Node &#8212; correct for a long-lived service, wrong for a Lambda that runs for 400ms.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">QUERY EDITOR V2</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">in the console</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Browser SQL with saved queries and result export. Where you will actually live while learning. No local setup at all.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">psql</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">yes, really</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">The Postgres CLI connects. Handy for scripting and for anyone who already lives in a terminal.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">from Lambda, use the Data API. always. see Lesson 39.</text>

<text x="1270" y="462" class="zsql">3 · THE CODE</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="512" class="sqlc">// Node, no connection held</text>
<text x="1298" y="536" class="sql"><tspan class="sqlk">const</tspan> c = <tspan class="sqlk">new</tspan> RedshiftDataClient({});</text>
<text x="1298" y="560" class="sql"><tspan class="sqlk">const</tspan> { Id } = <tspan class="sqlk">await</tspan> c.send(</text>
<text x="1298" y="584" class="sql">  <tspan class="sqlk">new</tspan> ExecuteStatementCommand({</text>
<text x="1298" y="608" class="sql">    WorkgroupName, Database,</text>
<text x="1298" y="632" class="sql">    Sql: 'select count(*) from sales' }));</text>
<text x="1298" y="666" class="sqlc">// then poll Describe/GetResult by Id</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">The Data API is asynchronous. You submit and</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">poll &#8212; it does not block like `pg` does.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A pool in Lambda leaks connections.</text>
<text x="1298" y="852" class="warn">connections are scarce here</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">You do not keep a phone line open to the warehouse all day. You send the order, get a ticket number, and collect the result when it is ready.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 06</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
