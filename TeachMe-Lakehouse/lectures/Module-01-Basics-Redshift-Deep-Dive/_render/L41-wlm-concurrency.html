<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 41 · PART G</text>
<text x="90" y="168" class="title">Workload Management</text>
<text x="90" y="212" class="sub">Redshift runs a handful of queries at once on purpose. Everything else queues. WLM is how you decide who waits.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Memory is the scarce resource, not CPU</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">A slot is a share of memory. More slots means smaller shares and more spilling to disk. Fewer, larger slots almost always beat many small ones.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR LEVERS, IN THE ORDER YOU SHOULD REACH FOR THEM</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">AUTO WLM &#8212; LEAVE IT ON</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">the right default</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Redshift sizes memory and concurrency per query from its own history. Manual WLM is for a problem you can prove auto cannot solve.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">QUEUES AND QUERY PRIORITY</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">separate ETL from dashboards</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Route by user group or query group, then set priority. A dashboard should not sit behind a backfill.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">QMR &#8212; RULES THAT ACT</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">log, hop, or abort</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Abort anything scanning a billion rows from the dashboard queue. This is how you stop one bad query ruining a morning.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">CONCURRENCY SCALING</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">bursts, and it bills</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Extra clusters spin up for queued read queries. One free hour per day of accrued credit; beyond that it costs.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">fix the query before you tune the queue</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sqlc">-- am I queuing, or just slow?</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">SELECT</tspan> query_id, queue_time/1e6,</text>
<text x="1298" y="554" class="sql">       execution_time/1e6,</text>
<text x="1298" y="578" class="sql">       service_class</text>
<text x="1298" y="602" class="sql"><tspan class="sqlk">FROM</tspan>   sys_query_history</text>
<text x="1298" y="626" class="sql"><tspan class="sqlk">WHERE</tspan>  queue_time &gt; 0</text>
<text x="1298" y="650" class="sql"><tspan class="sqlk">ORDER BY</tspan> 2 <tspan class="sqlk">DESC LIMIT</tspan> 20;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">More slots is not more throughput &#8212; it is</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">less memory each and more disk spill.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Concurrency scaling never helps writes.</text>
<text x="1298" y="852" class="warn">a big pg pool does not buy concurrency</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Four wide checkouts move a supermarket faster than twenty narrow ones where nobody can put their basket down. Slots are counter space.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 41</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
