<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 16</text>
<text x="90" y="168" class="title">Sort Keys and Zone Maps</text>
<text x="90" y="212" class="sub">How Redshift skips data it cannot possibly need. This is the mechanism that replaces an index on your WHERE clause.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Redshift stores min and max for every 1MB block, automatically</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">If a block&#8217;s range cannot satisfy your WHERE clause, it is never read. Sorting the table on the column you filter is what makes those ranges narrow.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR THINGS THAT DECIDE WHETHER IT WORKS</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">SORT ON WHAT YOU FILTER</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">usually the date</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">For almost every retail fact this is sale_date. A sort key on a column nobody filters costs you on every load and buys nothing.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">COMPOUND</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">the default, and usually right</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Sorted by the columns in order. Only helps when your filter starts with the first column &#8212; exactly like a composite index.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">INTERLEAVED</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">rarely worth it</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Equal weight to every column, so any one of them filters well. Expensive to maintain. Use only when filters genuinely vary.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">UNSORTED ROWS UNDO IT</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">svv_table_info.unsorted</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">New rows append unsorted. Once a table drifts, block ranges widen and skipping stops working. That is what VACUUM is for.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">unsorted &gt; 10% means your zone maps are already degrading</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- prove the skipping is happening</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">SELECT</tspan> <tspan class="sqlk">SUM</tspan>(blocks_read)  <tspan class="sqlk">AS</tspan> read,</text>
<text x="1298" y="556" class="sql">       <tspan class="sqlk">SUM</tspan>(blocks_skipped) <tspan class="sqlk">AS</tspan> skipped</text>
<text x="1298" y="580" class="sql"><tspan class="sqlk">FROM</tspan>   stl_scan</text>
<text x="1298" y="604" class="sql"><tspan class="sqlk">WHERE</tspan>  query = pg_last_query_id();</text>
<text x="1298" y="638" class="sqlc">-- has the table drifted unsorted?</text>
<text x="1298" y="662" class="sql"><tspan class="sqlk">SELECT</tspan> "table", sortkey1, unsorted <tspan class="sqlk">FROM</tspan> svv_table_info;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A function on the sort column defeats it:</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">WHERE date_trunc('month', sale_date) = ...</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Filter on a range instead.</text>
<text x="1298" y="852" class="warn">never wrap the sort key in a function</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Filing cabinets labelled by date. Asked for last week, you walk past the drawers marked 2024 without opening them.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 16</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
