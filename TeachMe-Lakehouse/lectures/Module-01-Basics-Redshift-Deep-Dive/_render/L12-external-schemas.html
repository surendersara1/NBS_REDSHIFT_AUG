<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 12</text>
<text x="90" y="168" class="title">External Schemas</text>
<text x="90" y="212" class="sub">Querying data you never loaded. An external schema is a pointer &#8212; the table appears, the bytes stay where they are.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Ordinary SQL, against storage Redshift does not own</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">You join an external table to a local one in a single statement. No load job, no second copy &#8212; and the cost moves from storage to every query.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">TWO KINDS, POINTING AT TWO DIFFERENT THINGS</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">SPECTRUM &#8594; S3</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">FROM DATA CATALOG</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Reads files in the lake through the Glue catalog: Parquet, ORC, CSV, JSON, Avro &#8212; plus Iceberg, Hudi CoW and Delta.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">FEDERATED &#8594; LIVE DATABASE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">FROM POSTGRES / MYSQL</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Reads a live RDS or Aurora PostgreSQL or MySQL database as it is right now. Filters are pushed down to the source.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">GOVERNANCE MOVES</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">Lake Formation</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Redshift GRANT governs local tables. Anything read through the catalog is governed by Lake Formation instead &#8212; two systems, one query.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">READ, MOSTLY</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">verify before promising</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Spectrum&#8217;s read support is broad. Its write support is narrow and format-dependent &#8212; check for your case rather than assuming symmetry.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">a pointer is not free — the work moves, it does not vanish</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sql"><tspan class="sqlk">CREATE EXTERNAL SCHEMA</tspan> lake_ext</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">FROM DATA CATALOG</tspan></text>
<text x="1298" y="552" class="sql"><tspan class="sqlk">DATABASE</tspan> 'silver'</text>
<text x="1298" y="574" class="sql"><tspan class="sqlk">IAM_ROLE</tspan> 'arn:aws:iam::...:role/spectrum';</text>
<text x="1298" y="608" class="sqlc">-- then join it like anything else</text>
<text x="1298" y="632" class="sql"><tspan class="sqlk">SELECT</tspan> f.*, s.region</text>
<text x="1298" y="650" class="sql"><tspan class="sqlk">FROM</tspan> gold.fct_sales_line f</text>
<text x="1298" y="670" class="sql"><tspan class="sqlk">JOIN</tspan> lake_ext.dim_store s <tspan class="sqlk">USING</tspan>(store_sk);</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">&#8220;Works in Athena, not in Redshift&#8221; is almost</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">always the two grant systems disagreeing.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Never point at production for an hourly report.</text>
<text x="1298" y="852" class="warn">know which system grants what</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A library card, not a photocopy. You can read the book any time &#8212; but you walk to the other building every single time you open it.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 12</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
