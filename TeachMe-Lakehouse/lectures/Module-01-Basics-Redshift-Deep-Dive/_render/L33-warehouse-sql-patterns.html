<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 33</text>
<text x="90" y="168" class="title">Warehouse SQL Patterns</text>
<text x="90" y="212" class="sub">Four shapes that cover most of what a warehouse team is ever asked to write. Learn them as patterns and you stop solving them from scratch.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">The recurring shapes of analytical SQL</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Application SQL is mostly lookups by key. Warehouse SQL is a small number of shapes applied over and over &#8212; each one a window function underneath.</text>

<text x="90" y="462" class="zhow">2 · THE FOUR PATTERNS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">RECOGNISE THE SHAPE, NOT THE QUESTION</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">DEDUPLICATION</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">ROW_NUMBER, rn = 1</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Latest row per key. The first step of every load, and the answer to &#8220;why is this count double what I expect&#8221;.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">SCD TYPE 2 HISTORY</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">valid_from, valid_to, is_current</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">A dimension that keeps its past. Close the old row, open a new one &#8212; so a report run for March still shows March&#8217;s prices.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">GAPS AND ISLANDS</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">date minus ROW_NUMBER</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Consecutive runs and the holes between them: days a store had no sales, or how long a promotion actually ran.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">PIVOT AND UNPIVOT</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">PIVOT, UNPIVOT, or CASE</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Rows to columns for a report, columns to rows to normalise a wide source file. Redshift has both keywords now.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">every one of these is a window function wearing a hat</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sqlc">-- islands: consecutive selling days</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">SELECT</tspan> store_sk,</text>
<text x="1298" y="554" class="sql">       <tspan class="sqlk">MIN</tspan>(d) <tspan class="sqlk">AS</tspan> run_start,</text>
<text x="1298" y="578" class="sql">       <tspan class="sqlk">MAX</tspan>(d) <tspan class="sqlk">AS</tspan> run_end,</text>
<text x="1298" y="602" class="sql">       <tspan class="sqlk">COUNT</tspan>(*) <tspan class="sqlk">AS</tspan> days</text>
<text x="1298" y="626" class="sql"><tspan class="sqlk">FROM</tspan>   marked</text>
<text x="1298" y="650" class="sql"><tspan class="sqlk">GROUP BY</tspan> store_sk, grp;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Overlapping SCD2 validity ranges double-count</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">history, and nothing errors.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Gaps need a date spine &#8212; missing rows cannot</text>
<text x="1298" y="852" class="warn">report themselves. test for overlaps</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A carpenter does not invent a new joint for every cabinet. Four joints, chosen well, build almost everything &#8212; and these are the four.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 33</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
