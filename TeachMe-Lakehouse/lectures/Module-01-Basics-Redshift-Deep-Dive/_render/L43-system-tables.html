<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 43</text>
<text x="90" y="168" class="title">The System Tables You Actually Use</text>
<text x="90" y="212" class="sub">There are hundreds. You need about twelve. Learn these and the warehouse stops being opaque.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">SYS_ views first, STL and SVV when you need detail</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">The SYS_ family is the modern monitoring interface and works on both provisioned and serverless. The older STL, STV, SVL and SVV views still hold detail SYS_ does not.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR YOU WILL OPEN EVERY WEEK</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">SYS_QUERY_HISTORY</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">what ran, how long, who</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Queue time, execution time, cache hits, status. The first place you look for anything at all.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">SVV_TABLE_INFO</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">size, skew, unsorted, stats</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">One row per table with every design number that matters. If you memorise one view, this is it.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">STL_LOAD_ERRORS</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">why COPY failed, per row</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">The offending line, the column, the raw value and the reason. Never guess at a load failure again.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">SVL_QUERY_SUMMARY</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">is_diskbased, rows per step</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">What actually happened, step by step, versus what EXPLAIN predicted. This is where spilling is confirmed.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">save these as views in an ops schema. type them once.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sqlc">-- the daily driver</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">SELECT</tspan> query_id, user_id,</text>
<text x="1298" y="554" class="sql">       queue_time/1e6 <tspan class="sqlk">AS</tspan> q,</text>
<text x="1298" y="578" class="sql">       execution_time/1e6 <tspan class="sqlk">AS</tspan> e,</text>
<text x="1298" y="602" class="sql">       <tspan class="sqlk">LEFT</tspan>(query_text, 60)</text>
<text x="1298" y="626" class="sql"><tspan class="sqlk">FROM</tspan>   sys_query_history</text>
<text x="1298" y="650" class="sql"><tspan class="sqlk">ORDER BY</tspan> e <tspan class="sqlk">DESC LIMIT</tspan> 20;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Times are microseconds. Divide by 1e6.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">History is retained for days, not months &#8212;</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">persist anything you want to trend.</text>
<text x="1298" y="852" class="warn">STL views are leader-node only</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The warehouse keeps a diary of everything it did and how long it took. Most people never open it, then wonder why the building is mysterious.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 43</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
