<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 18</text>
<text x="90" y="168" class="title">Constraints Are Hints, Not Rules</text>
<text x="90" y="212" class="sub">PRIMARY KEY does not prevent duplicates. It is informational, the planner reads it, and nothing enforces it &#8212; ever.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Only NOT NULL is enforced. Everything else is advice to the planner.</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Enforcing uniqueness would mean checking every slice on every insert. Redshift declines that trade &#8212; and hands the responsibility to you instead.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">WHAT IS ENFORCED, AND WHAT IS NOT</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">NOT NULL &#8212; ENFORCED</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">the only one</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">A NULL into a NOT NULL column fails the statement. Use it on every key column, deliberately.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FF6B73">PRIMARY KEY &#183; UNIQUE &#8212; NOT ENFORCED</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">informational</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Insert the same key twice and both rows are stored. No error, no warning, and a doubled number in a report tomorrow.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">DECLARE THEM ANYWAY</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">the planner uses them</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">The optimiser trusts them to eliminate joins and choose plans. A <tspan style="fill:#FFFFFF">wrong</tspan> declaration is worse than none &#8212; it can produce wrong results.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#5AA9FF">TEST INSTEAD</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">dbt unique / not_null</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Uniqueness becomes a test that runs after every load, not a promise the database makes. That is the habit to build on day one.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">if you need uniqueness, you have to check for it yourself</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- this succeeds. twice.</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">INSERT INTO</tspan> dim_store <tspan class="sqlk">VALUES</tspan> (1,'S001');</text>
<text x="1298" y="556" class="sql"><tspan class="sqlk">INSERT INTO</tspan> dim_store <tspan class="sqlk">VALUES</tspan> (1,'S001');</text>
<text x="1298" y="592" class="sqlc">-- so run this after every load</text>
<text x="1298" y="616" class="sql"><tspan class="sqlk">SELECT</tspan> store_sk, <tspan class="sqlk">COUNT</tspan>(*) <tspan class="sqlk">AS</tspan> n</text>
<text x="1298" y="640" class="sql"><tspan class="sqlk">FROM</tspan>   gold.dim_store</text>
<text x="1298" y="664" class="sql"><tspan class="sqlk">GROUP BY</tspan> 1 <tspan class="sqlk">HAVING COUNT</tspan>(*) &gt; 1;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A load that ran twice is the usual cause.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A false PRIMARY KEY can make the optimiser</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">drop a join and return wrong rows.</text>
<text x="1298" y="852" class="warn">never declare a key you have not tested</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A sign saying &#8220;staff only&#8221; is not a locked door. It tells people what to expect &#8212; it does not stop anyone walking through.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 18</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
