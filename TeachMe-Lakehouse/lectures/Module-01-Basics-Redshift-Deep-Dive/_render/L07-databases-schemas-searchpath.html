<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 07</text>
<text x="90" y="168" class="title">Databases, Schemas and search_path</text>
<text x="90" y="212" class="sub">The object hierarchy, and the one setting that decides which table your unqualified SQL actually hit.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">database &#8594; schema &#8594; table, and you cannot join across databases</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">That last part surprises people. One connection is to one database. Schemas &#8212; not databases &#8212; are how you separate layers, teams and environments inside it.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR THINGS THAT DECIDE WHICH TABLE YOU HIT</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">DATABASE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">one per connection</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">A hard boundary. To read another database you need a datashare or an external schema &#8212; not a three-part name.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">SCHEMA</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">raw · staging · gold</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Where the real separation happens. One schema per layer, and grants applied at schema level rather than table by table.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">search_path</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">per session</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">The ordered list of schemas searched for an unqualified name. Two people can run identical SQL and read different tables.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">public</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">the default dumping ground</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Exists by default and everyone can write to it. Revoke that on day one, or it fills with somebody&#8217;s scratch tables.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">always schema-qualify in anything committed to a repo</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="512" class="sql"><tspan class="sqlk">SHOW</tspan> search_path;</text>
<text x="1298" y="536" class="sql"><tspan class="sqlk">SET</tspan> search_path <tspan class="sqlk">TO</tspan> gold, staging, public;</text>
<text x="1298" y="572" class="sqlc">-- what schemas exist, and who owns them?</text>
<text x="1298" y="596" class="sql"><tspan class="sqlk">SELECT</tspan> schema_name, schema_owner,</text>
<text x="1298" y="620" class="sql">       schema_type</text>
<text x="1298" y="644" class="sql"><tspan class="sqlk">FROM</tspan>   svv_all_schemas</text>
<text x="1298" y="668" class="sql"><tspan class="sqlk">ORDER BY</tspan> 1;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Unqualified names in a script are a bug</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">waiting for someone else&#8217;s search_path.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">No cross-database joins. None.</text>
<text x="1298" y="852" class="warn">qualify everything you commit</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">search_path is the PATH variable of SQL. &#8220;It works on my machine&#8221; has exactly the same cause here as it does in a shell.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 07</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
