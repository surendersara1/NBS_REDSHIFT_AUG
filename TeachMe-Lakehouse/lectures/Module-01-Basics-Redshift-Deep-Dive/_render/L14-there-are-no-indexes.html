<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 14</text>
<text x="90" y="168" class="title">There Are No Indexes</text>
<text x="90" y="212" class="sub">The single hardest habit to unlearn. `CREATE INDEX` does not exist &#8212; and once you see what replaces it, you will not miss it.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">An index helps you find a few rows. A warehouse reads a great many.</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Indexes exist to avoid a full scan. Redshift <tspan style="fill:#FFFFFF">expects</tspan> to scan &#8212; so instead of an extra structure to look rows up in, it makes the scan itself cheap.</text>

<text x="90" y="462" class="zhow">2 · WHAT REPLACES IT</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR MECHANISMS, NONE OF THEM AN INDEX</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">SORT KEY &#8594; ZONE MAPS</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">skips blocks</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Redshift stores min and max per 1MB block. Sorted on `sale_date`, a query for one week reads only the blocks that could contain it.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">DIST KEY &#8594; NO DATA MOVEMENT</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">co-located joins</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Two tables distributed on the same key join slice-locally. The alternative is shipping rows between nodes, which is the real cost.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">COLUMNAR &#8594; FEWER BYTES</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">+ compression</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">You only read the columns you name, compressed. Three columns of two hundred is 1.5% of the table before compression even helps.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">STATISTICS &#8594; A GOOD PLAN</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">ANALYZE</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">The planner needs to know table sizes and value spread to choose a join strategy. Stale statistics are the closest thing to a &#8220;missing index&#8221;.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">an index avoids reading. Redshift makes reading cheap instead.</text>

<text x="1270" y="462" class="zsql">3 · THE TRANSLATION</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- Postgres instinct</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">CREATE INDEX</tspan> ON sales (sale_date);</text>
<text x="1298" y="552" class="sql"><tspan class="sqlk">CREATE INDEX</tspan> ON sales (store_id);</text>
<text x="1298" y="586" class="sqlc">-- Redshift equivalent, at CREATE time</text>
<text x="1298" y="608" class="sql"><tspan class="sqlk">CREATE TABLE</tspan> sales (...)</text>
<text x="1298" y="630" class="sql"><tspan class="sqlk">DISTKEY</tspan> (store_sk)   <tspan class="sqlc">-- the join</tspan></text>
<text x="1298" y="652" class="sql"><tspan class="sqlk">SORTKEY</tspan> (sale_date); <tspan class="sqlc">-- the filter</tspan></text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">You get ONE sort key and ONE dist key per</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">table &#8212; not fifteen indexes. Choose well.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Unsorted rows lose you zone maps entirely.</text>
<text x="1298" y="852" class="warn">one shot, at design time</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">An index is the contents page you use to find one chapter. Redshift instead keeps the whole book in date order and skips the years you did not ask for.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 14</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
