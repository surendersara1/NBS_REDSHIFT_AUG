<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 37</text>
<text x="90" y="168" class="title">User-Defined Functions</text>
<text x="90" y="212" class="sub">A function returns a value and can appear in a SELECT. A procedure cannot. That single difference decides which one you write.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Scalar logic, named once, reused everywhere</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">A UDF takes scalars and returns one scalar. It cannot read a table and it cannot write anything &#8212; that is what makes it safe to call a billion times.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">THREE KINDS, IN ORDER OF PREFERENCE</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">SQL UDF &#8212; ALWAYS FIRST CHOICE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">inlined, no overhead</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">A single SELECT expression. The planner folds it into the query, so it costs the same as writing the expression by hand.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FF6B73">PYTHON UDF &#8212; DO NOT USE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">end of support 30 Jun 2026</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Creation blocked since patch 198 (Oct 2025) and support ended June 2026. If you inherit one, migrate it to a Lambda UDF.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#5AA9FF">LAMBDA UDF &#8212; THE ESCAPE HATCH</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">covered in Lesson 38</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Any language, any library, any external call. Batched over the network, so cost and failure are now part of your query.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">STABLE, IMMUTABLE, VOLATILE</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">tells the planner what it may skip</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Mark a pure function IMMUTABLE and identical inputs are evaluated once. Get this wrong and you cache a wrong answer.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">if it fits in one SELECT expression, it is a SQL UDF.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sql"><tspan class="sqlk">CREATE OR REPLACE FUNCTION</tspan></text>
<text x="1298" y="530" class="sql">  f_net_of_vat(gross <tspan class="sqlk">DECIMAL</tspan>(18,4))</text>
<text x="1298" y="554" class="sql"><tspan class="sqlk">RETURNS</tspan> <tspan class="sqlk">DECIMAL</tspan>(18,4)</text>
<text x="1298" y="578" class="sql"><tspan class="sqlk">IMMUTABLE AS</tspan> $$</text>
<text x="1298" y="602" class="sql">  <tspan class="sqlk">SELECT</tspan> $1 / 1.15</text>
<text x="1298" y="626" class="sql">$$ <tspan class="sqlk">LANGUAGE</tspan> sql;</text>
<text x="1298" y="656" class="sqlc">-- args are $1, $2 &#8212; not by name</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A UDF cannot query a table. Lookups belong</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">in a join, not in a function.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">NULL in usually means NULL out &#8212; handle it.</text>
<text x="1298" y="852" class="warn">the f_ prefix is a convention worth keeping</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">One agreed definition of &#8220;net of VAT&#8221;, written once, so that four reports cannot quietly disagree about what the number means.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 37</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
