<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 11</text>
<text x="90" y="168" class="title">Three Things Called &#8220;View&#8221;</text>
<text x="90" y="212" class="sub">A view, a late-binding view and a materialized view behave completely differently. Choosing wrong makes deployments painful.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">One re-runs the query, one defers binding, one stores the answer</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">The difference that will bite you first is binding: an ordinary view locks its underlying tables, so you cannot drop and rebuild a table beneath it.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">THREE OBJECTS, THREE JOBS</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">VIEW</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">bound at create time</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Re-runs its query every time. Depends on the tables underneath, so dropping one of them fails until the view is dropped too.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">LATE-BINDING VIEW</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">WITH NO SCHEMA BINDING</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Resolved at query time instead. You can drop and rebuild the tables beneath it freely &#8212; which is exactly what a nightly rebuild does.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">MATERIALIZED VIEW</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">AUTO REFRESH YES</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Stores the result and refreshes it. Fast to read, and exactly as stale as its last refresh. It is a cache, with all that implies.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">WHAT BI SHOULD SEE</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">never base tables</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Expose late-binding views or MVs to Power BI. Point a report at a base table and you have frozen your schema by accident.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">late-binding for contracts · materialized for speed</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sql"><tspan class="sqlk">CREATE VIEW</tspan> rpt.sales_daily <tspan class="sqlk">AS</tspan></text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">SELECT</tspan> ... <tspan class="sqlk">FROM</tspan> gold.fct_sales_line</text>
<text x="1298" y="552" class="sql"><tspan class="sqlk">WITH NO SCHEMA BINDING</tspan>;</text>
<text x="1298" y="586" class="sql"><tspan class="sqlk">CREATE MATERIALIZED VIEW</tspan> rpt.mv_sales</text>
<text x="1298" y="608" class="sql"><tspan class="sqlk">AUTO REFRESH YES AS</tspan></text>
<text x="1298" y="630" class="sql"><tspan class="sqlk">SELECT</tspan> sale_date, sum(net_amount) ...;</text>
<text x="1298" y="664" class="sql"><tspan class="sqlk">REFRESH MATERIALIZED VIEW</tspan> rpt.mv_sales;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A late-binding view over a dropped table fails</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">at query time, not at deploy time.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A stale MV is a wrong dashboard, silently.</text>
<text x="1298" y="852" class="warn">alarm on refresh AGE, not failure</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A view is a recipe re-cooked to order. A materialized view is the dish kept warm. Late binding just means the recipe names ingredients, not shelves.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 11</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
