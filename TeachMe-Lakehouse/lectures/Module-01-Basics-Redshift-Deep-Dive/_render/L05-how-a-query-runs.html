<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 05</text>
<text x="90" y="168" class="title">How A Query Actually Runs</text>
<text x="90" y="212" class="sub">Five stages. The third one &#8212; compilation &#8212; explains why your first run is slow and every run after it is not.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Redshift compiles your SQL into C++ and ships the binary to the slices</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">It is not interpreting your statement row by row. It builds a program, distributes it, and every slice runs it against its own share of the data.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FIVE STAGES, ON THE LEADER THEN THE NODES</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">1 · PARSE &#183; 2 · PLAN</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">leader node</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">The planner uses table statistics to choose join order and distribution. Stale statistics produce a bad plan &#8212; that is what ANALYZE is for.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FFB84D">3 · COMPILE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">cached afterwards</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">The plan becomes compiled C++ segments. First run pays for compilation; later runs of the same shape reuse the cache.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#3FD98A">4 · EXECUTE IN PARALLEL</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">every slice, at once</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Each slice runs the same code over its own data. If a join needs rows from another slice, they are moved &#8212; and moving is the expensive part.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">5 · RETURN</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">leader merges</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">The leader merges partial results and sends them to you. A query returning millions of rows makes the leader the bottleneck.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">"the first run is always slow" = compilation, not your SQL</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="512" class="sqlc">-- what did my last queries cost?</text>
<text x="1298" y="536" class="sql"><tspan class="sqlk">SELECT</tspan> query_id, elapsed_time/1000000.0</text>
<text x="1298" y="560" class="sql">         <tspan class="sqlk">AS</tspan> secs, status, query_text</text>
<text x="1298" y="584" class="sql"><tspan class="sqlk">FROM</tspan>   sys_query_history</text>
<text x="1298" y="608" class="sql"><tspan class="sqlk">WHERE</tspan>  user_id = current_user_id</text>
<text x="1298" y="632" class="sql"><tspan class="sqlk">ORDER BY</tspan> start_time <tspan class="sqlk">DESC LIMIT</tspan> 20;</text>
<text x="1298" y="666" class="sqlc">-- elapsed_time is microseconds</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Never benchmark a query on its first run.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Changing a literal can still hit the cache;</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">changing the shape will not.</text>
<text x="1298" y="852" class="warn">run it twice before you judge it</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The first time you order a dish the kitchen writes the recipe. After that they just cook it. Judging the kitchen on the first order is unfair.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 05</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
