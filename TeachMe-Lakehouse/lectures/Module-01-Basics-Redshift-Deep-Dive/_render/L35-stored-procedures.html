<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 35 · PART F</text>
<text x="90" y="168" class="title">Stored Procedures</text>
<text x="90" y="212" class="sub">PL/pgSQL running inside the warehouse. The right home for a multi-statement load that must succeed or fail as one thing.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Procedural code that runs where the data already is</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">No round trips, no rows crossing the network, and one transaction around the whole load. Called with CALL, not SELECT &#8212; a procedure is not a function.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR THINGS THAT SURPRISE APP DEVELOPERS</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">IT DOES NOT RETURN ROWS</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">INOUT args or a refcursor</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">There is no RETURN of a result set. Use INOUT parameters for scalars, or open a refcursor and FETCH from it.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">IT IS ONE TRANSACTION BY DEFAULT</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">atomic unless declared otherwise</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Every statement commits together or none do. Declare it NONATOMIC only when you deliberately want per-statement commits.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">SECURITY DEFINER</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">runs as the owner</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Lets a caller run a load without holding write rights on the tables. Grant EXECUTE on the procedure instead of INSERT on gold.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">NO VERSION CONTROL FOR FREE</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">the database is not your repo</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">A procedure edited in a console is invisible to git. Every procedure lives in a .sql file, deployed by CI, or it does not exist.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">CALL, never SELECT. and always CREATE OR REPLACE.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sql"><tspan class="sqlk">CREATE OR REPLACE PROCEDURE</tspan></text>
<text x="1298" y="530" class="sql">  etl.load_sales(batch <tspan class="sqlk">DATE</tspan>,</text>
<text x="1298" y="554" class="sql">                 <tspan class="sqlk">INOUT</tspan> rows_out <tspan class="sqlk">INT</tspan>)</text>
<text x="1298" y="578" class="sql"><tspan class="sqlk">AS</tspan> $$ <tspan class="sqlk">BEGIN</tspan></text>
<text x="1298" y="602" class="sql">  ... ; <tspan class="sqlk">GET DIAGNOSTICS</tspan> rows_out</text>
<text x="1298" y="626" class="sql">        = <tspan class="sqlk">ROW_COUNT</tspan>;</text>
<text x="1298" y="650" class="sql"><tspan class="sqlk">END</tspan>; $$ <tspan class="sqlk">LANGUAGE</tspan> plpgsql;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Quote the body with $$ or every apostrophe</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">has to be doubled.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Changing an argument type creates a second</text>
<text x="1298" y="852" class="warn">overload &#8212; DROP the old one</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Instead of shipping instructions one at a time and waiting for each reply, you hand over the whole recipe and it is followed in the kitchen.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 35</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
