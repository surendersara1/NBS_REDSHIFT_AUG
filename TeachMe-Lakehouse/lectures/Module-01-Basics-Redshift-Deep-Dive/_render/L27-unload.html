<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 27</text>
<text x="90" y="168" class="title">UNLOAD</text>
<text x="90" y="212" class="sub">The exit everyone forgets. Publishing gold back to S3 as Parquet is what stops Redshift becoming the only way to reach the data.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">A parallel write from every slice straight to S3</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">The reverse of COPY, and the right way to move millions of rows out. Dragging them through the leader node and over a client connection is not.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR OPTIONS THAT MATTER</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">FORMAT PARQUET</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">typed, columnar</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Types survive the round trip and every engine can read it efficiently. Prefer it over CSV unless something downstream demands text.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">PARTITION BY</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">Hive-style prefixes</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Writes dt=2026-08-12/ style folders, so Athena and Spectrum can prune partitions when they read it back.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">PARALLEL and MAXFILESIZE</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">many files by default</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Parallel is on by default &#8212; one file per slice, which is what you want. PARALLEL OFF gives one file and is much slower.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">MANIFEST and CLEANPATH</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">reproducible output</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">A manifest lists exactly what was written. CLEANPATH removes what was there before, so a re-run replaces rather than mixes.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">every unofficial CSV export started as a missing UNLOAD</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sql"><tspan class="sqlk">UNLOAD</tspan> ('<tspan class="sqlk">SELECT</tspan> * <tspan class="sqlk">FROM</tspan> gold.fct_sales_line</text>
<text x="1298" y="530" class="sql">         <tspan class="sqlk">WHERE</tspan> sale_date &gt;= ''2026-08-01''')</text>
<text x="1298" y="552" class="sql"><tspan class="sqlk">TO</tspan> 's3://bucket/published/sales/'</text>
<text x="1298" y="574" class="sql"><tspan class="sqlk">IAM_ROLE</tspan> 'arn:aws:iam::...:role/rs-unload'</text>
<text x="1298" y="596" class="sql"><tspan class="sqlk">FORMAT AS PARQUET</tspan></text>
<text x="1298" y="618" class="sql"><tspan class="sqlk">PARTITION BY</tspan> (sale_date)</text>
<text x="1298" y="640" class="sql"><tspan class="sqlk">MANIFEST CLEANPATH</tspan></text>
<text x="1298" y="662" class="sql"><tspan class="sqlk">MAXFILESIZE</tspan> 256 <tspan class="sqlk">MB</tspan>;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Quotes inside the query must be doubled.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">CLEANPATH deletes the prefix first &#8212; point it</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">at a dedicated path, never a shared one.</text>
<text x="1298" y="852" class="warn">CLEANPATH is a delete. aim carefully.</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Give people the right exit and they stop climbing through windows. Every hand-maintained spreadsheet in a business is a door that was never built.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 27</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
