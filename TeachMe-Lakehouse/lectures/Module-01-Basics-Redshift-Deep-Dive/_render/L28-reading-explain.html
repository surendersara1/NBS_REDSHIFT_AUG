<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 28</text>
<text x="90" y="168" class="title">Reading An EXPLAIN Plan</text>
<text x="90" y="212" class="sub">Four operator names carry almost all the information. Two of them mean &#8220;this query is moving data between nodes&#8221; &#8212; and that is where the time goes.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Read it bottom-up, and look for the letters DS_</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">The cost numbers are relative units, not seconds &#8212; ignore them at first. The data-movement operators are what tell you whether the design is right.</text>

<text x="90" y="462" class="zhow">2 · THE FOUR THAT MATTER</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">BEST TO WORST</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">DS_DIST_NONE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">no movement at all</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Both sides are distributed on the join key, so every slice joins its own rows locally. This is what a good design looks like.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">DS_DIST_ALL_NONE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">also good</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">The other side is DISTSTYLE ALL, so a full copy is already on every node. This is why small dimensions get ALL.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">DS_DIST_INNER</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">redistributing</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">One side is being reshuffled across the network to line up with the other. Acceptable on small inputs, expensive on large ones.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">DS_BCAST_INNER</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">the one to hunt</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">A whole table copied to <tspan style="fill:#FFFFFF">every</tspan> node. Fine for a hundred rows; a disaster for a million. This is the classic cause of a slow join.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">search the plan for BCAST first. everything else second.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sql"><tspan class="sqlk">EXPLAIN</tspan></text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">SELECT</tspan> s.region, <tspan class="sqlk">SUM</tspan>(f.net_amount)</text>
<text x="1298" y="552" class="sql"><tspan class="sqlk">FROM</tspan>   gold.fct_sales_line f</text>
<text x="1298" y="574" class="sql"><tspan class="sqlk">JOIN</tspan>   gold.dim_store      s <tspan class="sqlk">USING</tspan>(store_sk)</text>
<text x="1298" y="596" class="sql"><tspan class="sqlk">GROUP BY</tspan> 1;</text>
<text x="1298" y="630" class="sqlc">-- then the actuals, after running it</text>
<text x="1298" y="652" class="sql"><tspan class="sqlk">SELECT</tspan> * <tspan class="sqlk">FROM</tspan> svl_query_summary</text>
<text x="1298" y="672" class="sql"><tspan class="sqlk">WHERE</tspan> query = pg_last_query_id();</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">is_diskbased = true means it spilled to disk &#8212;</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">usually oversized VARCHARs (Lesson 09).</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Stale statistics produce a plausible bad plan.</text>
<text x="1298" y="852" class="warn">cost units are not seconds</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The plan is the route the query will drive. You are not checking the mileage &#8212; you are checking whether it crosses the city sixteen times.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 28</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
