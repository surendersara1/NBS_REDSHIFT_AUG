<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 10</text>
<text x="90" y="168" class="title">SUPER and Semi-Structured Data</text>
<text x="90" y="212" class="sub">JSON, for people who arrived from Node and Mongo. It works &#8212; and it is still not where your reporting columns should live.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">SUPER is Redshift&#8217;s schemaless column type, queried with PartiQL</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Dot and bracket navigation, exactly like JavaScript. Excellent for landing an API payload whole. Poor as the permanent home of a column people filter on.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR THINGS TO KNOW BEFORE YOU REACH FOR IT</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">NAVIGATION IS JAVASCRIPT-LIKE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">PartiQL</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">`payload.customer.id` and `payload.items[0].sku` do what you expect. A missing path returns NULL rather than erroring.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">UNNEST ARRAYS BY JOINING</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">FROM t, t.items AS i</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">An array becomes rows by putting it in the FROM clause. This is how one order document becomes one row per line.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">IT IS NOT COLUMNAR</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">the cost</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">A SUPER column is stored whole. Filtering on a field inside it reads the entire document &#8212; no zone maps, no block skipping.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">SHRED WHAT YOU QUERY</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">bronze &#8594; silver</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Land the payload as SUPER in bronze, then extract the fields anyone filters or joins on into real typed columns in silver.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">SUPER is a landing zone, not a data model</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sql"><tspan class="sqlk">SELECT</tspan> o.payload.order_id::<tspan class="sqlk">BIGINT</tspan>,</text>
<text x="1298" y="530" class="sql">       o.payload.customer.email::<tspan class="sqlk">VARCHAR</tspan>,</text>
<text x="1298" y="552" class="sql">       i.sku::<tspan class="sqlk">VARCHAR</tspan>,</text>
<text x="1298" y="574" class="sql">       i.qty::<tspan class="sqlk">INT</tspan></text>
<text x="1298" y="596" class="sql"><tspan class="sqlk">FROM</tspan>   bronze.orders o,</text>
<text x="1298" y="618" class="sql">       o.payload.items i;</text>
<text x="1298" y="652" class="sqlc">-- one order document -&gt; one row per line</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Always cast on the way out &#8212; an uncast SUPER</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">value compares by its own rules, not yours.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A gold table should contain no SUPER at all.</text>
<text x="1298" y="852" class="warn">shred before anyone reports on it</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Keep the original envelope, by all means. But type the address onto the label &#8212; do not make the postman open every letter to sort the round.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 10</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
