<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 29</text>
<text x="90" y="168" class="title">Joins and Data Distribution</text>
<text x="90" y="212" class="sub">The same join can be a hundred times slower on the same data. What changes is not the SQL &#8212; it is where the rows were sitting.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Three join algorithms, and the one you get depends on physical design</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">You do not choose the algorithm. You choose the distribution and sort keys, and the planner chooses the algorithm from those.</text>

<text x="90" y="462" class="zhow">2 · THE THREE ALGORITHMS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">WHAT YOU GET, AND WHAT IT NEEDED</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">MERGE JOIN &#8212; the fastest</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">rare, and worth engineering for</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Needs both tables distributed <tspan style="fill:#FFFFFF">and</tspan> sorted on the join column. Then it is a single pass down two ordered streams.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">HASH JOIN &#8212; the normal one</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">what you will usually see</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Builds a hash table from the smaller side. Perfectly good &#8212; unless the build side is too big for memory and spills to disk.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FF6B73">NESTED LOOP &#8212; almost always a bug</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">check your ON clause</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Usually means a missing or non-equality join condition &#8212; an accidental cross join. Rows multiply and the query never finishes.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FFB84D">THE FIX HIERARCHY</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">in this order</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">1 &#183; ANALYZE for fresh statistics &#183; 2 &#183; make the small side DISTSTYLE ALL &#183; 3 &#183; align DISTKEYs &#183; 4 &#183; only then rewrite the SQL.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">mismatched key types silently defeat co-location</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- did anything spill to disk?</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">SELECT</tspan> query, step, label, is_diskbased,</text>
<text x="1298" y="556" class="sql">       workmem/1024/1024 <tspan class="sqlk">AS</tspan> mem_mb, rows</text>
<text x="1298" y="580" class="sql"><tspan class="sqlk">FROM</tspan>   svl_query_summary</text>
<text x="1298" y="604" class="sql"><tspan class="sqlk">WHERE</tspan>  query = pg_last_query_id()</text>
<text x="1298" y="628" class="sql">  <tspan class="sqlk">AND</tspan>  is_diskbased = 't';</text>
<text x="1298" y="662" class="sqlc">-- anything here is worth fixing</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Joining VARCHAR to INT forces a cast and</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">throws away co-location silently.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A duplicated dimension row fans out the fact.</text>
<text x="1298" y="852" class="warn">match your key types exactly</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Two sorted lists checked side by side is fast. Two unsorted piles in different rooms is not &#8212; and the SQL looks identical either way.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 29</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
