<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 25</text>
<text x="90" y="168" class="title">Transactions, Locks and Isolation</text>
<text x="90" y="212" class="sub">Redshift is serializable by default. That produces one error message that confuses everybody &#8212; and it is telling you something real.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">ERROR 1023: Serializable isolation violation on table &#8230;</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Two transactions touched the same table in an order that cannot be made to look sequential. Redshift aborts one rather than produce a result neither of you meant.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR THINGS TO KNOW</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">EVERY STATEMENT IS A TRANSACTION</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">autocommit is on</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Without BEGIN, each statement commits on its own. Wrap a multi-statement load in BEGIN &#8230; COMMIT or a failure leaves it half done.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FF6B73">SERIALIZABLE, NOT READ COMMITTED</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">the strictest level</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Stronger than Postgres&#8217; default. Two jobs writing the same table concurrently will collide &#8212; and that is the design working, not a bug.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">DDL TAKES AN EXCLUSIVE LOCK</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">stv_locks</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">A long-running SELECT will block an ALTER or DROP behind it, and everything queued after that. One report can stall a deployment.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#3FD98A">SHORT TRANSACTIONS, ONE WRITER</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">the actual fix</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Serialise the writes yourself &#8212; one job owns one table &#8212; and retry on 1023. Do not try to make concurrent writers work.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">1023 means "you have two writers" — fix the schedule, not the SQL</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- who is holding a lock right now?</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">SELECT</tspan> l.table_id, l.lock_owner_pid,</text>
<text x="1298" y="556" class="sql">       t.relname, l.lock_mode</text>
<text x="1298" y="580" class="sql"><tspan class="sqlk">FROM</tspan>   stv_locks l</text>
<text x="1298" y="604" class="sql"><tspan class="sqlk">JOIN</tspan>   pg_class t <tspan class="sqlk">ON</tspan> t.oid = l.table_id;</text>
<text x="1298" y="640" class="sqlc">-- and kill the blocker if you must</text>
<text x="1298" y="664" class="sql"><tspan class="sqlk">SELECT</tspan> pg_terminate_backend(&lt;pid&gt;);</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">TRUNCATE commits immediately &#8212; it cannot be</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">rolled back, even inside BEGIN.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">An idle-in-transaction session holds locks.</text>
<text x="1298" y="852" class="warn">always COMMIT or ROLLBACK</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Two people editing the same page at once. Redshift will not merge your guesses &#8212; it stops one of you and asks you to take turns.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 25</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
