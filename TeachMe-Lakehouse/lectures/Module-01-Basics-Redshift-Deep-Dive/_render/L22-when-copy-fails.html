<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 22</text>
<text x="90" y="168" class="title">When COPY Fails</text>
<text x="90" y="212" class="sub">The error message names a row, not a cause. There is a system table that tells you the actual column and value &#8212; learn it now, not at 6am.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">&#8220;Check &#8216;stl_load_errors&#8217; for details&#8221; &#8212; so check it</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Redshift records the file, line, column, declared type and the raw value that failed. That is enough to diagnose almost every load failure in one query.</text>

<text x="90" y="462" class="zhow">2 · THE FOUR CAUSES</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">ALMOST EVERY FAILURE IS ONE OF THESE</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#FF6B73">VALUE TOO LONG</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">bytes, not characters</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">A VARCHAR sized by counting letters overflows on Arabic or emoji, where one character can be four bytes (Lesson 09).</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FFB84D">TYPE MISMATCH</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">empty string vs NULL</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">An empty CSV field is not a NULL unless you say BLANKSASNULL. A date in an unexpected format needs TIMEFORMAT.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#5AA9FF">DELIMITER INSIDE A FIELD</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">use CSV, not DELIMITER</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">A comma inside a quoted product name breaks a naive parse. The CSV option understands quoting; a raw delimiter does not.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">PERMISSIONS</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">S3 and KMS</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">The IAM role needs s3:GetObject <tspan style="fill:#FFFFFF">and</tspan> kms:Decrypt if the bucket is encrypted. Missing KMS is the confusing one.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">MAXERROR hides bad rows. Use it to survey, never to ship.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- the query to know by heart</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">SELECT</tspan> starttime, filename, line_number,</text>
<text x="1298" y="556" class="sql">       colname, type, raw_field_value,</text>
<text x="1298" y="580" class="sql">       err_reason</text>
<text x="1298" y="604" class="sql"><tspan class="sqlk">FROM</tspan>   stl_load_errors</text>
<text x="1298" y="628" class="sql"><tspan class="sqlk">ORDER BY</tspan> starttime <tspan class="sqlk">DESC</tspan></text>
<text x="1298" y="652" class="sql"><tspan class="sqlk">LIMIT</tspan>  20;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A failed COPY rolls back entirely &#8212; the table</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">is unchanged, which is good news.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">MAXERROR 1000 silently discards 1000 rows.</text>
<text x="1298" y="852" class="warn">never leave MAXERROR in production</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The delivery was rejected and the note says &#8220;item 47&#8221;. There is a log by the door that says which item, which field, and what was actually written.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 22</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
