<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 02</text>
<text x="90" y="168" class="title">Clusters, Nodes and Slices</text>
<text x="90" y="212" class="sub">A slice is the unit of parallelism &#8212; the thing that actually reads bytes. Almost every performance problem is data spread badly across them.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">One leader, several compute nodes, and each node divided into slices</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Every table you create is spread across every slice. How evenly it spreads is a decision you make (Lesson 15), and it decides your query time.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">WHO DOES WHAT WHEN YOU RUN A QUERY</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#E3000E"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#FF3B47">LEADER NODE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">holds no user data</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Parses, plans, compiles the plan into C++ segments, ships them to the compute nodes, and merges the final result.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">COMPUTE NODES</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">where the data lives</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Each holds a share of every table and runs the same compiled code against its own share, in parallel.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#3FD98A">SLICES</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">the unit of parallelism</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Each node is divided into slices, each with its own share of memory and disk. A slice is what actually scans.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FFB84D">SKEW IS THE ENEMY</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">svv_table_info.skew_rows</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">If most rows land on one slice, one slice does most of the work and the other fifteen wait. That is a design bug, not a capacity one.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">a query is only as fast as its slowest slice</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="512" class="sqlc">-- how skewed are my tables?</text>
<text x="1298" y="536" class="sql"><tspan class="sqlk">SELECT</tspan> "table", size, tbl_rows,</text>
<text x="1298" y="560" class="sql">       skew_rows, unsorted, stats_off</text>
<text x="1298" y="584" class="sql"><tspan class="sqlk">FROM</tspan>   svv_table_info</text>
<text x="1298" y="608" class="sql"><tspan class="sqlk">ORDER BY</tspan> skew_rows <tspan class="sqlk">DESC NULLS LAST</tspan>;</text>
<text x="1298" y="644" class="sqlc">-- skew_rows &gt; 4 means one slice</text>
<text x="1298" y="666" class="sqlc">-- holds 4x the rows of the lightest</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A DISTKEY on a low-cardinality column</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">(country, status) is the usual cause.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">More nodes will not fix skew.</text>
<text x="1298" y="852" class="warn">check skew before tuning anything</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Sixteen people unloading a lorry. If fourteen boxes land at one door, fifteen of them stand about while one person works.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 02</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
