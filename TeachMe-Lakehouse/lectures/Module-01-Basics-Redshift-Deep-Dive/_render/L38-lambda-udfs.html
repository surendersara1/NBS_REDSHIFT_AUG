<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 38</text>
<text x="90" y="168" class="title">Lambda UDFs</text>
<text x="90" y="212" class="sub">Your Node.js code, called from inside a SELECT. Powerful, and the fastest way to make a warehouse query fail for reasons that are not the warehouse.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Redshift calls your Lambda, in batches, mid-query</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Rows are grouped into JSON payloads, sent to the function, and the returned array is matched back by position. Any runtime, any library, your code.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">WHAT YOU ARE SIGNING UP FOR</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">THE CONTRACT IS POSITIONAL</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">arguments in, results out</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">You receive an array of argument rows and must return exactly that many results, in order. A wrong count errors the query.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FFB84D">IT NEEDS AN IAM ROLE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">lambda:InvokeFunction</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">The cluster assumes a role to invoke the function. Same mechanism as COPY and UNLOAD &#8212; one more reason to keep roles tidy.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FF6B73">THE BLAST RADIUS IS THE QUERY</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">throttling becomes SQL failure</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">A cold start, a concurrency limit or a timeout now fails a SELECT. Reserve concurrency, and keep the function trivially fast.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#5AA9FF">USE IT FOR THE FEW, NOT THE MANY</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">tokenise, mask, geocode</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Right for a lookup no SQL can do. Wrong for anything you could have precomputed into a column at load time.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">filter first. never call a Lambda on rows you throw away.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="506" class="sql"><tspan class="sqlk">CREATE OR REPLACE EXTERNAL</tspan></text>
<text x="1298" y="530" class="sql">  <tspan class="sqlk">FUNCTION</tspan> f_mask_phone(<tspan class="sqlk">VARCHAR</tspan>)</text>
<text x="1298" y="554" class="sql"><tspan class="sqlk">RETURNS</tspan> <tspan class="sqlk">VARCHAR</tspan> <tspan class="sqlk">STABLE</tspan></text>
<text x="1298" y="578" class="sql"><tspan class="sqlk">LAMBDA</tspan> 'tamimi-mask-phone'</text>
<text x="1298" y="602" class="sql"><tspan class="sqlk">IAM_ROLE</tspan> 'arn:aws:iam::...:role/rs';</text>
<text x="1298" y="632" class="sqlc">-- then just call it in a SELECT</text>
<text x="1298" y="656" class="sql"><tspan class="sqlk">SELECT</tspan> f_mask_phone(phone) ...</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Every slice invokes independently, so a large</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">scan can spike concurrency hard.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Nulls arrive as JSON null &#8212; handle them.</text>
<text x="1298" y="852" class="warn">success:false in the response fails the query</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The warehouse phones an outside specialist for a handful of hard cases. Phone them for every row and the report now depends on someone else answering.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 38</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
