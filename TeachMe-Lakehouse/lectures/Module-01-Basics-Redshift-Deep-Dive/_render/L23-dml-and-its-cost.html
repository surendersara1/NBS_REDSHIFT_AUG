<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 23</text>
<text x="90" y="168" class="title">INSERT, UPDATE, DELETE &#8212; And Their Cost</text>
<text x="90" y="212" class="sub">There is no in-place update. Every UPDATE is a delete plus an insert, and the old row stays on disk until you reclaim it.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Rows are never modified in place. They are marked deleted and rewritten.</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A DELETE does not free space either &#8212; it flags rows. Until VACUUM runs you are still storing them, and scans still walk past them.</text>

<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">WHAT EACH STATEMENT ACTUALLY COSTS</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#FF6B73">SINGLE-ROW INSERT</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">never in a loop</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Every insert touches blocks across every column. A million of them takes hours and leaves the table fragmented. Use COPY.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#FFB84D">UPDATE = DELETE + INSERT</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">doubles the space, briefly</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">The old version is flagged and a new row appended &#8212; unsorted. Updating a large fraction of a table degrades its sort order badly.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#5AA9FF">DELETE JUST FLAGS</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">space returns after VACUUM</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Rows are marked, not removed. Storage and scan cost stay until maintenance runs (Lesson 42).</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#3FD98A">TRUNCATE IS INSTANT</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">and cannot be rolled back</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Emptying a staging table? TRUNCATE, not DELETE. It frees the space immediately and costs almost nothing.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">set-based statements only. if you are writing a loop, stop.</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- wrong: 1,000,000 statements</text>
<text x="1298" y="530" class="sql"><tspan class="sqlk">INSERT INTO</tspan> t <tspan class="sqlk">VALUES</tspan> (...);   <tspan class="sqlc">-- in a loop</tspan></text>
<text x="1298" y="566" class="sqlc">-- right: one set-based statement</text>
<text x="1298" y="588" class="sql"><tspan class="sqlk">INSERT INTO</tspan> gold.fct_sales_line</text>
<text x="1298" y="610" class="sql"><tspan class="sqlk">SELECT</tspan> ... <tspan class="sqlk">FROM</tspan> staging.sales_line;</text>
<text x="1298" y="646" class="sqlc">-- emptying staging</text>
<text x="1298" y="668" class="sql"><tspan class="sqlk">TRUNCATE</tspan> staging.sales_line;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">TRUNCATE commits immediately &#8212; it cannot be</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">rolled back, even inside a transaction.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">A big UPDATE wrecks your sort order.</text>
<text x="1298" y="852" class="warn">prefer rebuild-and-swap to mass UPDATE</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">You cannot edit a printed page. You cross it out and print a new one &#8212; and the crossed-out page stays in the folder until someone tidies up.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 23</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
