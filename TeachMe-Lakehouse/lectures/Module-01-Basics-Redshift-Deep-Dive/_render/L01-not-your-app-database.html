<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 01</text>
<text x="90" y="168" class="title">Redshift Is Not Your App Database</text>
<text x="90" y="212" class="sub">Same SQL dialect, completely different machine underneath. Four instincts that serve you well in Postgres will make you slow here.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">It speaks Postgres. That similarity is the trap.</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#E5B8BC">psql connects. Most of your SQL runs unchanged. Then the same query that took 40ms in Postgres takes four minutes &#8212; and nothing in the error log explains why.</text>

<text x="90" y="462" class="zhow">2 · FOUR THINGS THAT ARE GENUINELY DIFFERENT</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">WHAT YOU KNOW &#8594; WHAT IS TRUE HERE</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">ROWS &#8594; COLUMNS</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">columnar storage</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Postgres keeps a row together. Redshift keeps a <tspan style="fill:#FFFFFF">column</tspan> together, so a query touching 3 of 200 columns reads 1.5% of the bytes.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">ONE BOX &#8594; MANY SLICES</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">MPP</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Your app database is one machine. Redshift splits every table across slices and runs the same plan on all of them at once.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">INDEXES &#8594; PHYSICAL LAYOUT</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">Lesson 14</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">There is <tspan style="fill:#FFFFFF">no CREATE INDEX</tspan>. You choose a sort key and a distribution style instead, and you choose them once.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">ROW WRITES &#8594; BULK LOADS</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">Lesson 21</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">One INSERT of a million rows is cheap. A million INSERTs of one row will take hours and bloat the table.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">same SQL, opposite instincts — unlearning them IS the module</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="512" class="sqlc">-- the Node.js habit</text>
<text x="1298" y="536" class="sql">INSERT INTO sales VALUES (...);  <tspan class="sqlc">x1,000,000</tspan></text>
<text x="1298" y="572" class="sqlc">-- the Redshift way</text>
<text x="1298" y="596" class="sql"><tspan class="sqlk">COPY</tspan> sales</text>
<text x="1298" y="620" class="sql">FROM 's3://bucket/dt=2026-08-12/'</text>
<text x="1298" y="644" class="sql">IAM_ROLE '...' FORMAT AS PARQUET;</text>
<text x="1298" y="668" class="sqlc">-- one statement. minutes, not hours.</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Your ORM will connect, and then behave badly.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">PRIMARY KEY does not prevent duplicates.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">There is no CREATE INDEX to reach for.</text>
<text x="1298" y="852" class="warn">unlearn first, then build</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A van and a freight train both move boxes and both have a steering wheel. Driving the train like a van is how you end up stationary.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 01</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
