<text x="90" y="104" class="eyebrow">MODULE 01 · LESSON 15</text>
<text x="90" y="168" class="title">Distribution Styles</text>
<text x="90" y="212" class="sub">Where each row lands across the slices. The largest single lever on join performance &#8212; and the hardest thing to change afterwards.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">A join is fast when both sides are already on the same slice</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">If they are not, Redshift moves rows between nodes mid-query. That movement &#8212; not the comparison &#8212; is what makes a join slow.</text>

<text x="90" y="462" class="zhow">2 · THE FOUR STYLES</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">PICK ONE PER TABLE, AT CREATE TIME</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">KEY</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">big facts</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Rows with the same key value land on the same slice. Two tables on the same key join locally, with no movement at all.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">ALL</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">small dimensions</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">A full copy on every node. Any join to it is local. Costs storage &#215; node count and slows writes &#8212; so only for small, slow-changing tables.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">EVEN</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">staging tables</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Round-robin. No skew, no co-location. Right when nothing joins on the table, or when no key is a sensible choice.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">AUTO</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">the default</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Redshift starts small tables as ALL and switches as they grow. A sane default, not a decision on a big fact table.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">DISTKEY on the biggest join column · ALL for dimensions under a few million rows</text>

<text x="1270" y="462" class="zsql">3 · THE SQL</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="1298" y="508" class="sqlc">-- is this column a sensible DISTKEY?</text>
<text x="1298" y="532" class="sql"><tspan class="sqlk">SELECT COUNT</tspan>(<tspan class="sqlk">DISTINCT</tspan> store_sk) <tspan class="sqlk">AS</tspan> distinct_vals,</text>
<text x="1298" y="556" class="sql">       <tspan class="sqlk">COUNT</tspan>(*)                <tspan class="sqlk">AS</tspan> rows</text>
<text x="1298" y="580" class="sql"><tspan class="sqlk">FROM</tspan>   gold.fct_sales_line;</text>
<text x="1298" y="614" class="sqlc">-- what is in effect, and is it skewed?</text>
<text x="1298" y="638" class="sql"><tspan class="sqlk">SELECT</tspan> "table", diststyle, skew_rows, tbl_rows</text>
<text x="1298" y="662" class="sql"><tspan class="sqlk">FROM</tspan>   svv_table_info <tspan class="sqlk">ORDER BY</tspan> tbl_rows <tspan class="sqlk">DESC</tspan>;</text>

<text x="1270" y="710" class="zgot">4 · GOTCHAS</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Low-cardinality DISTKEY = skew (Lesson 02).</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E5B8BC">DISTSTYLE ALL on a big table is expensive.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E5B8BC">You cannot ALTER it &#8212; rebuild and swap.</text>
<text x="1298" y="852" class="warn">one key per table. choose well.</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Store the receipts and the shop details in the same building and the clerk never leaves the room. Split them and every lookup is a walk.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 01 · Lesson 15</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Redshift Deep Dive</text>
</svg></div></body></html>
