<text x="90" y="104" class="eyebrow">MODULE 1 · LESSON 01</text>
<text x="90" y="168" class="title-s">Why Your App Database Can't Do This</text>
<text x="90" y="212" class="sub">You have all written SELECT * FROM orders WHERE id = ?. Today we ask for every order ever, grouped six ways.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · two different jobs ══ -->
<text x="90" y="300" class="cap">1 · TWO DIFFERENT JOBS</text>

<!-- OLTP -->
<rect x="90" y="322" width="445" height="258" rx="16" fill="#1B2329" stroke="#4A5A66" stroke-width="3"/>
<rect x="90" y="322" width="445" height="7" rx="3.5" fill="#8296A3"/>
<text x="312" y="374" class="bxt" text-anchor="middle">OLTP</text>
<text x="312" y="404" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF">On-Line Transaction Processing</text>
<line x1="118" y1="424" x2="507" y2="424" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="458" class="bxs-s">▪ One row at a time, by key</text>
<text x="118" y="490" class="bxs-s">▪ Index seek — answer in 1 ms</text>
<text x="118" y="522" class="bxs-s">▪ Thousands of small writes/sec</text>
<text x="118" y="554" class="bxs-s">▪ Stores each ROW whole, together</text>

<!-- OLAP -->
<rect x="565" y="322" width="445" height="258" rx="16" fill="#2A1418" stroke="#E3000E" stroke-width="3"/>
<rect x="565" y="322" width="445" height="7" rx="3.5" fill="#FF3B47"/>
<text x="787" y="374" class="bxt" text-anchor="middle" style="fill:#FF3B47">OLAP</text>
<text x="787" y="404" class="bxs-s" text-anchor="middle" style="fill:#E0989C">On-Line Analytical Processing</text>
<line x1="593" y1="424" x2="982" y2="424" stroke="#5A2A30" stroke-width="2"/>
<text x="593" y="458" class="bxs-s">▪ Every row, then summarised</text>
<text x="593" y="490" class="bxs-s">▪ Full scan — seconds, not ms</text>
<text x="593" y="522" class="bxs-s">▪ Few huge reads, almost no writes</text>
<text x="593" y="554" class="bxs-s">▪ Stores each COLUMN together</text>

<text x="1378" y="694" class="bxt-s" style="fill:#FF6B72">WHY NOT JUST ASK SAP?</text>
<text x="1378" y="734" class="bxs-s">SAP runs the tills. Its CPU is not</text>
<text x="1378" y="762" class="bxs-s">spare capacity for your GROUP BY.</text>
<text x="1378" y="798" class="bxs-s" style="fill:#FFB84D">So we copy it out — date-windowed,</text>
<text x="1378" y="826" class="bxs-s" style="fill:#FFB84D">8 parallel lanes, capped on purpose.</text>
<text x="1378" y="864" class="code-s" style="fill:#5E7080">docs/handoff/SAP-BASE-TABLES.md</text>
