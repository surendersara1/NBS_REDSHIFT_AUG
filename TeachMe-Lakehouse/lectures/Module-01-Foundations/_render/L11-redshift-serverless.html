<text x="90" y="168" class="title">Redshift Serverless: Where Answers Live</text>
<text x="90" y="212" class="sub">Massively parallel, columnar, rented by the second. And why Gold is copied into it instead of left on the lake.</text>

<!-- ═══ ZONE 1 · why it answers fast ═══ -->
<text x="90" y="296" class="cap">1 · WHY IT ANSWERS FAST</text>

<!-- A · MPP -->
<rect x="90" y="316" width="560" height="212" rx="16" fill="#1B2329" stroke="#7A3038" stroke-width="3"/>
<rect x="90" y="316" width="560" height="7" rx="3.5" fill="#E3000E"/>
<text x="118" y="356" class="bxt-s">MPP — MANY NODES, ONE QUERY</text>
<line x1="118" y1="374" x2="622" y2="374" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="408" class="bxs-s">▪ The table is sliced across nodes</text>
<text x="118" y="438" class="bxs-s">▪ Each node scans only its slice</text>
<text x="118" y="468" class="bxs-s">▪ Leader merges the partial answers</text>
<text x="118" y="502" class="code-s" style="fill:#5E7080">modules/redshift-serverless/main.tf:79</text>

<!-- B · columnar -->
<rect x="690" y="316" width="520" height="212" rx="16" fill="#1B2329" stroke="#7A3038" stroke-width="3"/>
<rect x="690" y="316" width="520" height="7" rx="3.5" fill="#E3000E"/>
<text x="718" y="356" class="bxt-s">COLUMNAR + ZONE MAPS</text>
<line x1="718" y1="374" x2="1182" y2="374" stroke="#2C3841" stroke-width="2"/>
<text x="718" y="408" class="bxs-s">▪ Reads only the columns named</text>
<text x="718" y="438" class="bxs-s">▪ Each column compressed apart</text>
<text x="718" y="468" class="bxs-s">▪ Block min/max skips whole blocks</text>
<text x="718" y="502" class="code-s" style="fill:#5E7080">marts/gold/unified_sales.sql</text>

<!-- C · RPUs -->
<rect x="1250" y="316" width="580" height="212" rx="16" fill="#1B2329" stroke="#7A3038" stroke-width="3"/>
<rect x="1250" y="316" width="580" height="7" rx="3.5" fill="#E3000E"/>
<text x="1278" y="356" class="bxt-s">RPUs — COMPUTE YOU RENT</text>
<line x1="1278" y1="374" x2="1802" y2="374" stroke="#2C3841" stroke-width="2"/>
<text x="1278" y="408" class="bxs-s">▪ Nothing to size, patch or stop</text>
<text x="1278" y="438" class="bxs-s">▪ dev: 8 RPU base → 16 max</text>
<text x="1278" y="468" class="bxs-s">▪ prod: 32 RPU base → 64 max</text>
<text x="1278" y="502" class="code-s" style="fill:#5E7080">env/prod/terraform.tfvars:18-19</text>

<!-- ═══ ZONE 2 · the knobs + where gold lives ═══ -->
<text x="90" y="574" class="cap">2 · THE TWO KNOBS YOU CHOOSE — AND WHERE GOLD LIVES</text>

<!-- D · dist key -->
<rect x="90" y="596" width="430" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="90" y="596" width="430" height="7" rx="3.5" fill="#5AA9FF"/>
<text x="118" y="638" class="bxt-s">DIST KEY</text>
<line x1="118" y1="656" x2="492" y2="656" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="690" class="bxs-s">Decides which node a row lives</text>
<text x="118" y="718" class="bxs-s">on. dist='date' co-locates one</text>
<text x="118" y="746" class="bxs-s">day's rows on one slice.</text>
<text x="118" y="782" class="code-s" style="fill:#5E7080">gold/unified_sales.sql:81</text>

<!-- E · sort key -->
<rect x="550" y="596" width="430" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="550" y="596" width="430" height="7" rx="3.5" fill="#3FD98A"/>
<text x="578" y="638" class="bxt-s">SORT KEY</text>
<line x1="578" y1="656" x2="952" y2="656" stroke="#2C3841" stroke-width="2"/>
<text x="578" y="690" class="bxs-s">The physical order on disk.</text>
<text x="578" y="718" class="bxs-s">sort=['date','site'] lets a</text>
<text x="578" y="746" class="bxs-s">date filter skip whole blocks.</text>
<text x="578" y="782" class="code-s" style="fill:#5E7080">gold/unified_sales.sql:82</text>

<!-- F · why gold is native -->
<rect x="1010" y="596" width="820" height="204" rx="16" fill="#2B1216" stroke="#E3000E" stroke-width="3"/>
<rect x="1010" y="596" width="820" height="7" rx="3.5" fill="#E3000E"/>
<text x="1038" y="638" class="bxt-s" style="fill:#FF6B72">WHY GOLD LIVES INSIDE REDSHIFT</text>
<line x1="1038" y1="656" x2="1802" y2="656" stroke="#5A2228" stroke-width="2"/>
<text x="1038" y="690" class="bxs-s">▪ Silver stays on the lake — Redshift reads it in place via Spectrum</text>
<text x="1038" y="718" class="bxs-s">▪ dbt writes Gold as NATIVE Redshift tables: local storage, dist + sort</text>
<text x="1038" y="746" class="bxs-s">▪ Power BI hits Gold only — no lake round-trip on every click</text>
<text x="1038" y="782" class="code-s" style="fill:#8A6C70">jobs/_scripts/run_dbt.py:151-154 — CREATE EXTERNAL SCHEMA silver_external</text>
