<text x="1200" y="300" class="cap">2 · WHAT COLUMNAR BUYS YOU</text>

<rect x="1200" y="322" width="630" height="92" rx="14" fill="#1B2329" stroke="#3A4854" stroke-width="2.5"/>
<text x="1228" y="362" class="bxt-s">COMPRESSION</text>
<text x="1228" y="394" class="bxs-s">Same-type values sit together — they squash hard</text>

<rect x="1200" y="426" width="630" height="92" rx="14" fill="#1B2329" stroke="#3A4854" stroke-width="2.5"/>
<text x="1228" y="466" class="bxt-s">COLUMN PRUNING</text>
<text x="1228" y="498" class="bxs-s">Need 1 column of 29? Read 1 column of 29.</text>

<rect x="1200" y="530" width="630" height="92" rx="14" fill="#1B2329" stroke="#3A4854" stroke-width="2.5"/>
<text x="1228" y="570" class="bxt-s">PREDICATE PUSHDOWN</text>
<text x="1228" y="602" class="bxs-s">Each chunk carries min/max — skip it unopened</text>

<!-- ══ ZONE 3 · the comparison ══ -->
<text x="90" y="654" class="cap">3 · THE SAME 638 M ROWS, BOTH WAYS</text>

<rect x="90" y="676" width="560" height="210" rx="16" fill="#1B2329" stroke="#4A5A66" stroke-width="3" stroke-dasharray="9 6"/>
<text x="118" y="718" class="bxt" style="fill:#8FA2AF">CSV</text>
<text x="622" y="718" class="edge-s" text-anchor="end" style="fill:#7A8C99">not used here</text>
<line x1="118" y1="736" x2="622" y2="736" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="770" class="edge-s" style="fill:#7A8C99">Layout</text>
<text x="622" y="770" class="bxs-s" text-anchor="end">row after row, interleaved</text>
<text x="118" y="802" class="edge-s" style="fill:#7A8C99">Types</text>
<text x="622" y="802" class="bxs-s" text-anchor="end">none — every field is text</text>
<text x="118" y="834" class="edge-s" style="fill:#7A8C99">One column</text>
<text x="622" y="834" class="bxs-s" text-anchor="end">still reads the whole file</text>
<text x="118" y="866" class="edge-s" style="fill:#7A8C99">Compressed</text>
<text x="622" y="866" class="bxs-s" text-anchor="end">gzip: one lump, unsplittable</text>

<rect x="680" y="676" width="560" height="210" rx="16" fill="#2A1418" stroke="#E3000E" stroke-width="3"/>
<text x="708" y="718" class="bxt" style="fill:#FF3B47">PARQUET</text>
<text x="1212" y="718" class="edge-s" text-anchor="end" style="fill:#FF8A92">what we write</text>
<line x1="708" y1="736" x2="1212" y2="736" stroke="#5A2A30" stroke-width="2"/>
<text x="708" y="770" class="edge-s" style="fill:#A08088">Layout</text>
<text x="1212" y="770" class="bxs-s" text-anchor="end">column chunk, then the next</text>
<text x="708" y="802" class="edge-s" style="fill:#A08088">Types</text>
<text x="1212" y="802" class="bxs-s" text-anchor="end">typed, encoded, dictionary</text>
<text x="708" y="834" class="edge-s" style="fill:#A08088">One column</text>
<text x="1212" y="834" class="bxs-s" text-anchor="end">reads 1 chunk of 29</text>
<text x="708" y="866" class="edge-s" style="fill:#A08088">Compressed</text>
<text x="1212" y="866" class="bxs-s" text-anchor="end">snappy, per chunk, splittable</text>

<rect x="1270" y="676" width="560" height="210" rx="16" fill="#141A20" stroke="#2C3841" stroke-width="2.5"/>
<text x="1298" y="716" class="bxt-s">WHY IT IS NOT OPTIONAL</text>
<text x="1298" y="756" class="bxs-s">S611  638,035,208 rows × 29 columns</text>
<text x="1298" y="786" class="bxs-s">S603  648,802,247 rows</text>
<text x="1298" y="816" class="bxs-s">ZHOCIDC  1,377,080,716 rows</text>
<text x="1298" y="850" class="bxs" style="fill:#FFB84D">In CSV, this pipeline never finishes.</text>
<text x="1298" y="876" class="code-s" style="fill:#5E7080">glue_engine/writers/raw_landing.py:227</text>

<!-- plain english -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">CSV is handwritten lines in a notebook. Parquet is a spreadsheet sorted into columns — so reading one column is cheap.</text>
