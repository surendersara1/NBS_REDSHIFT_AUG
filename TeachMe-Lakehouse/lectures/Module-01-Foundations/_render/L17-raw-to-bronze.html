<text x="90" y="104" class="eyebrow">MODULE 1 · LESSON 17</text>
<text x="90" y="168" class="title">RAW → BRONZE: Typed, Deduped, Idempotent</text>
<text x="90" y="212" class="sub">P2 bronze_pull never calls SAP. It reads the landed cycle back and MERGEs it into an Iceberg table.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHY TWO JOBS ══ -->
<text x="90" y="300" class="cap">1 · WHY P1 AND P2 ARE SPLIT</text>
<rect x="90" y="322" width="556" height="326" rx="18" fill="#1B2329" stroke="#4A5A66" stroke-width="3"/>
<rect x="90" y="322" width="556" height="7" rx="3.5" fill="#8296A3"/>
<text x="118" y="370" class="bxt">P1 PULLS · P2 LOADS</text>
<text x="118" y="398" class="bxs-s" style="fill:#8FA2AF">two jobs, one blast radius</text>
<line x1="118" y1="416" x2="618" y2="416" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="450" class="bxs-s">▪ P1 owns the only call to SAP</text>
<text x="118" y="480" class="bxs-s">▪ P2 reads S3 — never the source</text>
<text x="118" y="510" class="bxs-s">▪ Load bug? Replay from raw, for free</text>
<text x="118" y="540" class="bxs-s">▪ Retries can never hammer HANA</text>
<text x="118" y="570" class="bxs-s">▪ P1 owns the watermark; P2 never moves it</text>
<text x="118" y="606" class="code-s">jobs/bronze_pull.py</text>
<text x="118" y="630" class="code-s" style="fill:#8FA2AF">sources/landed_files.py  (s3_landing)</text>

<!-- ══ ZONE 2 · WHAT P2 DOES (green) ══ -->
<text x="682" y="300" class="cap">2 · WHAT P2 ACTUALLY DOES</text>
<rect x="682" y="322" width="556" height="326" rx="18" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<rect x="682" y="322" width="556" height="7" rx="3.5" fill="#3FD98A"/>
<text x="710" y="370" class="bxt">TYPE, DEDUPE, MERGE</text>
<text x="710" y="398" class="bxs-s" style="fill:#7FBFA0">the spec is the contract</text>
<line x1="710" y1="416" x2="1210" y2="416" stroke="#2A4A3A" stroke-width="2"/>
<text x="710" y="450" class="bxs-s">▪ schema: in the YAML applies real types</text>
<text x="710" y="480" class="bxs-s">▪ PII columns hashed before any write</text>
<text x="710" y="510" class="bxs-s">▪ dropDuplicates on merge_key first</text>
<text x="710" y="540" class="bxs-s">▪ Audit columns carried through, not redone</text>
<text x="710" y="570" class="bxs-s">▪ Zero business logic. None. Ever.</text>
<text x="710" y="606" class="code-s">specs/bronze/sap_zncr01.yaml</text>
<text x="710" y="630" class="code-s" style="fill:#8FA2AF">_source_system _source_table _ingested_at</text>

<!-- ══ ZONE 3 · THE WRITE (blue) ══ -->
<text x="1274" y="300" class="cap">3 · WHY REPLAYS ARE SAFE</text>
<rect x="1274" y="322" width="556" height="326" rx="18" fill="#12283F" stroke="#5AA9FF" stroke-width="3"/>
<rect x="1274" y="322" width="556" height="7" rx="3.5" fill="#5AA9FF"/>
<text x="1302" y="370" class="bxt">MERGE, NOT APPEND</text>
<text x="1302" y="398" class="bxs-s" style="fill:#94B4D4">Iceberg upsert on the natural key</text>
<line x1="1302" y1="416" x2="1802" y2="416" stroke="#2C4560" stroke-width="2"/>
<text x="1302" y="450" class="bxs-s">▪ WHEN MATCHED → UPDATE SET *</text>
<text x="1302" y="480" class="bxs-s">▪ WHEN NOT MATCHED → INSERT *</text>
<text x="1302" y="510" class="bxs-s">▪ Same input twice = same row count</text>
<text x="1302" y="540" class="bxs-s">▪ Watermark re-reads a 7-day safety window</text>
<text x="1302" y="570" class="bxs-s">▪ The overlap is absorbed, not duplicated</text>
<text x="1302" y="606" class="code-s">writers/s3_tables.py  (merge_into)</text>
<text x="1302" y="630" class="code-s" style="fill:#8FA2AF">merge_key: [MANDT, DATUM, WERKS]</text>

<!-- ══ WHAT CHANGES HERE — the spine ══ -->
<rect x="90" y="670" width="830" height="220" rx="18" fill="#E3000E" stroke="#FF6B72" stroke-width="3"/>
<text x="122" y="708" class="edge" style="fill:#4A0206">WHAT CHANGES HERE</text>
<text x="122" y="756" class="bxt-d">SHAPE, NOT MEANING.</text>
<text x="122" y="800" class="bxs-d" style="fill:#1F0104">Text becomes numbers and dates. Duplicate keys collapse to</text>
<text x="122" y="830" class="bxs-d" style="fill:#1F0104">one row. Audit columns ride along. No renames, no joins,</text>
<text x="122" y="860" class="bxs-d" style="fill:#1F0104">no rules — Bronze is still one row per source row.</text>

<!-- ══ THE WAR STORY ══ -->
<rect x="950" y="670" width="880" height="220" rx="18" fill="#1E1A10" stroke="#FFB84D" stroke-width="2.5"/>
<text x="982" y="706" class="edge" style="fill:#FFB84D">THE WAR STORY · 2026-07-14</text>
<text x="982" y="748" class="bxt-s">446,611 rows in Bronze. 438,645 at source.</text>
<text x="982" y="784" class="bxs">bronze.sap.zncr01 was written with plain append, so overlapping</text>
<text x="982" y="812" class="bxs">loads re-inserted the same keys. Nothing errored. Nothing warned.</text>
<text x="982" y="840" class="bxs">Declaring merge_key turned the reload into an upsert — and it stopped.</text>
<text x="982" y="872" class="code-s" style="fill:#8FA2AF">specs/bronze/sap_zncr01.yaml:18 · writers/s3_tables.py:193</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Append is INSERT; merge is INSERT … ON CONFLICT UPDATE. Run it twice, the table looks identical — that is idempotency.</text>
