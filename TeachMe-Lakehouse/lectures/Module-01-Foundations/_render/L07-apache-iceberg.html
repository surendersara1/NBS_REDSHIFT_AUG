<text x="90" y="104" class="eyebrow">MODULE 1 · LESSON 07</text>
<text x="90" y="168" class="title">Apache Iceberg: Snapshots, MERGE, Time Travel</text>
<text x="90" y="212" class="sub">Immutable files + one moving pointer. That single idea buys atomic writes, upserts, rollback and safe schema change.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ═══ ZONE 1 · the mechanism ═══ -->
<text x="90" y="298" class="cap">1 · WHAT AN ICEBERG TABLE ACTUALLY IS</text>

<!-- A · data files -->
<rect x="90" y="320" width="530" height="240" rx="16" fill="#1B2329" stroke="#4A5A66" stroke-width="3"/>
<rect x="90" y="320" width="530" height="7" rx="3.5" fill="#8296A3"/>
<text x="118" y="364" class="bxt-s">IMMUTABLE DATA FILES</text>
<text x="118" y="396" class="bxs" style="fill:#8FA2AF">Parquet files on S3</text>
<line x1="118" y1="416" x2="592" y2="416" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="450" class="bxs-s">▪ Written once. Never edited.</text>
<text x="118" y="480" class="bxs-s">▪ An UPDATE writes a NEW file</text>
<text x="118" y="510" class="bxs-s">▪ and marks the old rows dead</text>
<text x="118" y="540" class="bxs-s" style="fill:#FFB84D">You can't corrupt what you never edit</text>

<!-- B · metadata -->
<rect x="695" y="320" width="530" height="240" rx="16" fill="#1B2329" stroke="#4A5A66" stroke-width="3"/>
<rect x="695" y="320" width="530" height="7" rx="3.5" fill="#8296A3"/>
<text x="723" y="364" class="bxt-s">METADATA + MANIFESTS</text>
<text x="723" y="396" class="bxs" style="fill:#8FA2AF">The list of what's in the table</text>
<line x1="723" y1="416" x2="1197" y2="416" stroke="#2C3841" stroke-width="2"/>
<text x="723" y="450" class="bxs-s">▪ Which files belong right now</text>
<text x="723" y="480" class="bxs-s">▪ Row counts + min/max per file</text>
<text x="723" y="510" class="bxs-s">▪ so a scan can skip whole files</text>
<text x="723" y="540" class="bxs-s" style="fill:#FFB84D">This is what makes it a table</text>

<!-- C · the snapshot pointer (the thing being taught) -->
<rect x="1300" y="320" width="530" height="240" rx="16" fill="#2B1216" stroke="#E3000E" stroke-width="3"/>
<rect x="1300" y="320" width="530" height="7" rx="3.5" fill="#E3000E"/>
<text x="1328" y="364" class="bxt-s" style="fill:#FF6B72">THE SNAPSHOT POINTER</text>
<text x="1328" y="396" class="bxs" style="fill:#E2A9AD">One pointer → one metadata file</text>
<line x1="1328" y1="416" x2="1802" y2="416" stroke="#5A2228" stroke-width="2"/>
<text x="1328" y="450" class="bxs-s">▪ A write adds new files, then</text>
<text x="1328" y="480" class="bxs-s">▪ MOVES the pointer — atomically</text>
<text x="1328" y="510" class="bxs-s">▪ Readers keep the old pointer</text>
<text x="1328" y="540" class="bxs-s" style="fill:#FFB84D">Rollback = move it back</text>

<line x1="630" y1="440" x2="687" y2="440" stroke="#C9D6DE" stroke-width="4" marker-end="url(#a)"/>
<line x1="1235" y1="440" x2="1292" y2="440" stroke="#FF3B47" stroke-width="4" marker-end="url(#ar)"/>

<!-- ═══ ZONE 2 · the four writes ═══ -->
<text x="90" y="600" class="cap">2 · THE WRITES WE USE — src/glue/glue_engine/writers/s3_tables.py</text>

<!-- append -->
<rect x="90" y="622" width="414" height="192" rx="14" fill="#12283F" stroke="#3A6A9A" stroke-width="2.5"/>
<rect x="90" y="622" width="414" height="7" rx="3.5" fill="#5AA9FF"/>
<text x="114" y="662" style="font-size:22px;font-weight:600" class="code">append(df)</text>
<line x1="114" y1="678" x2="480" y2="678" stroke="#2C4560" stroke-width="2"/>
<text x="114" y="710" class="bxs-s">Add rows. Creates the table on</text>
<text x="114" y="738" class="bxs-s">the very first write.</text>
<text x="114" y="766" class="bxs-s">Used for CDC deltas.</text>
<text x="114" y="798" class="code-s" style="fill:#5E7080">s3_tables.py:175</text>

<!-- merge_into -->
<rect x="532" y="622" width="414" height="192" rx="14" fill="#12283F" stroke="#E3000E" stroke-width="3"/>
<rect x="532" y="622" width="414" height="7" rx="3.5" fill="#E3000E"/>
<text x="556" y="662" style="font-size:22px;font-weight:600" class="code">merge_into(df, key)</text>
<line x1="556" y1="678" x2="922" y2="678" stroke="#2C4560" stroke-width="2"/>
<text x="556" y="710" class="bxs-s">Upsert on the natural key.</text>
<text x="556" y="738" class="bxs-s">Re-run the same input → the</text>
<text x="556" y="766" class="bxs-s">same row count. Idempotent.</text>
<text x="556" y="798" class="code-s" style="fill:#5E7080">s3_tables.py:193</text>

<!-- full_refresh -->
<rect x="974" y="622" width="414" height="192" rx="14" fill="#12283F" stroke="#3A6A9A" stroke-width="2.5"/>
<rect x="974" y="622" width="414" height="7" rx="3.5" fill="#5AA9FF"/>
<text x="998" y="662" style="font-size:22px;font-weight:600" class="code">full_refresh(df)</text>
<line x1="998" y1="678" x2="1364" y2="678" stroke="#2C4560" stroke-width="2"/>
<text x="998" y="710" class="bxs-s">Replace every row, KEEP the</text>
<text x="998" y="738" class="bxs-s">table. One atomic overwrite,</text>
<text x="998" y="766" class="bxs-s">never a DROP.</text>
<text x="998" y="798" class="code-s" style="fill:#5E7080">s3_tables.py:326</text>

<!-- expire_snapshots -->
<rect x="1416" y="622" width="414" height="192" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="1416" y="622" width="414" height="7" rx="3.5" fill="#7A8C99"/>
<text x="1440" y="662" class="code" style="font-size:22px;font-weight:600;fill:#9FBFB8">expire_snapshots()</text>
<line x1="1440" y1="678" x2="1806" y2="678" stroke="#2C3841" stroke-width="2"/>
<text x="1440" y="710" class="bxs-s">Drop snapshots older than 7</text>
<text x="1440" y="738" class="bxs-s">days, keep the last 100. Else</text>
<text x="1440" y="766" class="bxs-s">metadata grows forever.</text>
<text x="1440" y="798" class="code-s" style="fill:#5E7080">s3_tables.py:407</text>

<!-- not-used strip -->
<rect x="90" y="830" width="1740" height="60" rx="12" fill="#141A20" stroke="#3A4854" stroke-width="2" stroke-dasharray="10 7"/>
<text x="122" y="854" class="edge-s" style="fill:#7A8C99">ICEBERG GIVES YOU THESE TOO — real syntax, not called anywhere in our repo yet</text>
<text x="122" y="878" class="code" style="fill:#6E8090">SELECT * FROM tbl VERSION AS OF &lt;snapshot_id&gt; · CALL cat.system.rollback_to_snapshot('ns.tbl', &lt;id&gt;)</text>

<!-- plain english -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Git for tables. Every write is a commit — new files, new manifest, then one pointer moves. Nothing is edited; nothing half-lands.</text>
