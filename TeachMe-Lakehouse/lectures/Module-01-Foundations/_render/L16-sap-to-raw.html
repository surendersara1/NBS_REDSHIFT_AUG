<text x="90" y="104" class="eyebrow">MODULE 1 · LESSON 16</text>
<text x="90" y="168" class="title">SAP → RAW: Land It, Don't Touch It</text>
<text x="90" y="212" class="sub">P1 source_download pulls from HANA over JDBC and writes Parquet. Nothing is cleaned, typed or renamed.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHY RAW EXISTS ══ -->
<text x="90" y="300" class="cap">1 · WHY RAW EXISTS AT ALL</text>
<rect x="90" y="322" width="556" height="326" rx="18" fill="#1B2329" stroke="#4A5A66" stroke-width="3"/>
<rect x="90" y="322" width="556" height="7" rx="3.5" fill="#8296A3"/>
<text x="118" y="370" class="bxt">REPLAY, AUDIT, PARITY</text>
<text x="118" y="398" class="bxs-s" style="fill:#8FA2AF">the layer you never edit</text>
<line x1="118" y1="416" x2="618" y2="416" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="450" class="bxs-s">▪ Re-run any day without touching SAP</text>
<text x="118" y="480" class="bxs-s">▪ Bronze bug? Fix code, replay the files</text>
<text x="118" y="510" class="bxs-s">▪ Proof of exactly what the source sent</text>
<text x="118" y="540" class="bxs-s">▪ Versioned, Glacier-tiered, 7-year hold</text>
<text x="118" y="570" class="bxs-s">▪ Never edited. Never deleted.</text>
<text x="118" y="606" class="code-s">jobs/source_download.py</text>
<text x="118" y="630" class="code-s" style="fill:#8FA2AF">infra/env/dev/source_download.tf</text>

<!-- ══ ZONE 2 · THE READ (green) ══ -->
<text x="682" y="300" class="cap">2 · HOW WE READ SAP</text>
<rect x="682" y="322" width="556" height="326" rx="18" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<rect x="682" y="322" width="556" height="7" rx="3.5" fill="#3FD98A"/>
<text x="710" y="370" class="bxt">JDBC, IN PARALLEL</text>
<text x="710" y="398" class="bxs-s" style="fill:#7FBFA0">one call to SAP, per table per day</text>
<line x1="710" y1="416" x2="1210" y2="416" stroke="#2A4A3A" stroke-width="2"/>
<text x="710" y="450" class="bxs-s">▪ Custom driver ngdbc.jar, not a Glue one</text>
<text x="710" y="480" class="bxs-s">▪ Full load · watermark delta · date range</text>
<text x="710" y="510" class="bxs-s">▪ jdbc_hash_partitions: 8 readers at once</text>
<text x="710" y="540" class="bxs-s">▪ 638M-row S611 refuses a 1-partition read</text>
<text x="710" y="570" class="bxs-s">▪ Read once. Never read again for this day.</text>
<text x="710" y="606" class="code-s">sources/sap_hana.py</text>
<text x="710" y="630" class="code-s" style="fill:#8FA2AF">specs/download/sap_zncr01.yaml</text>

<!-- ══ ZONE 3 · THE WRITE (blue) ══ -->
<text x="1274" y="300" class="cap">3 · WHAT LANDS ON S3</text>
<rect x="1274" y="322" width="556" height="326" rx="18" fill="#12283F" stroke="#5AA9FF" stroke-width="3"/>
<rect x="1274" y="322" width="556" height="7" rx="3.5" fill="#5AA9FF"/>
<text x="1302" y="370" class="bxt">ONE PREFIX PER CYCLE</text>
<text x="1302" y="398" class="bxs-s" style="fill:#94B4D4">parquet parts, then the marker</text>
<line x1="1302" y1="416" x2="1802" y2="416" stroke="#2C4560" stroke-width="2"/>
<text x="1302" y="450" class="bxs-s">▪ Data files first, _SUCCESS marker last</text>
<text x="1302" y="480" class="bxs-s">▪ No marker means P2 refuses the cycle</text>
<text x="1302" y="510" class="bxs-s">▪ Re-run overwrites that cycle in place</text>
<text x="1302" y="540" class="bxs-s">▪ Big windows land under chunk=from_to</text>
<text x="1302" y="570" class="bxs-s">▪ Two overlapping writers → hard failure</text>
<text x="1302" y="606" class="code-s">writers/raw_landing.py</text>
<text x="1302" y="630" class="code-s" style="fill:#8FA2AF">raw/sap/sap.zncr01/cycle=2026-08-10/</text>

<!-- ══ WHAT CHANGES HERE — the spine ══ -->
<rect x="90" y="670" width="830" height="220" rx="18" fill="#E3000E" stroke="#FF6B72" stroke-width="3"/>
<text x="122" y="708" class="edge" style="fill:#4A0206">WHAT CHANGES HERE</text>
<text x="122" y="756" class="bxt-d">NOTHING. THAT IS THE JOB.</text>
<text x="122" y="800" class="bxs-d" style="fill:#1F0104">Byte-for-byte what SAP returned. Not typed, not renamed,</text>
<text x="122" y="830" class="bxs-d" style="fill:#1F0104">not filtered — only landed, and partitioned by cycle.</text>
<text x="122" y="860" class="bxs-d" style="fill:#1F0104">The one addition: four audit columns stamped on the way past.</text>

<!-- ══ THE TRAP ══ -->
<rect x="950" y="670" width="880" height="220" rx="18" fill="#1E1A10" stroke="#FFB84D" stroke-width="2.5"/>
<text x="982" y="706" class="edge" style="fill:#FFB84D">THE MANDT TRAP</text>
<text x="982" y="748" class="bxt-s">Every SAP table is split by client.</text>
<text x="982" y="784" class="bxs">MANDT is the first key field of almost every SAP table. Client</text>
<text x="982" y="812" class="bxs">100 is productive; 200 is a test client sitting in the same table.</text>
<text x="982" y="840" class="bxs">Forget WHERE MANDT = '100' and test rows land inside your facts.</text>
<text x="982" y="872" class="code-s" style="fill:#8FA2AF">sources/sap_hana.py:305 · specs/download/sap_zncr01.yaml:27</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Take the photocopy before you edit. If the edit goes wrong the original is still there — and SAP is never asked for it twice.</text>
