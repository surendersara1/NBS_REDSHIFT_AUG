<text x="90" y="730" class="cap">3 · THE CONTROL PLANE — FOUR DYNAMODB TABLES, FOUR QUESTIONS</text>

<rect x="90" y="748" width="390" height="142" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>

<text x="118" y="834" class="bxs-s">One row per table per stage</text>
<text x="118" y="858" class="bxs-s" style="fill:#8296A3">run_id + stage · 90-day TTL</text>
<text x="118" y="880" class="code-s" style="fill:#5E7080">control_plane/runs.py</text>

<rect x="540" y="748" width="390" height="142" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="568" y="780" class="bxt-s">watermarks</text>
<text x="568" y="808" class="bxs-s" style="fill:#FFB84D">Where did we get to last time?</text>
<text x="568" y="834" class="bxs-s">Last value pulled, per table</text>
<text x="568" y="858" class="bxs-s" style="fill:#8296A3">A failed run never advances it</text>
<text x="568" y="880" class="code-s" style="fill:#5E7080">control_plane/watermarks.py</text>

<text x="1018" y="834" class="bxs-s">Running · alarms · freshness</text>
<text x="1018" y="858" class="bxs-s" style="fill:#8296A3">Ops console polls every 10s</text>
<text x="1018" y="880" class="code-s" style="fill:#5E7080">control_plane/pipeline_state.py</text>

<text x="1468" y="834" class="bxs-s">bronze → silver → gold → view</text>
<text x="1468" y="858" class="bxs-s" style="fill:#8296A3">Deterministic id · re-emit safe</text>
