<text x="90" y="168" class="title">The Four Layers — and What Changes at Each</text>
<text x="90" y="212" class="sub">Raw → Bronze → Silver → Gold. Every hop has exactly one job. Never do two jobs in one hop.</text>

<text x="290" y="392" class="bxs" text-anchor="middle" style="fill:#8FA2AF">the untouched dump</text>
<line x1="130" y1="416" x2="450" y2="416" stroke="#2C3841" stroke-width="2"/>

<text x="130" y="484" class="bxs-s">▪ Parquet files on S3, per cycle</text>
<text x="130" y="516" class="bxs-s">▪ Never edited. Never deleted.</text>
<text x="130" y="548" class="bxs-s">▪ 7-year retention</text>

<text x="290" y="624" class="bxs-s" text-anchor="middle" style="fill:#FFB84D">Nothing. That's the point.</text>
<text x="290" y="676" class="code-s" text-anchor="middle">jobs/source_download.py</text>
<text x="290" y="700" class="code-s" text-anchor="middle" style="fill:#5E7080">writers/raw_landing.py</text>
<text x="290" y="742" class="bxs-s" text-anchor="middle" style="fill:#7A8C99">Why: replay anything, anytime</text>

<text x="570" y="548" class="bxs-s">▪ Still 1:1 with the source</text>

<text x="730" y="624" class="bxs-s" text-anchor="middle" style="fill:#FFB84D">Shape, not meaning</text>
