<!-- ══ WHAT CHANGES HERE — the spine ══ -->
<rect x="90" y="670" width="830" height="220" rx="18" fill="#E3000E" stroke="#FF6B72" stroke-width="3"/>
<text x="122" y="708" class="edge" style="fill:#4A0206">WHAT CHANGES HERE</text>
<text x="122" y="756" class="bxt-d">ANSWERS, NOT RECORDS.</text>
<text x="122" y="800" class="bxs-d" style="fill:#1F0104">Rows are reshaped to the question the report asks. Every</text>
<text x="122" y="830" class="bxs-d" style="fill:#1F0104">measure is computed once, in SQL, and stored. Power BI</text>
<text x="122" y="860" class="bxs-d" style="fill:#1F0104">reads a number instead of deriving one.</text>

<!-- ══ THE TRAP ══ -->
<rect x="950" y="670" width="880" height="220" rx="18" fill="#1E1A10" stroke="#FFB84D" stroke-width="2.5"/>
<text x="982" y="706" class="edge" style="fill:#FFB84D">THE 'All Dept' TRAP · CRIT-04</text>
<text x="982" y="748" class="bxt-s">A helpful subtotal row that doubles every KPI.</text>
<text x="982" y="784" class="bxs">unified_sales carries a synthetic dept = 'All Dept' row per site ×</text>
<text x="982" y="812" class="bxs">date, so DAX can filter straight to it. Any rollup that SUMs across</text>
<text x="982" y="840" class="bxs">dept must exclude it — or every store total comes out about 2× high.</text>
<text x="982" y="872" class="code-s" style="fill:#8FA2AF">reporting/vw_store_performance_bands.sql:53  WHERE dept != 'All Dept'</text>
