<!-- ══ ZONE 3 · EVIDENCE ══ -->
<text x="90" y="612" class="cap">3 · THE EVIDENCE IN THE REPO</text>

<!-- E1 late-binding views -->
<rect x="90" y="634" width="560" height="254" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="678" class="bxt-s">STAGING VIEWS ARE LATE-BINDING</text>
<line x1="118" y1="694" x2="622" y2="694" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="726" class="bxs-s">A plain Redshift view cannot SELECT from</text>
<text x="118" y="754" class="bxs-s">an external schema — Redshift refuses. So</text>
<text x="118" y="782" class="bxs-s">the whole staging layer is declared:</text>
<rect x="118" y="798" width="504" height="58" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="138" y="822" class="code" xml:space="preserve">staging:  +materialized: view</text>
<text x="138" y="844" class="code" xml:space="preserve" style="fill:#FFB84D">          +bind: false   # NO SCHEMA BINDING</text>
<text x="118" y="878" class="code-s" style="fill:#5E7080">src/dbt/dbt_project.yml:63-72</text>

<!-- E2 IAM -->
<rect x="690" y="634" width="560" height="254" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="718" y="678" class="bxt-s">TWO DIFFERENT DOORS</text>
<line x1="718" y1="694" x2="1222" y2="694" stroke="#2C3841" stroke-width="2"/>
<text x="718" y="726" class="bxs-s">Spectrum never gets raw s3: actions on</text>
<text x="718" y="754" class="bxs-s">the S3 Tables managed bucket. Glue's</text>
<text x="718" y="782" class="bxs-s">Iceberg writer is the one that does.</text>
<rect x="718" y="798" width="504" height="58" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="738" y="822" class="code" xml:space="preserve" style="fill:#6FD8A8">READ   redshift-role → s3tables:GetTableData</text>
<text x="738" y="844" class="code" xml:space="preserve" style="fill:#7FB6EF">WRITE  glue-role     → s3:Get/PutObject</text>
<text x="718" y="878" class="code-s" style="fill:#5E7080">infra/modules/iam/main.tf:309-317, 334</text>

<!-- E3 the rule -->
<rect x="1290" y="634" width="540" height="254" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="1318" y="678" class="bxt-s" style="fill:#FF6A72">THE ONE-LINE RULE</text>
<line x1="1318" y1="694" x2="1802" y2="694" stroke="#5A2028" stroke-width="2"/>
<text x="1318" y="734" class="plain">Spectrum's job is to FEED dbt.</text>
<text x="1318" y="768" class="plain">dbt's output is NATIVE.</text>
<text x="1318" y="812" class="plain">After dbt — Gold, the reporting</text>
<text x="1318" y="846" class="plain">views, Power BI — no Spectrum.</text>
<text x="1318" y="878" class="bxs-s" style="fill:#FFB84D">That is why Gold is fast.</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Spectrum lets Redshift read someone else's filing cabinet. dbt copies what it needs into Redshift's own cabinet — then no more trips.</text>
