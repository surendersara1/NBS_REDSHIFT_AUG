<text x="90" y="104" class="eyebrow">MODULE 1 · LESSON 12</text>
<text x="90" y="168" class="title">Reading Data Redshift Doesn't Own</text>
<text x="90" y="212" class="sub">Redshift Spectrum — query files that live in S3 as if they were tables. Nothing is ever loaded in.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · TWO KINDS OF TABLE ══ -->
<text x="90" y="300" class="cap">1 · TWO KINDS OF TABLE</text>

<!-- A: NATIVE -->
<rect x="90" y="320" width="530" height="250" rx="16" fill="#1B2329" stroke="#4A5A66" stroke-width="3"/>
<rect x="90" y="320" width="530" height="7" rx="3.5" fill="#8296A3"/>
<text x="118" y="364" class="bxt-s">NATIVE TABLE</text>
<line x1="118" y1="384" x2="592" y2="384" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="418" class="bxs-s">▪ Bytes live in Redshift's own storage</text>
<text x="118" y="448" class="bxs-s">▪ Redshift wrote it and owns it</text>
<text x="118" y="478" class="bxs-s">▪ Sorted + dist-keyed + compressed</text>
<text x="118" y="508" class="bxs-s">▪ Nothing outside Redshift is touched</text>
<text x="118" y="546" class="code" style="fill:#6FD8A8">gold.unified_sales · built by dbt</text>

<!-- B: EXTERNAL (the thing being taught → red) -->
<rect x="650" y="320" width="530" height="250" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<rect x="650" y="320" width="530" height="7" rx="3.5" fill="#E3000E"/>
<text x="678" y="364" class="bxt-s" style="fill:#FF6A72">EXTERNAL TABLE</text>
<text x="1152" y="364" class="edge-s" text-anchor="end" style="fill:#B06068">SPECTRUM</text>
<line x1="678" y1="384" x2="1152" y2="384" stroke="#5A2028" stroke-width="2"/>
<text x="678" y="418" class="bxs-s">▪ Bytes stay in S3 — never copied in</text>
<text x="678" y="448" class="bxs-s">▪ Redshift stores a pointer, not data</text>
<text x="678" y="478" class="bxs-s">▪ Columns + types come from Glue</text>
<text x="678" y="508" class="bxs-s">▪ Dropping it deletes zero data</text>
<text x="678" y="546" class="code" style="fill:#FFA0A6">silver_external.sap_zsdcc</text>

<!-- ══ ZONE 2 · COMPUTE ══ -->
<text x="1230" y="300" class="cap">2 · WHERE THE COMPUTE HAPPENS</text>
<rect x="1230" y="320" width="600" height="250" rx="16" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="1258" y="364" class="bxt-s">THE SCAN HAPPENS OUTSIDE</text>
<line x1="1258" y1="384" x2="1802" y2="384" stroke="#2A4A3A" stroke-width="2"/>
<text x="1258" y="418" class="bxs-s">Spectrum is a separate AWS-managed fleet.</text>
<text x="1258" y="448" class="bxs-s">It reads, filters and projects the S3 files;</text>
<text x="1258" y="478" class="bxs-s">only the surviving rows reach your RPUs,</text>
<text x="1258" y="508" class="bxs-s">which do the join and the final aggregate.</text>
<text x="1258" y="546" class="bxs-s" style="fill:#FFB84D">Push filters DOWN — no WHERE = read it all.</text>

<!-- ══ ZONE 3 · THE STATEMENT + THE BILL ══ -->
<text x="90" y="616" class="cap">3 · THE STATEMENT — AND THE BILL</text>

<!-- D: the real SQL -->
<rect x="90" y="638" width="1080" height="250" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="682" class="bxt-s">One statement mounts the whole Silver layer</text>
<text x="1142" y="682" class="code-s" text-anchor="end" style="fill:#5E7080">run_dbt.py:151-155</text>
<rect x="118" y="700" width="1024" height="140" rx="10" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="142" y="730" class="code" xml:space="preserve" style="font-size:19px">CREATE EXTERNAL SCHEMA IF NOT EXISTS silver_external</text>
<text x="142" y="758" class="code" xml:space="preserve" style="font-size:19px">FROM DATA CATALOG</text>
<text x="142" y="786" class="code" xml:space="preserve" style="font-size:19px">  DATABASE '{silver_glue_db}'    <tspan fill="#5E7080">-- silver_dev</tspan></text>
<text x="142" y="814" class="code" xml:space="preserve" style="font-size:19px">  IAM_ROLE '{redshift_role_arn}' <tspan fill="#5E7080">-- the Redshift role</tspan></text>
<text x="118" y="870" class="bxs-s" style="fill:#FFB84D">No CATALOG_ID on purpose — Spectrum hardcodes catalogId=&lt;account&gt; anyway (run_dbt.py:144-146).</text>

<!-- E: cost model -->
<rect x="1210" y="638" width="620" height="250" rx="16" fill="#1B2A33" stroke="#3A5766" stroke-width="3"/>
<text x="1238" y="682" class="bxt-s">WHAT IT COSTS</text>
<line x1="1238" y1="700" x2="1802" y2="700" stroke="#2C3841" stroke-width="2"/>
<text x="1238" y="734" class="bxs-s">▪ Spectrum is billed per terabyte scanned</text>
<text x="1238" y="764" class="bxs-s">▪ A native scan is already paid for (RPUs)</text>
<text x="1238" y="794" class="bxs-s">▪ Parquet + partition pruning = fewer bytes</text>
<text x="1238" y="824" class="bxs-s">▪ 9 models over one staging view = 9 scans</text>
<text x="1238" y="866" class="bxs-s" style="fill:#FFB84D">So: materialise once, then read it many times.</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A native table is a book on your shelf. An external table is a library card — the library keeps the book and bills you per page.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 1 · Lesson 12</text>
