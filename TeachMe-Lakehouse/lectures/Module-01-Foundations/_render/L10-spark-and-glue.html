<text x="90" y="104" class="eyebrow">MODULE 1 · LESSON 10</text>
<text x="90" y="168" class="title">Spark &amp; AWS Glue: Why Not Just a Python Script</text>
<text x="90" y="212" class="sub">One machine over 638M rows takes days; twelve take minutes. What Spark does with your code — and when it's overkill.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ═══ ZONE 1 · the scale problem ═══ -->
<text x="90" y="298" class="cap">1 · THE SCALE PROBLEM</text>

<!-- A · one python script (not used) -->
<rect x="90" y="320" width="520" height="246" rx="16" fill="#161B20" stroke="#3A4854" stroke-width="2.5" stroke-dasharray="11 8"/>
<text x="118" y="364" class="bxt-s" style="fill:#8296A3">ONE PYTHON SCRIPT</text>
<text x="118" y="396" class="bxs" style="fill:#8FA2AF">pandas + one JDBC connection</text>
<line x1="118" y1="416" x2="582" y2="416" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="452" class="bxs-s">▪ One CPU, one heap, one machine</text>
<text x="118" y="484" class="bxs-s">▪ 638M rows never fit in RAM</text>
<text x="118" y="516" class="bxs-s">▪ Fails at hour 6 → restart at 0</text>
<text x="118" y="550" class="code-s" style="fill:#5E7080">sources/sap_hana.py:188-192</text>

<text x="630" y="450" class="edge" style="fill:#FF3B47" text-anchor="middle">vs</text>

<!-- B · spark on glue (the thing being taught) -->
<rect x="650" y="320" width="520" height="246" rx="16" fill="#2B1216" stroke="#E3000E" stroke-width="3"/>
<rect x="650" y="320" width="520" height="7" rx="3.5" fill="#E3000E"/>
<text x="678" y="364" class="bxt-s" style="fill:#FF6B72">SPARK ON AWS GLUE</text>
<text x="678" y="396" class="bxs" style="fill:#E2A9AD">A cluster that lives 40 minutes</text>
<line x1="678" y1="416" x2="1142" y2="416" stroke="#5A2228" stroke-width="2"/>
<text x="678" y="452" class="bxs-s">▪ 12 × G.2X workers, on demand</text>
<text x="678" y="484" class="bxs-s">▪ The SAME PySpark code — Spark</text>
<text x="678" y="516" class="bxs-s">▪ splits the work across them</text>
<text x="678" y="550" class="code-s" style="fill:#5E7080">env/dev/glue_sources.tf:146-147</text>

<!-- ═══ ZONE 2 · the four ideas ═══ -->
<text x="90" y="614" class="cap">2 · THE FOUR IDEAS YOU MUST HOLD</text>

<!-- partitions -->
<rect x="90" y="636" width="414" height="176" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="90" y="636" width="414" height="7" rx="3.5" fill="#5AA9FF"/>
<text x="114" y="678" class="bxt-s">PARTITIONS</text>
<line x1="114" y1="694" x2="480" y2="694" stroke="#2C3841" stroke-width="2"/>
<text x="114" y="726" class="bxs-s">One DataFrame = N chunks. Each</text>
<text x="114" y="754" class="bxs-s">chunk is one unit of work.</text>
<text x="114" y="790" class="code-s" style="fill:#5E7080">specs/download/sap_s611.yaml:28</text>

<!-- executors -->
<rect x="532" y="636" width="414" height="176" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="532" y="636" width="414" height="7" rx="3.5" fill="#5AA9FF"/>
<text x="556" y="678" class="bxt-s">EXECUTORS</text>
<line x1="556" y1="694" x2="922" y2="694" stroke="#2C3841" stroke-width="2"/>
<text x="556" y="726" class="bxs-s">12 worker JVMs chew chunks in</text>
<text x="556" y="754" class="bxs-s">parallel. More workers = faster.</text>
<text x="556" y="790" class="code-s" style="fill:#5E7080">env/dev/glue_sources.tf:146</text>

<!-- lazy -->
<rect x="974" y="636" width="414" height="176" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="974" y="636" width="414" height="7" rx="3.5" fill="#FFB84D"/>
<text x="998" y="678" class="bxt-s">LAZY EVALUATION</text>
<line x1="998" y1="694" x2="1364" y2="694" stroke="#2C3841" stroke-width="2"/>
<text x="998" y="726" class="bxs-s">Nothing runs until you ask. Then</text>
<text x="998" y="754" class="bxs-s">each ask re-reads SAP — cache it.</text>
<text x="998" y="790" class="code-s" style="fill:#5E7080">sources/sap_hana.py:1151-1160</text>

<!-- shuffles -->
<rect x="1416" y="636" width="414" height="176" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="1416" y="636" width="414" height="7" rx="3.5" fill="#FFB84D"/>
<text x="1440" y="678" class="bxt-s">SHUFFLES</text>
<line x1="1440" y1="694" x2="1806" y2="694" stroke="#2C3841" stroke-width="2"/>
<text x="1440" y="726" class="bxs-s">groupBy / join / dedupe moves</text>
<text x="1440" y="754" class="bxs-s">rows between machines. Slow.</text>
<text x="1440" y="790" class="code-s" style="fill:#5E7080">writers/s3_tables.py:539</text>

<!-- wrong tool strip -->
<rect x="90" y="828" width="1740" height="62" rx="12" fill="#141A20" stroke="#3A4854" stroke-width="2" stroke-dasharray="10 7"/>
<text x="122" y="854" class="edge" style="fill:#7A8C99">WHEN SPARK IS THE WRONG TOOL</text>
<text x="122" y="878" class="bxs-s" style="fill:#A9BAC6">Under ~10M rows one machine wins — cluster startup and shuffle cost more than the work. Our dbt runner is a Glue Python-Shell job, not Spark.</text>

<!-- plain english -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Spark is a foreman, not a faster laptop. You describe the work; it splits the data across 12 machines and only starts when you ask.</text>
