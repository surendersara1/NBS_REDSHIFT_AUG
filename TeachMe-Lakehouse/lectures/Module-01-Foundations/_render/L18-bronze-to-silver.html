<text x="710" y="570" class="bxs-s">▪ scan_611 · distress_603 · id8_product</text>

<!-- ══ WHAT CHANGES HERE — the spine ══ -->
<rect x="90" y="670" width="830" height="220" rx="18" fill="#E3000E" stroke="#FF6B72" stroke-width="3"/>
<text x="122" y="708" class="edge" style="fill:#4A0206">WHAT CHANGES HERE</text>
<text x="122" y="756" class="bxt-d">BUSINESS MEANING.</text>
<text x="122" y="800" class="bxs-d" style="fill:#1F0104">Names, units and keys are conformed. SAP's own derived</text>
<text x="122" y="830" class="bxs-d" style="fill:#1F0104">objects are rebuilt in PySpark. A row now means something</text>
<text x="122" y="860" class="bxs-d" style="fill:#1F0104">a human can name — not just what a table happened to hold.</text>

<!-- ══ THE TRAP ══ -->
<rect x="950" y="670" width="880" height="220" rx="18" fill="#1E1A10" stroke="#FFB84D" stroke-width="2.5"/>
<text x="982" y="706" class="edge" style="fill:#FFB84D">THE FAN-OUT TRAP · TVKMT</text>
<text x="982" y="748" class="bxt-s">One missing filter doubles every sales row.</text>
<text x="982" y="784" class="bxs">TVKMT is language-keyed (MANDT, SPRAS, KTGRM). In client 100 it</text>
<text x="982" y="812" class="bxs">holds 43 English depts + 43 Arabic + 3 German. Join on KTGRM alone</text>
<text x="982" y="840" class="bxs">and every ZDSALES row matches twice — sale and count silently 2×.</text>
<text x="982" y="872" class="code-s" style="fill:#8FA2AF">specs/transform/zsdcc.yaml:59 → right_where: "SPRAS = 'E'"</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A join is a lookup. If the lookup holds two rows for one key, every left row comes back twice — and nothing raises an error.</text>
