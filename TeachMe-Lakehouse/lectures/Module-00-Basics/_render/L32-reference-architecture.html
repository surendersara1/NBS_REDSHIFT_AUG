<line x1="432" y1="370" x2="678" y2="370" stroke="#2E4A66" stroke-width="2"/>
<text x="432" y="406" class="bxs-s" style="font-size:17px">AWS Glue (Spark)</text>

<text x="432" y="508" class="bxs-s" style="font-size:17px">Transfer Family</text>
<text x="432" y="542" class="bxs-s" style="font-size:17px">AppFlow</text>
<text x="432" y="576" class="bxs-s" style="font-size:17px;fill:#5E7080">Firehose (if streaming)</text>

<!-- ══ LAKE ══ -->
<rect x="730" y="316" width="420" height="430" rx="14" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<text x="752" y="354" class="bxt-s" style="font-size:20px;fill:#FF3B47">LAKE &#8212; S3 + ICEBERG</text>
<line x1="752" y1="370" x2="1128" y2="370" stroke="#6A2A30" stroke-width="2"/>
<text x="752" y="406" class="bxs-s" style="font-size:17px;fill:#E5B8BC"><tspan style="fill:#FFFFFF">raw/</tspan> &#8212; immutable landing, as received</text>
<text x="752" y="440" class="bxs-s" style="font-size:17px;fill:#E5B8BC"><tspan style="fill:#FFFFFF">bronze/</tspan> &#8212; Iceberg, typed, deduplicated</text>
<text x="752" y="474" class="bxs-s" style="font-size:17px;fill:#E5B8BC"><tspan style="fill:#FFFFFF">silver/</tspan> &#8212; Iceberg, conformed, joined</text>
<text x="752" y="514" class="bxs-s" style="font-size:17px;fill:#E5B8BC">Amazon S3 Tables (managed Iceberg)</text>
<text x="752" y="548" class="bxs-s" style="font-size:17px;fill:#E5B8BC">Lifecycle: hot &#8594; IA &#8594; Glacier IR</text>
<text x="752" y="582" class="bxs-s" style="font-size:17px;fill:#E5B8BC">MERGE on a key &#8212; never blind append</text>
<line x1="752" y1="606" x2="1128" y2="606" stroke="#6A2A30" stroke-width="2"/>
<text x="752" y="640" class="tdn" style="font-size:17px;fill:#C08A90">one copy of the data; every engine</text>
<text x="752" y="666" class="tdn" style="font-size:17px;fill:#C08A90">reads it through the catalog</text>
<text x="752" y="700" class="code" style="font-size:16px;fill:#FF8A92">Lessons 26&#8211;29</text>

<line x1="1154" y1="520" x2="1176" y2="520" stroke="#7A8C99" stroke-width="3" marker-end="url(#aw)"/>

<!-- ══ WAREHOUSE ══ -->
<rect x="1180" y="316" width="330" height="430" rx="14" fill="#0F1E17" stroke="#2A5A40" stroke-width="2.5"/>
<text x="1202" y="354" class="bxt-s" style="font-size:20px;fill:#3FD98A">WAREHOUSE</text>
<line x1="1202" y1="370" x2="1488" y2="370" stroke="#2A5A40" stroke-width="2"/>
<text x="1202" y="406" class="bxs-s" style="font-size:17px">Redshift Serverless</text>
<text x="1202" y="440" class="bxs-s" style="font-size:17px"><tspan style="fill:#FFFFFF">gold/</tspan> &#8212; facts and dimensions</text>
<text x="1202" y="474" class="bxs-s" style="font-size:17px">Built by dbt, MERGE-loaded</text>
<text x="1202" y="508" class="bxs-s" style="font-size:17px">Materialized views for BI</text>
<text x="1202" y="542" class="bxs-s" style="font-size:17px">Spectrum reads silver in place</text>
<text x="1202" y="576" class="bxs-s" style="font-size:17px">RLS / CLS on sensitive columns</text>
<line x1="1202" y1="606" x2="1488" y2="606" stroke="#2A5A40" stroke-width="2"/>
<text x="1202" y="640" class="tdn" style="font-size:17px">load what you join hard;</text>
<text x="1202" y="666" class="tdn" style="font-size:17px">point at the rest</text>
<text x="1202" y="700" class="code" style="font-size:16px;fill:#4E6472">Lessons 10&#8211;18</text>

<line x1="1514" y1="520" x2="1536" y2="520" stroke="#7A8C99" stroke-width="3" marker-end="url(#aw)"/>

<text x="1562" y="406" class="bxs-s" style="font-size:17px;fill:#E8D5B0">Power BI (reporting)</text>
<text x="1562" y="440" class="bxs-s" style="font-size:17px;fill:#E8D5B0">Amazon QuickSight</text>
<text x="1562" y="474" class="bxs-s" style="font-size:17px;fill:#E8D5B0">Athena (ad-hoc SQL)</text>
<text x="1562" y="508" class="bxs-s" style="font-size:17px;fill:#E8D5B0">SageMaker (ML)</text>
<text x="1562" y="542" class="bxs-s" style="font-size:17px;fill:#E8D5B0">Ops &amp; monitoring console</text>
<text x="1562" y="576" class="bxs-s" style="font-size:17px;fill:#E8D5B0">UNLOAD back to S3</text>

<text x="1562" y="666" class="tdn" style="font-size:17px;fill:#B99A6A">underlying fact tables</text>
<text x="1562" y="700" class="code" style="font-size:16px;fill:#B99A6A">Lesson 15</text>
