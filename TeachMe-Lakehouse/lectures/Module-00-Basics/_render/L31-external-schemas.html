<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 31</text>
<text x="90" y="168" class="title">One Query, Three Systems</text>
<text x="90" y="212" class="sub">An external schema is a pointer. Once you have four kinds of pointer, one SQL statement can span the warehouse, the lake and production.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="352" class="bxt-s" style="font-size:23px">The table appears in your database. The bytes stay where they were.</text>
<text x="118" y="392" class="code" style="font-size:18px">SELECT ... FROM gold.fct_sales f JOIN lake_ext.silver_store s USING(...) JOIN live_pg.customers c USING(...)</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · FOUR DOORS, FOUR DESTINATIONS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">ALL FOUR LOOK LIKE AN ORDINARY SCHEMA IN SQL</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">REDSHIFT &#8594; S3</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">Redshift Spectrum</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">External schema from the Glue catalog. Reads the lake without ever loading it in.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">REDSHIFT &#8594; LIVE DATABASE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">federated query</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">External schema onto RDS or Aurora PostgreSQL / MySQL, with predicates pushed down.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">ATHENA &#8594; ANYTHING</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">federated connectors</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">The same catalog, plus connectors out to Redshift, DynamoDB, Snowflake and others.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">REDSHIFT &#8594; REDSHIFT</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">datashares</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Another warehouse&#8217;s live tables, across clusters, accounts and Regions.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">an external schema is a pointer — the work still happens, just somewhere else</text>

<!-- ══ ZONE 3 · WHO PAYS ══ -->
<text x="1270" y="462" class="zwhen">3 · WHO ACTUALLY PAYS</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px"><tspan style="fill:#3FD98A">Spectrum</tspan> — bytes scanned in S3</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px"><tspan style="fill:#5AA9FF">Federated</tspan> — load on the production DB</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px"><tspan style="fill:#C9D6DE">Datashare</tspan> — the consumer&#8217;s own compute</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NEVER</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Assume a pointer makes the work free</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">An external schema exposes S3 Tables data.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Spectrum&#8217;s read support is broad.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Its write support is narrow and format-specific.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">verify before promising a write path</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Four doors, all painted the same. The SQL looks identical through each one; the bill and the blast radius do not.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 31</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
