<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 24</text>
<text x="90" y="168" class="title">Eight Sources, One Platform</text>
<text x="90" y="212" class="sub">The hard part is not any single pipeline. It is making eight of them fail independently and land in the same shape.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Eight pipelines is not eight times one pipeline</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">One source is an engineering problem. Eight sources is a convention problem — and conventions have to be decided before the second one.</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR CONVENTIONS THAT MAKE THE NINTH SOURCE CHEAP</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">ONE LANDING SHAPE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">raw/&lt;source&gt;/&lt;table&gt;/dt=...</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Every source lands under the same prefix pattern, partitioned the same way. No exceptions.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">ONE CONTRACT PER SOURCE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">declared in config</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Schema, key, load mode and owner declared once — in configuration, never buried in code.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">ISOLATION</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">separate runs and state</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">One bad feed must not stall the other seven. Separate runs, separate state, separate alarms.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">LATE AND DUPLICATE ROWS</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">assume both</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Rows will arrive late and twice. An idempotent MERGE on a key makes both harmless.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">if adding the ninth source needs new code, the eighth was onboarded wrong</text>

<!-- ══ ZONE 3 · WHEN TO USE IT ══ -->
<text x="1270" y="462" class="zwhen">3 · DECIDE THESE EARLY</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">Partition key and its format</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">Timezone — pick one and write it down</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">What &#8220;yesterday&#8221; means for each source</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NEVER</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Let one source invent its own conventions</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Three Oracle sources share one connector.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Two SaaS APIs share a second.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Footfall files share a third.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">8 sources · 3 connectors</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Every supplier delivers to the same bay, in the same boxes, with the same label. Otherwise the warehouse staff become the bottleneck.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 24</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
