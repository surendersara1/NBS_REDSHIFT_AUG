<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 05</text>
<text x="90" y="168" class="title">Data Mesh Is Not A Product</text>
<text x="90" y="212" class="sub">Mesh is about who owns the data, not where it sits. You can build one on a lakehouse — you cannot buy one.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">An operating model for organisations, wearing the costume of an architecture</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Nothing in a mesh is a service you can switch on. Every part of it is a decision about teams, ownership and accountability.</text>

<rect x="1420" y="336" width="410" height="64" rx="12" fill="#231519" stroke="#7A3A40" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="1446" y="376" class="bxt-s" style="font-size:19px;fill:#FF6B73">no service does this for you</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR PRINCIPLES — ALL FOUR ARE ABOUT PEOPLE</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">DOMAIN OWNERSHIP</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">org, not tech</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">The team that produces the data owns it — its quality, its documentation and its pager.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">DATA AS A PRODUCT</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">SLA + contract</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Each dataset has a named owner, a published schema and consumers allowed to complain.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">FEDERATED GOVERNANCE</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">AWS Lake Formation</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">A central group sets the rules; each domain applies them. Nobody becomes the bottleneck.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">SELF-SERVE PLATFORM</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">the platform is a product</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Domains publish data without filing a ticket, because the tooling is built for them to use.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A3A4A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CC4E8">on AWS: Lake Formation grants over RAM · Redshift datashares · federated catalogs</text>

<!-- ══ ZONE 3 · WHEN TO USE IT ══ -->
<text x="1270" y="462" class="zwhen">3 · WHEN TO USE IT</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">Many domains, each with its own engineers</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">The central team has become the bottleneck</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">Governance can be automated, not policed</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NOT FOR</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">One team and one platform — pure overhead</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Neither of our platforms is a mesh.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">One platform team owns end to end.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Learn the word so you can push back on it.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">mesh too early buys ceremony</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Mesh is not a building. It is the rule about who holds the keys to each room and who you call when the lights are off.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 05</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
