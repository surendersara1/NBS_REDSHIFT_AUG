<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 16</text>
<text x="90" y="168" class="title">Reading Without Copying</text>
<text x="90" y="212" class="sub">Three doors let Redshift see data it does not store — and one of them changed recently in a way most people have missed.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">An external schema is a pointer, not a copy</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">The table appears in Redshift and you query it with ordinary SQL. The bytes never move — which means the cost moves, it does not vanish.</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">THREE DOORS — POINTING AT THREE DIFFERENT KINDS OF THING</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">SPECTRUM &#8594; S3</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">CREATE EXTERNAL SCHEMA</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">External tables over the lake. Reads Parquet, ORC, CSV, JSON, Avro — plus Iceberg, Hudi CoW and Delta.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">FEDERATED &#8594; LIVE DB</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">RDS / Aurora PostgreSQL · MySQL</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Queries the operational database as it is right now. Filters are pushed down to the source.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">DATASHARE &#8594; REDSHIFT</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">producer / consumer</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Live data from another cluster, account or Region. No copy, no ETL and no lag at all.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="744" width="1064" height="62" rx="10" fill="#12331F" stroke="#3FD98A" stroke-width="2.5"/>
<text x="138" y="770" class="bxt-s" style="font-size:19px;fill:#3FD98A">CORRECTION WORTH MAKING OUT LOUD &#8212; DATASHARES ARE NO LONGER READ-ONLY</text>
<text x="138" y="795" class="bxs-s" style="font-size:18px;fill:#A9E8C4">authorize-data-share --allow-writes lets a consumer INSERT and UPDATE producer data.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#5A3A2A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#FFB84D">pointing at data does not make it free — it moves the bill from storage to every query</text>

<!-- ══ ZONE 3 · WHEN TO USE IT ══ -->
<text x="1270" y="462" class="zwhen">3 · WHEN TO USE WHICH</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px"><tspan style="fill:#3FD98A">Spectrum</tspan> — cold history you rarely scan</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px"><tspan style="fill:#5AA9FF">Federated</tspan> — small, live lookups</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFB84D">Datashare</tspan> — another team&#8217;s warehouse</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NEVER</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Federated query for a big analytical scan</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">An external schema exposes S3 Tables data.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Redshift reads Iceberg it never loaded.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Gold is loaded; silver is pointed at.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">load what you join hard</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A library card, not a photocopy. You can read the book any time — but you walk to the other building every single time you open it.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 16</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
