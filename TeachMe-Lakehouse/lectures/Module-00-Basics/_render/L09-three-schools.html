<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 09</text>
<text x="90" y="168" class="title">Three Schools Of Warehouse Design</text>
<text x="90" y="212" class="sub">You will meet all three names in interviews and RFPs. They disagree on where the modelling effort goes, not on the goal.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Same destination, three different orders of work</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">All three end with business users querying trustworthy tables. They differ on what you build first and how much you model up front.</text>

<!-- ══ ZONE 2 · SIDE BY SIDE ══ -->
<text x="90" y="462" class="zhow">2 · SIDE BY SIDE</text>

<!-- card 1 KIMBALL -->
<rect x="90" y="478" width="560" height="346" rx="16" fill="#231114" stroke="#E3000E" stroke-width="3.5"/>
<text x="118" y="518" class="bxt-s" style="font-size:23px">KIMBALL</text>
<text x="622" y="518" class="code-s" text-anchor="end" style="fill:#C08A90">bottom-up</text>
<line x1="118" y1="536" x2="622" y2="536" stroke="#6A2A30" stroke-width="2"/>
<text x="118" y="570" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Build the marts first, one business process at a time</text>
<text x="118" y="600" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Star schemas, made for querying</text>
<text x="118" y="630" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Fast to first value; users understand it</text>
<text x="118" y="660" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Risk: marts drift apart without conformed dimensions</text>
<line x1="118" y1="686" x2="622" y2="686" stroke="#6A2A30" stroke-width="2"/>
<text x="118" y="716" class="th" style="fill:#C08A90">ON AWS</text>
<text x="118" y="746" class="code" style="font-size:17px;fill:#FF8A92">dbt marts on Redshift</text>
<text x="118" y="790" class="bxt-s" style="font-size:19px;fill:#FF3B47">WHAT LAKEHOUSES USE</text>

<!-- card 2 INMON -->
<rect x="680" y="478" width="560" height="346" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="708" y="518" class="bxt-s" style="font-size:23px">INMON</text>
<text x="1212" y="518" class="code-s" text-anchor="end" style="fill:#5E7080">top-down</text>
<line x1="708" y1="536" x2="1212" y2="536" stroke="#2C3841" stroke-width="2"/>
<text x="708" y="570" class="bxs-s" style="font-size:18px">One normalised 3NF core for the enterprise</text>
<text x="708" y="600" class="bxs-s" style="font-size:18px">Marts are derived from that core</text>
<text x="708" y="630" class="bxs-s" style="font-size:18px">Single version of truth by construction</text>
<text x="708" y="660" class="bxs-s" style="font-size:18px">Slow to first value; big up-front modelling effort</text>
<line x1="708" y1="686" x2="1212" y2="686" stroke="#2C3841" stroke-width="2"/>
<text x="708" y="716" class="th">ON AWS</text>
<text x="708" y="746" class="code" style="font-size:17px">3NF core in Redshift</text>
<text x="708" y="790" class="bxt-s" style="font-size:19px;fill:#A9BAC6">LARGE ENTERPRISES</text>

<!-- card 3 DATA VAULT -->
<rect x="1270" y="478" width="560" height="346" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="518" class="bxt-s" style="font-size:23px">DATA VAULT</text>
<text x="1802" y="518" class="code-s" text-anchor="end" style="fill:#5E7080">audit-first</text>
<line x1="1298" y1="536" x2="1802" y2="536" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="570" class="bxs-s" style="font-size:18px">Hubs (keys), links (relationships), satellites (attributes)</text>
<text x="1298" y="600" class="bxs-s" style="font-size:18px">Built for change and full auditability</text>
<text x="1298" y="630" class="bxs-s" style="font-size:18px">Every source keeps its own history</text>
<text x="1298" y="660" class="bxs-s" style="font-size:18px">Very many tables; needs generation and tooling</text>
<line x1="1298" y1="686" x2="1802" y2="686" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="716" class="th">ON AWS</text>
<text x="1298" y="746" class="code" style="font-size:17px">generated dbt models</text>
<text x="1298" y="790" class="bxt-s" style="font-size:19px;fill:#A9BAC6">HEAVY REGULATION</text>

<!-- ══ VERDICT ══ -->
<rect x="90" y="840" width="1740" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="118" y="876" class="bxs-s" style="font-size:20px;fill:#8CE8B8">Modern lakehouses come out Kimball-shaped at the gold layer — because bronze and silver already hold the raw history the other two schools model explicitly.</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Kimball furnishes one room at a time. Inmon draws the whole house first. Data Vault keeps a receipt for every brick. We furnish rooms.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 09</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
