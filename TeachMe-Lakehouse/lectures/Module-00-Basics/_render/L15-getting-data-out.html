<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 15</text>
<text x="90" y="168" class="title">Getting Data Out Again</text>
<text x="90" y="212" class="sub">A warehouse that only lets people in through one door becomes the exact bottleneck it was built to remove.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Reading is not just BI — four different consumers need four different doors</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Analysts, applications, other engines and machine learning all want the same numbers, and none of them wants them the same way.</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR EXITS, AND THE FIRST ONE IS THE MOST OVERLOOKED</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">UNLOAD</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">UNLOAD ... TO 's3://...'</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Writes results to S3 as Parquet. How gold data gets republished for cheaper engines to read.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">JDBC / ODBC</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">Power BI · Tableau · QuickSight</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">The BI path. Point it at views, never at raw fact tables, so you can change the model underneath.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">DATA API</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">redshift-data</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">HTTP calls, no driver and no held connection. The right choice from Lambda and Step Functions.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">ENGINES &amp; ML</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">Glue · EMR · SageMaker</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Spark reads frames straight out; Redshift ML trains and scores without the data ever leaving.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">publishing gold back to S3 stops Redshift from becoming the only way to the data</text>

<!-- ══ ZONE 3 · WHEN TO USE IT ══ -->
<text x="1270" y="462" class="zwhen">3 · PICK BY CONSUMER</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">Dashboards &#8594; JDBC onto views</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">Applications and Lambda &#8594; Data API</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">Other engines &#8594; UNLOAD to Parquet</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NEVER</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Let BI tools query the fact tables directly</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Power BI reads reporting views only.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Views are late-binding, so models can move.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">The BI role has SELECT and nothing else.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">views are the contract</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="982" class="plain">Give people the right exit and they stop climbing through the windows. Every unofficial copy of your data started as a missing door.</text>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 15</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
