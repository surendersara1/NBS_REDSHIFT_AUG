<div id="slide">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 26</text>
<text x="90" y="168" class="title">S3 Is Not A Filesystem</text>
<text x="90" y="212" class="sub">It is a key-value store of objects. Almost every data-lake mistake starts with forgetting that the folders are not real.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">There are no directories &#8212; only very long keys with slashes in them</text>
<text x="118" y="392" class="code" style="font-size:19px">raw/xstore/sales_line/dt=2026-08-11/part-0000.parquet   &#8592; one flat key, not four folders</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR CONSEQUENCES OF THAT ONE FACT</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">OBJECTS ARE WHOLE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">replace, never edit</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">You cannot change one row in an object. You rewrite the object. That is why Lesson 28 exists.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">PARTITIONS ARE PREFIXES</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">dt=2026-08-11</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">A convention the engine understands. Filter on the partition and it skips whole prefixes unread.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">FILE SIZE IS A DESIGN CHOICE</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">aim 128 MB &#8211; 1 GB</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Thousands of tiny files is the classic lake killer: all overhead, no throughput.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">LISTING IS EXPENSIVE</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">use the catalog</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Asking S3 &#8220;what is in here?&#8221; costs time and money. The catalog exists so you rarely have to.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">partitioning is the cheapest performance work you will do — and the hardest to change</text>

<!-- ══ ZONE 3 · RULES ══ -->
<text x="1270" y="462" class="zwhen">3 · RULES OF THUMB</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">Partition by what you filter on — date</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">Compact small files on a schedule</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">Write new, then swap — never in place</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NEVER</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Partition on something high-cardinality</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="code" style="font-size:16px;fill:#E8D5B0">raw/&lt;source&gt;/&lt;table&gt;/dt=YYYY-MM-DD/</text>
<text x="1298" y="790" class="bxs-s" style="font-size:18px;fill:#E8D5B0">One prefix shape for every source.</text>
<text x="1298" y="818" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Bucket policy denies unencrypted writes.</text>
<text x="1298" y="854" class="bxt-s" style="font-size:19px;fill:#FFB84D">the prefix is the contract</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Not a filing cabinet with drawers — one enormous room where every box has a very long label. The label is the only organisation there is.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 26</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
