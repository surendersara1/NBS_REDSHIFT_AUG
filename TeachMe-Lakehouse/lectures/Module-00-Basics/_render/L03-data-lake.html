<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 03</text>
<text x="90" y="168" class="title">The Data Lake</text>
<text x="90" y="212" class="sub">Schema on read. Land everything cheaply now and decide what it means later — then govern it, or it becomes a swamp.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">A lake trades trust for optionality</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Storage is cheap enough that keeping everything is finally affordable. What you buy is the right to ask a question you have not thought of yet.</text>

<rect x="1430" y="336" width="400" height="64" rx="12" fill="#12283F" stroke="#5AA9FF" stroke-width="3"/>
<text x="1456" y="376" class="bxt-s" style="font-size:20px;fill:#5AA9FF">AWS: S3 + Glue + Athena</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR PIECES — AND THE FOURTH IS THE ONE PEOPLE SKIP</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">OBJECT STORAGE</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">Amazon S3</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">S3 holds files at cents per GB per month, with eleven nines of durability and no capacity to plan.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">SCHEMA ON READ</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">nothing validates on arrival</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">The file lands as it is. Meaning is applied by whoever queries it — which is freedom, and a risk.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">CATALOG</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">AWS Glue Data Catalog</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">What turns a folder of files into a named table with columns that people can actually find.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">GOVERNANCE</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">AWS Lake Formation</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Decides who sees which table — and which columns inside it. Skip this and you have a swamp.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#5A3A2A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#FFB84D">no catalog + no owner = a swamp: the data is all there and nobody can use it</text>

<!-- ══ ZONE 3 · WHEN TO USE IT ══ -->
<text x="1270" y="462" class="zwhen">3 · WHEN TO USE IT</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">Raw data you must retain for years</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">Schemas you do not control — SaaS, logs</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">Data science on unmodelled data</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NOT FOR</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Numbers the CFO has to sign off</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">raw/ and bronze/ prefixes on S3.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Every file lands immutable, exactly once.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Nothing is ever edited in place.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">cheap to keep · cheap to re-read</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The garage: everything goes in as-is and it costs almost nothing. Without labels on the boxes you will never find any of it again.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 03</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
