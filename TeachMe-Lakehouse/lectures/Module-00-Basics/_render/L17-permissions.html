<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 17</text>
<text x="90" y="168" class="title">Who Is Actually Allowed</text>
<text x="90" y="212" class="sub">Two permission systems on one platform. Redshift governs its own tables; Lake Formation governs everything read through the catalog.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">If two systems can grant access to the same table, you must know which one wins</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">This is the single most common source of &#8220;it works for me but not for them&#8221; on a lakehouse. Learn where the boundary sits.</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR LAYERS, FROM THE DATABASE OUTWARDS</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">REDSHIFT ROLES</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">GRANT ... TO ROLE</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Users, groups and roles. GRANT on schemas and tables, plus row-level and column-level security.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">IAM AUTHENTICATION</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">IAM · Identity Center</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Federated login instead of database passwords. The identity decides what the session may do.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">LAKE FORMATION</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">catalog · database · table · column</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Grant once, and every engine reading through the catalog enforces it — Athena, Spark, Redshift.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">READER / WRITER SPLIT</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">the pattern that matters</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">The ETL role writes. The BI role reads reporting views. No human account holds both.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">Redshift-native tables -&gt; GRANT   ·   anything via the catalog -&gt; Lake Formation</text>

<!-- ══ ZONE 3 · WHEN TO USE IT ══ -->
<text x="1270" y="462" class="zwhen">3 · RULES OF THUMB</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">Grant to roles, never to individual users</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">Mask PII at the column, not in the report</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">Expose views to BI, never base tables</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NEVER</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Share one superuser between people or jobs</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Epsilon customer data is PII — mask it.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Column-level grants, not a filtered copy.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Every role is Terraform, never console.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">access is code, and it is reviewed</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Two sets of keys to one building: the office door and the filing cabinet. Knowing which lock you are holding is most of the job.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 17</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
