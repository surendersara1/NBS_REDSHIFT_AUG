<text x="90" y="168" class="title">Everything That Touches Redshift</text>
<text x="90" y="212" class="sub">Twenty-three ways in and out. Blue writes, green reads. Photograph this slide — you will come back to it all year.</text>

<text x="90" y="300" class="zhow">1 · THE PARTICIPATION MATRIX</text>

<!-- ══════════ LEFT · WRITES INTO REDSHIFT ══════════ -->
<rect x="90" y="316" width="855" height="574" rx="16" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:23px;fill:#5AA9FF">WRITES INTO REDSHIFT</text>
<text x="917" y="356" class="code-s" text-anchor="end" style="fill:#4E6472">11 paths in</text>
<line x1="118" y1="372" x2="917" y2="372" stroke="#2E4A66" stroke-width="2"/>

<text x="118" y="412" class="tdw">COPY</text>
<text x="430" y="412" class="td" style="font-size:18px">bulk load from S3, EMR, DynamoDB or a remote host</text>
<text x="118" y="456" class="tdw">INSERT · MERGE · CTAS</text>
<text x="430" y="456" class="td" style="font-size:18px">ordinary SQL, run inside the warehouse</text>
<text x="118" y="500" class="tdw">JDBC / ODBC</text>
<text x="430" y="500" class="td" style="font-size:18px">clients and Query Editor v2 — small volumes only</text>
<text x="118" y="544" class="tdw">Redshift Data API</text>
<text x="430" y="544" class="td" style="font-size:18px">HTTP/SDK, no held connection — built for Lambda</text>
<text x="118" y="588" class="tdw">Glue · Spark · EMR</text>
<text x="430" y="588" class="td" style="font-size:18px">the Redshift connector writes DataFrames straight in</text>
<text x="118" y="632" class="tdw">AWS DMS</text>
<text x="430" y="632" class="td" style="font-size:18px">Redshift as a target: full load, then ongoing CDC</text>
<text x="118" y="676" class="tdw">Amazon Data Firehose</text>
<text x="430" y="676" class="td" style="font-size:18px">stages to S3, then issues COPY for you</text>
<text x="118" y="720" class="tdw">Streaming ingestion</text>
<text x="430" y="720" class="td" style="font-size:18px">an MV on Kinesis or MSK — no S3 staging at all</text>
<text x="118" y="764" class="tdw">Zero-ETL integration</text>
<text x="430" y="764" class="td" style="font-size:18px">managed replication — no pipeline to build</text>
<text x="118" y="808" class="tdw">Datashare + allow-writes</text>
<text x="430" y="808" class="td" style="font-size:18px">a consumer INSERTs into the producer&#8217;s data</text>
<text x="118" y="852" class="tdw">Amazon AppFlow</text>
<text x="430" y="852" class="td" style="font-size:18px">scheduled SaaS objects landed as tables</text>

<!-- ══════════ RIGHT · READS ══════════ -->
<rect x="975" y="316" width="855" height="574" rx="16" fill="#0F1E17" stroke="#2A5A40" stroke-width="2.5"/>
<text x="1003" y="356" class="bxt-s" style="font-size:23px;fill:#3FD98A">READS FROM REDSHIFT</text>
<text x="1802" y="356" class="code-s" text-anchor="end" style="fill:#4E6472">8 paths out</text>
<line x1="1003" y1="372" x2="1802" y2="372" stroke="#2A5A40" stroke-width="2"/>

<text x="1003" y="408" class="tdr">JDBC / ODBC</text>
<text x="1315" y="408" class="td" style="font-size:18px">humans, ad-hoc SQL, Query Editor v2</text>
<text x="1003" y="446" class="tdr">Redshift Data API</text>
<text x="1315" y="446" class="td" style="font-size:18px">applications and Lambda, no driver</text>
<text x="1003" y="484" class="tdr">UNLOAD to S3</text>
<text x="1315" y="484" class="td" style="font-size:18px">publish gold back to the lake as Parquet</text>
<text x="1003" y="522" class="tdr">Glue · Spark · EMR</text>
<text x="1315" y="522" class="td" style="font-size:18px">read frames out for ETL and ML</text>
<text x="1003" y="560" class="tdr">Athena connector</text>
<text x="1315" y="560" class="td" style="font-size:18px">Athena queries Redshift tables</text>
<text x="1003" y="598" class="tdr">Glue federated catalog</text>
<text x="1315" y="598" class="td" style="font-size:18px">catalog engines read it, governed by LF</text>
<text x="1003" y="636" class="tdr">Power BI · QuickSight</text>
<text x="1315" y="636" class="td" style="font-size:18px">the consumption layer</text>
<text x="1003" y="674" class="tdr">Redshift ML · SageMaker</text>
<text x="1315" y="674" class="td" style="font-size:18px">training reads, inference writes back</text>

<line x1="1003" y1="700" x2="1802" y2="700" stroke="#2A5A40" stroke-width="2"/>
<text x="1003" y="734" class="bxt-s" style="font-size:20px;fill:#FFB84D">REDSHIFT AS A CLIENT &#8212; IT READS OTHER SYSTEMS TOO</text>

<text x="1003" y="774" class="tdk" style="fill:#E8D5B0">Spectrum</text>
<text x="1315" y="774" class="td" style="font-size:18px;fill:#C6B48F">S3 external tables, through the catalog</text>
<text x="1003" y="812" class="tdk" style="fill:#E8D5B0">Federated query</text>
<text x="1315" y="812" class="td" style="font-size:18px;fill:#C6B48F">live RDS / Aurora PostgreSQL or MySQL</text>
<text x="1003" y="850" class="tdk" style="fill:#E8D5B0">Datashare · Lambda UDF</text>
<text x="1315" y="850" class="td" style="font-size:18px;fill:#C6B48F">another warehouse · a function mid-query</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Redshift is not a locked box with one door. It is a building with eleven loading bays, eight exits — and windows it can see out of.</text>
