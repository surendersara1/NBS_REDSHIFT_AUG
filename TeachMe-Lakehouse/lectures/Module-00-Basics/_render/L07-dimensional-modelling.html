<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<div id="slide">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 07</text>
<text x="90" y="168" class="title">Facts, Dimensions and Grain</text>
<text x="90" y="212" class="sub">The one modelling skill that transfers to every warehouse you will ever touch. It starts with a sentence, not a diagram.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">A star schema: one fact table, surrounded by the dimensions you slice it by</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Facts are what happened, and they are measured. Dimensions are the context. Almost every retail reporting model is this shape.</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">SAY THE GRAIN OUT LOUD BEFORE YOU WRITE ANY DDL</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#E3000E"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#FF3B47">GRAIN</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">decide this first</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">&#8220;One row = one line on one receipt.&#8221; Every other decision follows from that sentence.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">FACT TABLE</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">fct_sales_line</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Long and narrow: numbers you can add up, plus keys to the dimensions. Grows forever.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#3FD98A">DIMENSION</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">dim_store · dim_product</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Short and wide: the attributes you filter and group by. Changes slowly — hence Lesson 08.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FFB84D">MEASURES</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">not all numbers add up</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Additive sums anywhere · semi-additive not over time (stock) · non-additive never (ratios).</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">star = 1 fact + many dims  ·  snowflake = dims normalised further  ·  prefer star</text>

<!-- ══ ZONE 3 · WHEN TO USE IT ══ -->
<text x="1270" y="462" class="zwhen">3 · WHEN TO USE IT</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">Any reporting model, on any warehouse</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">When business users write their own SQL</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">When one measure is sliced many ways</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NOT FOR</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Machine-learning feature tables</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Gold layer only. Bronze and silver keep</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">the source shape, unmodelled.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">One conformed dim_date across all facts.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">grain first · columns second</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The fact table is the receipt. The dimensions are the shop, the till, the product and the day. You count receipts and slice by the rest.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 07</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
