<div id="slide">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 27</text>
<text x="90" y="168" class="title">Hot Data, Cold Data</text>
<text x="90" y="212" class="sub">Storage classes look like a discount menu. They are really a bet about how often you will read the data again.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Cheaper to store always means more expensive, or slower, to read</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">There is no free tier change. Every step down the ladder moves cost from the monthly bill onto whoever runs the next query.</text>

<!-- ══ ZONE 2 · THE LADDER ══ -->
<text x="90" y="462" class="zhow">2 · THE LADDER</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="514" class="th">CLASS</text>
<text x="500" y="514" class="th">RETRIEVAL</text>
<text x="740" y="514" class="th">USE IT FOR</text>
<line x1="118" y1="530" x2="1182" y2="530" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="544" width="5" height="34" rx="2.5" fill="#FF3B47"/>
<text x="136" y="568" class="bxt-s" style="font-size:20px;fill:#FF3B47">S3 STANDARD</text>
<text x="500" y="568" class="td" style="font-size:18px">instant · free</text>
<text x="740" y="568" class="td" style="font-size:18px">everything you query this quarter</text>

<rect x="118" y="596" width="5" height="34" rx="2.5" fill="#FFB84D"/>
<text x="136" y="620" class="bxt-s" style="font-size:20px;fill:#FFB84D">STANDARD-IA</text>
<text x="500" y="620" class="td" style="font-size:18px">instant · charged</text>
<text x="740" y="620" class="td" style="font-size:18px">read a few times a year</text>

<rect x="118" y="648" width="5" height="34" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="672" class="bxt-s" style="font-size:20px;fill:#5AA9FF">GLACIER INSTANT RETRIEVAL</text>
<text x="500" y="672" class="td" style="font-size:18px">instant · charged</text>
<text x="740" y="672" class="td" style="font-size:18px">archive you must still query</text>

<rect x="118" y="700" width="5" height="34" rx="2.5" fill="#3FD98A"/>
<text x="136" y="724" class="bxt-s" style="font-size:20px;fill:#3FD98A">GLACIER FLEXIBLE</text>
<text x="500" y="724" class="td" style="font-size:18px">minutes to hours</text>
<text x="740" y="724" class="td" style="font-size:18px">true archive, occasional restore</text>

<rect x="118" y="752" width="5" height="34" rx="2.5" fill="#8296A3"/>
<text x="136" y="776" class="bxt-s" style="font-size:20px;fill:#8296A3">DEEP ARCHIVE</text>
<text x="500" y="776" class="td" style="font-size:18px">up to 12 hours</text>
<text x="740" y="776" class="td" style="font-size:18px">regulatory retention only</text>

<rect x="118" y="804" width="1064" height="64" rx="10" fill="#0B1013" stroke="#5A3A2A" stroke-width="2"/>
<text x="138" y="830" class="bxt-s" style="font-size:19px;fill:#FFB84D">THE MISTAKE EVERYONE MAKES</text>
<text x="138" y="856" class="bxs-s" style="font-size:18px;fill:#D9C09A">Archiving data you still query is a cost <tspan style="fill:#FFFFFF">increase</tspan>, not a saving. Retrieval is billed too.</text>

<!-- ══ ZONE 3 · THE TRAPS ══ -->
<text x="1270" y="462" class="zwhen">3 · THE FINE PRINT</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">Retrieval is charged separately, per GB</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">Minimum storage durations apply</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">Restores are not instant below IR</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NEVER</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Archive a partition a dashboard still reads</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · A REAL RETENTION DESIGN</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="758" class="bxs-s" style="font-size:18px;fill:#E8D5B0">0&#8211;90 days &#8594; Standard</text>
<text x="1298" y="786" class="bxs-s" style="font-size:18px;fill:#E8D5B0">90 days &#8594; Standard-IA</text>
<text x="1298" y="814" class="bxs-s" style="font-size:18px;fill:#E8D5B0">1 year &#8594; Glacier Instant Retrieval</text>
<text x="1298" y="842" class="bxs-s" style="font-size:18px;fill:#E8D5B0">7 years &#8594; expire</text>
<text x="1298" y="874" class="bxt-s" style="font-size:19px;fill:#FFB84D">lifecycle rules, not a person</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Off-site storage is cheap right up until you need the box back. Cheap to keep, expensive to fetch — so only send what you will not fetch.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 27</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
