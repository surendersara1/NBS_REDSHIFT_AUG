<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 18</text>
<text x="90" y="168" class="title">Copy It, Or Point At It?</text>
<text x="90" y="212" class="sub">One question, four answers, four different bills. Decide this per table — not once for the whole platform.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 ══ -->
<text x="90" y="300" class="zwhat">1 · THE QUESTION</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Does this table earn its storage — or is it cheaper to fetch it when someone asks?</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Copying costs storage once and query time never. Pointing costs storage never and query time every single time.</text>

<!-- ══ ZONE 2 · FOUR ANSWERS ══ -->
<text x="90" y="462" class="zhow">2 · THE SAME TABLE, FOUR WAYS</text>

<!-- card 1 LOAD IT -->
<rect x="90" y="478" width="420" height="346" rx="16" fill="#231114" stroke="#E3000E" stroke-width="3.5"/>
<text x="118" y="518" class="bxt-s" style="font-size:22px">LOAD IT</text>
<line x1="118" y1="536" x2="482" y2="536" stroke="#6A2A30" stroke-width="2"/>
<text x="118" y="570" class="bxs-s" style="font-size:17px;fill:#E5B8BC">Data lives inside Redshift</text>
<text x="118" y="600" class="bxs-s" style="font-size:17px;fill:#E5B8BC">Fastest joins, full SQL, sort keys</text>
<text x="118" y="630" class="bxs-s" style="font-size:17px;fill:#E5B8BC">You store the bytes twice</text>
<text x="118" y="660" class="bxs-s" style="font-size:17px;fill:#E5B8BC">As fresh as the last load</text>
<line x1="118" y1="686" x2="482" y2="686" stroke="#6A2A30" stroke-width="2"/>
<text x="118" y="716" class="th" style="fill:#C08A90">YOU PAY FOR</text>
<text x="118" y="746" class="code" style="font-size:17px;fill:#FF8A92">storage + the load job</text>
<text x="118" y="790" class="bxt-s" style="font-size:18px;fill:#FF3B47">GOLD FACTS &amp; DIMS</text>

<!-- card 2 SPECTRUM -->
<rect x="530" y="478" width="420" height="346" rx="16" fill="#0F1E17" stroke="#2A5A40" stroke-width="2.5"/>
<text x="558" y="518" class="bxt-s" style="font-size:22px;fill:#3FD98A">POINT AT S3</text>
<line x1="558" y1="536" x2="922" y2="536" stroke="#2A5A40" stroke-width="2"/>
<text x="558" y="570" class="bxs-s" style="font-size:17px">Data stays in the lake</text>
<text x="558" y="600" class="bxs-s" style="font-size:17px">No second copy, no load job</text>
<text x="558" y="630" class="bxs-s" style="font-size:17px">Slower joins; you scan every time</text>
<text x="558" y="660" class="bxs-s" style="font-size:17px">As fresh as whatever wrote the files</text>
<line x1="558" y1="686" x2="922" y2="686" stroke="#2A5A40" stroke-width="2"/>
<text x="558" y="716" class="th">YOU PAY FOR</text>
<text x="558" y="746" class="code" style="font-size:17px">bytes scanned per query</text>
<text x="558" y="790" class="bxt-s" style="font-size:18px;fill:#3FD98A">COLD HISTORY</text>

<!-- card 3 FEDERATED -->
<rect x="970" y="478" width="420" height="346" rx="16" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>
<text x="998" y="518" class="bxt-s" style="font-size:22px;fill:#5AA9FF">POINT AT THE OLTP DB</text>
<line x1="998" y1="536" x2="1362" y2="536" stroke="#2E4A66" stroke-width="2"/>
<text x="998" y="570" class="bxs-s" style="font-size:17px">Data stays in the live database</text>
<text x="998" y="600" class="bxs-s" style="font-size:17px">Always current — zero lag</text>
<text x="998" y="630" class="bxs-s" style="font-size:17px">Puts analytical load on production</text>
<text x="998" y="660" class="bxs-s" style="font-size:17px">Filters push down; big scans do not</text>
<line x1="998" y1="686" x2="1362" y2="686" stroke="#2E4A66" stroke-width="2"/>
<text x="998" y="716" class="th">YOU PAY FOR</text>
<text x="998" y="746" class="code" style="font-size:17px;fill:#8CC4E8">load on the source system</text>
<text x="998" y="790" class="bxt-s" style="font-size:18px;fill:#5AA9FF">SMALL LIVE LOOKUPS</text>

<!-- card 4 DATASHARE -->
<rect x="1410" y="478" width="420" height="346" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1438" y="518" class="bxt-s" style="font-size:22px;fill:#FFB84D">SHARE IT</text>
<line x1="1438" y1="536" x2="1802" y2="536" stroke="#8A6A3A" stroke-width="2"/>
<text x="1438" y="570" class="bxs-s" style="font-size:17px;fill:#E8D5B0">Data stays in another warehouse</text>
<text x="1438" y="600" class="bxs-s" style="font-size:17px;fill:#E8D5B0">Live, no copy, across accounts</text>
<text x="1438" y="630" class="bxs-s" style="font-size:17px;fill:#E8D5B0">Both sides must be Redshift</text>
<text x="1438" y="660" class="bxs-s" style="font-size:17px;fill:#E8D5B0">Writes possible with allow-writes</text>
<line x1="1438" y1="686" x2="1802" y2="686" stroke="#8A6A3A" stroke-width="2"/>
<text x="1438" y="716" class="th" style="fill:#B99A6A">YOU PAY FOR</text>
<text x="1438" y="746" class="code" style="font-size:17px;fill:#FFB84D">the consumer&#8217;s compute</text>
<text x="1438" y="790" class="bxt-s" style="font-size:18px;fill:#FFB84D">ANOTHER TEAM&#8217;S DATA</text>

<!-- ══ VERDICT ══ -->
<rect x="90" y="840" width="1740" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="118" y="876" class="bxs-s" style="font-size:20px;fill:#8CE8B8">Copy what you join hard and often. Point at what you scan rarely. <tspan style="fill:#FF8A92">Never point at production for a report that runs every hour.</tspan></text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Buy the book you read weekly. Borrow the one you open twice a year. Do not borrow it from a colleague who is still using it.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 18</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
