<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 11</text>
<text x="90" y="168" class="title">Getting Rows In, Correctly</text>
<text x="90" y="212" class="sub">Row-by-row INSERT is how you turn a warehouse into a very expensive slow database. Four patterns do it properly.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">A warehouse wants whole batches, not individual rows</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Columnar storage rewrites blocks on every write. One INSERT of a million rows is cheap; a million INSERTs of one row is not.</text>

<rect x="1420" y="336" width="410" height="64" rx="12" fill="#231519" stroke="#7A3A40" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="1446" y="376" class="bxt-s" style="font-size:19px;fill:#FF6B73">never INSERT row by row</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">THE FOUR-STEP LOAD THAT YOU CAN SAFELY RE-RUN</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">COPY</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">COPY ... FROM 's3://...'</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">The bulk path: many files read in parallel, one per slice. Orders of magnitude faster than INSERT.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">STAGE FIRST</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">stg_ tables</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Land into a staging table, validate it there, then move. Never write half a load into a live table.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">MERGE</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">MERGE INTO ... ON key</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Insert-or-update on a key in one statement. This is what makes a load safe to run twice.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">ONE TRANSACTION</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">BEGIN ... COMMIT</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Wrap staging into target so a reader never sees the table half-loaded. All of it, or none of it.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">re-running yesterday must produce exactly yesterday's table — that is idempotency</text>

<!-- ══ ZONE 3 · WHEN TO USE IT ══ -->
<text x="1270" y="462" class="zwhen">3 · RULES OF THUMB</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">COPY for bulk · MERGE for upsert</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">Always stage, then merge or swap</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">One transaction per load, not per row</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NEVER</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">Point an application at it as an OLTP store</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">dbt incremental models emit the MERGE.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">unique_key is the merge key.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Re-running a day is safe, and expected.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">idempotent, or it is not done</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Unload the whole lorry at the bay, check it, then move it to the shelves. Do not carry items in one at a time through the front door.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 11</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
