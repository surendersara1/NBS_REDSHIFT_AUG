<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 22</text>
<text x="90" y="168" class="title">Change Data Capture</text>
<text x="90" y="212" class="sub">Reading the database&#8217;s own transaction log instead of asking its tables what changed. That difference is the whole point.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">A watermark pull asks &#8220;what changed since?&#8221; &#8212; CDC is told, by the database itself</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Every relational database already writes a log of every change so it can recover. CDC reads that log instead of querying your tables.</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">FOUR THINGS TO UNDERSTAND BEFORE YOU CHOOSE IT</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">READ THE LOG</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">redo · WAL · binlog</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">DMS reads the engine&#8217;s change log, so it adds almost no query load to the source system.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">FULL LOAD, THEN CDC</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">one task, two phases</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">One task copies the table, notes the log position, then streams every change from there on.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">IT CATCHES DELETES</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">the usual deciding factor</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Hard deletes and out-of-order updates that a timestamp-based pull silently misses forever.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">SCHEMA DRIFT</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">decide the policy first</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">A new column upstream should be a decision you make, not a surprise you discover at 6am.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">if the source hard-deletes rows, a watermark pull will be wrong and never tell you</text>

<!-- ══ ZONE 3 · WHEN TO USE IT ══ -->
<text x="1270" y="462" class="zwhen">3 · WHEN TO USE IT</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px">Continuous replication at low latency</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px">Sources that hard-delete rows</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px">A different engine at each end</text>
<line x1="1298" y1="592" x2="1802" y2="592" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="622" class="bxt-s" style="font-size:18px;fill:#FF6B73">NOT FOR</text>
<text x="1298" y="654" class="bxs-s" style="font-size:18px;fill:#C69AA0">When you must transform data on the way</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Module 2 teaches watermarked batch pulls.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">CDC is the alternative. Know both well.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Deletes usually force the decision.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">ask about deletes on day one</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Do not walk the shelves every night counting what moved. Read the till roll — it already lists every single thing that happened.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 22</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
