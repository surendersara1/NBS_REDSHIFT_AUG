<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 34</text>
<text x="90" y="168" class="title">The Cost And Latency Ladder</text>
<text x="90" y="212" class="sub">Everything in this module on two axes. Where a thing sits on the ladder tells you exactly what having it will cost you.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Freshness is bought, and it is never bought once</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Every step up this ladder is a recurring cost someone pays forever. Buy the freshness a decision actually needs, and not one rung more.</text>

<!-- ══ ZONE 2 · THE LADDER ══ -->
<text x="90" y="462" class="zhow">2 · THE LADDER</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="514" class="th">MECHANISM</text>
<text x="520" y="514" class="th">FRESHNESS</text>
<text x="740" y="514" class="th">WHAT YOU PAY, FOREVER</text>
<line x1="118" y1="530" x2="1182" y2="530" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="544" width="5" height="34" rx="2.5" fill="#3FD98A"/>
<text x="136" y="568" class="bxt-s" style="font-size:20px;fill:#3FD98A">NIGHTLY BATCH</text>
<text x="520" y="568" class="td" style="font-size:18px">yesterday</text>
<text x="740" y="568" class="td" style="font-size:18px">cheapest per row, most control</text>

<rect x="118" y="596" width="5" height="34" rx="2.5" fill="#3FD98A"/>
<text x="136" y="620" class="bxt-s" style="font-size:20px;fill:#3FD98A">HOURLY BATCH</text>
<text x="520" y="620" class="td" style="font-size:18px">within the hour</text>
<text x="740" y="620" class="td" style="font-size:18px">same shape, 24&#215; the compute runs</text>

<rect x="118" y="648" width="5" height="34" rx="2.5" fill="#FFB84D"/>
<text x="136" y="672" class="bxt-s" style="font-size:20px;fill:#FFB84D">ZERO-ETL &#183; CDC</text>
<text x="520" y="672" class="td" style="font-size:18px">minutes</text>
<text x="740" y="672" class="td" style="font-size:18px">no pipeline to run &#8212; and no transform</text>

<rect x="118" y="700" width="5" height="34" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="724" class="bxt-s" style="font-size:20px;fill:#5AA9FF">FEDERATED QUERY</text>
<text x="520" y="724" class="td" style="font-size:18px">live</text>
<text x="740" y="724" class="td" style="font-size:18px">the source system, on every query</text>

<rect x="118" y="752" width="5" height="34" rx="2.5" fill="#FF6B73"/>
<text x="136" y="776" class="bxt-s" style="font-size:20px;fill:#FF6B73">STREAMING</text>
<text x="520" y="776" class="td" style="font-size:18px">seconds</text>
<text x="740" y="776" class="td" style="font-size:18px">always-on cost, even at 3am on Sunday</text>

<rect x="118" y="804" width="1064" height="64" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="830" class="bxt-s" style="font-size:19px;fill:#8CE8B8">AND THE ONE THAT GOES SIDEWAYS</text>
<text x="138" y="856" class="bxs-s" style="font-size:18px;fill:#A9E8C4">A materialized view buys read speed for storage plus a refresh &#8212; not for freshness.</text>

<!-- ══ ZONE 3 · THE FIVE QUESTIONS ══ -->
<text x="1270" y="462" class="zwhen">3 · ASK THESE FIVE, EVERY TIME</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">1.</tspan>  Who reads this, and how often?</text>
<text x="1298" y="546" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">2.</tspan>  How fresh does it truly need to be?</text>
<text x="1298" y="580" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">3.</tspan>  Must I transform it on the way?</text>
<text x="1298" y="614" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">4.</tspan>  Who pays when someone queries it?</text>
<text x="1298" y="648" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">5.</tspan>  What happens the day it breaks?</text>

<!-- ══ ZONE 4 · WHERE YOU GO NEXT ══ -->
<text x="1270" y="710" class="zprac">4 · WHERE YOU GO NEXT</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Module 1 &#8212; how our platform is built.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Module 2 &#8212; how to build the next one.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Every choice there is one of these.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">you now know the vocabulary</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Next-day delivery is cheap. Same-hour costs more. Live courier costs most of all — and nobody upgrades the postage on a birthday card.</text>
