<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 30</text>
<text x="90" y="168" class="title">Athena Also Writes</text>
<text x="90" y="212" class="sub">Serverless SQL over the catalog, priced per terabyte scanned. &#8220;Athena is read-only&#8221; is the most common wrong belief in this whole stack.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">No cluster to start, no capacity to size &#8212; and a real ETL tool, not just a query box</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">You pay per byte scanned. That single pricing fact is why partitioning and Parquet are cost controls, not just performance tuning.</text>

<!-- ══ ZONE 2 · HOW IT WORKS ══ -->
<text x="90" y="462" class="zhow">2 · HOW IT WORKS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">IT READS EVERYTHING IN THE CATALOG &#8212; AND WRITES TOO</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">READS</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">the shared catalog</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">S3 files, Iceberg tables, and through connectors Redshift, DynamoDB, Snowflake and more.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">CTAS</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">CREATE TABLE AS SELECT</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Writes a whole new table and its files. This is how people build lake tables without Spark.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#5AA9FF">INSERT INTO &#183; ICEBERG DML</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">UPDATE · DELETE · MERGE</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Appends to an existing table. On Iceberg you also get row-level DML and time travel.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#FF6B73"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px;fill:#FF6B73">THE WRITE LIMITS</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">know these before you design</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">100 partitions per CTAS or INSERT statement.</tspan> Not supported for bucketed tables.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">priced per TB scanned — partitioning and Parquet are how you control the bill</text>

<!-- ══ ZONE 3 · CONNECTOR TYPES ══ -->
<text x="1270" y="462" class="zwhen">3 · TWO CONNECTOR TYPES</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="510" class="bxt-s" style="font-size:18px;fill:#FF6B73">ATHENA DATA CATALOG CONNECTOR</text>
<text x="1298" y="538" class="bxs-s" style="font-size:18px;fill:#C69AA0">A Lambda in your account. Cannot register as a</text>
<text x="1298" y="562" class="bxs-s" style="font-size:18px;fill:#C69AA0">federated catalog &#8212; so no Lake Formation control.</text>
<line x1="1298" y1="582" x2="1802" y2="582" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="614" class="bxt-s" style="font-size:18px;fill:#3FD98A">GLUE DATA CATALOG CONNECTOR</text>
<text x="1298" y="642" class="bxs-s" style="font-size:18px;fill:#A9E8C4">Uses a Glue connection, registers as a federated</text>
<text x="1298" y="666" class="bxs-s" style="font-size:18px;fill:#A9E8C4">catalog, and does support fine-grained control.</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Athena is how you inspect the lake by hand.</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Workgroups cap bytes scanned per query.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Same catalog as Glue, Redshift and EMR.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">prefer the Glue-connection type</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A meter on the tap, not a monthly rental. You pay for what you draw — so a badly shaped question is expensive, not just slow.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 30</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
