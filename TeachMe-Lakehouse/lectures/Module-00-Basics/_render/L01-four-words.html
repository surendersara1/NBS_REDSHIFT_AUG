<div id="slide">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 01</text>
<text x="90" y="168" class="title">Four Words For Where Data Lives</text>
<text x="90" y="212" class="sub">Warehouse, lake, lakehouse, mesh. Vendors blur them deliberately. Four questions tell them apart for good.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · WHAT IT IS ══ -->
<text x="90" y="300" class="zwhat">1 · WHAT IT IS</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">They are four answers to the same question, not four stages of maturity</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">You can run more than one at a time. Most companies do. The words only become useful once you know what separates them.</text>

<!-- ══ ZONE 2 · HOW TO TELL THEM APART ══ -->
<text x="90" y="462" class="zhow">2 · HOW TO TELL THEM APART</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">ASK THESE FOUR QUESTIONS, IN THIS ORDER</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#5AA9FF">SCHEMA</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">on write / on read</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">Who decides the shape, and <tspan style="fill:#FFFFFF">when</tspan> — before the data lands, or when someone reads it?</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#3FD98A">ACCESS</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">who is allowed</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Who can read it, and at what grain — whole tables, or single columns and rows?</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">COST</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">per hour / per TB scanned</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">What does one query cost, and who pays — the cluster owner, or the person asking?</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">OWNERSHIP</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">central / federated</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">Who owns it — one central data team, or the domain that produced the data?</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">answer all four and the word picks itself — you never argue about the label again</text>

<!-- ══ ZONE 3 · THE SHORT ANSWER ══ -->
<text x="1270" y="462" class="zwhen">3 · THE SHORT ANSWER</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="512" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">Warehouse</tspan> — modelled, trusted, costly</text>
<text x="1298" y="542" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">Lake</tspan> — cheap, raw, needs governing</text>
<text x="1298" y="572" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">Lakehouse</tspan> — one store, both behaviours</text>
<text x="1298" y="602" class="bxs-s" style="font-size:18px"><tspan style="fill:#FFFFFF">Mesh</tspan> — an ownership model, not a store</text>
<line x1="1298" y1="622" x2="1802" y2="622" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="656" class="bxt-s" style="font-size:19px;fill:#3FD98A">THREE ARE PLACES · ONE IS A RULE</text>

<!-- ══ ZONE 4 · IN PRACTICE ══ -->
<text x="1270" y="710" class="zprac">4 · IN PRACTICE</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Tamimi and Apparel Group are both</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">lakehouses: S3 + Iceberg + Redshift.</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Neither is a mesh, and neither needs to be.</text>
<text x="1298" y="852" class="bxt-s" style="font-size:19px;fill:#FFB84D">Lesson 04 is the one that matters</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A shop floor, a garage, a garage someone fitted shelves into — and a rule about who holds the keys to each room.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 01</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
</svg></div></body></html>
