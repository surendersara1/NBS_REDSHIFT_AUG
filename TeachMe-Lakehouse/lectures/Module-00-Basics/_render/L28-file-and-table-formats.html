<text x="90" y="104" class="eyebrow">MODULE 0 · LESSON 28</text>
<text x="90" y="168" class="title">Two Different Things Called &#8220;Format&#8221;</text>
<text x="90" y="212" class="sub">Parquet is a <tspan style="fill:#FFFFFF">file</tspan> format. Iceberg is a <tspan style="fill:#FFFFFF">table</tspan> format. They stack on top of each other, and people conflate them constantly.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zhow">1 · ONE SITS ON TOP OF THE OTHER</text>

<!-- ══════════ LEFT · FILE FORMATS ══════════ -->
<rect x="90" y="316" width="855" height="574" rx="16" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>
<text x="118" y="358" class="bxt-s" style="font-size:23px;fill:#5AA9FF">FILE FORMATS</text>
<text x="917" y="358" class="code-s" text-anchor="end" style="fill:#4E6472">what one file looks like</text>
<line x1="118" y1="376" x2="917" y2="376" stroke="#2E4A66" stroke-width="2"/>

<text x="118" y="416" class="tdk">CSV &#183; JSON</text>
<text x="118" y="446" class="td" style="font-size:18px">Readable, untyped, uncompressed. Fine for landing,</text>
<text x="118" y="472" class="td" style="font-size:18px">never for anything you query repeatedly.</text>
<line x1="118" y1="492" x2="917" y2="492" stroke="#1E2830" stroke-width="1.5"/>

<text x="118" y="530" class="tdk" style="fill:#5AA9FF">PARQUET</text>
<text x="118" y="560" class="td" style="font-size:18px">Columnar, typed, compressed. The default for the lake:</text>
<text x="118" y="586" class="td" style="font-size:18px">it can cut bytes scanned by 10&#8211;100&#215;.</text>
<line x1="118" y1="606" x2="917" y2="606" stroke="#1E2830" stroke-width="1.5"/>

<text x="118" y="644" class="tdk">ORC</text>
<text x="118" y="674" class="td" style="font-size:18px">Also columnar, common in Hive estates.</text>
<text x="118" y="700" class="td" style="font-size:18px">Parquet is the AWS default; both work.</text>
<line x1="118" y1="720" x2="917" y2="720" stroke="#1E2830" stroke-width="1.5"/>

<text x="118" y="758" class="tdk">AVRO</text>
<text x="118" y="788" class="td" style="font-size:18px">Row-based with an embedded schema. Good for</text>
<text x="118" y="814" class="td" style="font-size:18px">streaming records, poor for analytical scans.</text>

<rect x="118" y="834" width="799" height="42" rx="8" fill="#0B1013" stroke="#2E4A66" stroke-width="2"/>
<text x="138" y="861" class="code" xml:space="preserve" style="fill:#8CC4E8">columnar + compressed = the biggest cost lever</text>

<!-- ══════════ RIGHT · TABLE FORMATS ══════════ -->
<rect x="975" y="316" width="855" height="574" rx="16" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<text x="1003" y="358" class="bxt-s" style="font-size:23px;fill:#FF3B47">TABLE FORMATS</text>
<text x="1802" y="358" class="code-s" text-anchor="end" style="fill:#C08A90">what a set of files means</text>
<line x1="1003" y1="376" x2="1802" y2="376" stroke="#6A2A30" stroke-width="2"/>

<text x="1003" y="416" class="tdk">WHAT THEY ADD</text>
<text x="1003" y="446" class="td" style="font-size:18px;fill:#E5B8BC">ACID commits &#183; schema evolution &#183; row-level</text>
<text x="1003" y="472" class="td" style="font-size:18px;fill:#E5B8BC">UPDATE and DELETE &#183; time travel &#183; safe concurrency</text>
<line x1="1003" y1="492" x2="1802" y2="492" stroke="#4A1E24" stroke-width="1.5"/>

<text x="1003" y="530" class="tdk" style="fill:#FF3B47">APACHE ICEBERG</text>
<text x="1003" y="560" class="td" style="font-size:18px;fill:#E5B8BC">The AWS default. S3 Tables is managed Iceberg.</text>
<text x="1003" y="586" class="td" style="font-size:18px;fill:#E5B8BC">v2 adds delete files for row-level changes.</text>
<line x1="1003" y1="606" x2="1802" y2="606" stroke="#4A1E24" stroke-width="1.5"/>

<text x="1003" y="644" class="tdk">APACHE HUDI</text>
<text x="1003" y="674" class="td" style="font-size:18px;fill:#E5B8BC">Copy-on-Write and Merge-on-Read variants.</text>
<text x="1003" y="700" class="td" style="font-size:18px;fill:#E5B8BC">Strong on high-frequency streaming upserts.</text>
<line x1="1003" y1="720" x2="1802" y2="720" stroke="#4A1E24" stroke-width="1.5"/>

<text x="1003" y="758" class="tdk">DELTA LAKE</text>
<text x="1003" y="788" class="td" style="font-size:18px;fill:#E5B8BC">Databricks&#8217; format. Redshift Spectrum reads it</text>
<text x="1003" y="814" class="td" style="font-size:18px;fill:#E5B8BC">through symlink manifest tables.</text>

<rect x="1003" y="834" width="799" height="42" rx="8" fill="#0B1013" stroke="#4A1E24" stroke-width="2"/>
<text x="1023" y="861" class="code" xml:space="preserve" style="fill:#FF8A92">metadata about which files are in the table now</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Parquet is how one page is printed. Iceberg is the index at the front saying which pages are currently part of the book.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 0 · Lesson 28</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Foundations for Data Engineers</text>
