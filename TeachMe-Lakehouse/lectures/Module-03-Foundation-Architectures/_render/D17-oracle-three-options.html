<text x="90" y="168" class="title">Oracle — Three Ways In</text>
<text x="90" y="212" class="sub">Three of the eight sources are Oracle. This is a real decision with real arguments, and it is worth a spike before committing.</text>

<text x="1298" y="736" class="icd" style="font-size:17px;fill:#E8D5B0">one source, measured, before we commit</text>

<rect x="90" y="790" width="1740" height="100" rx="14" fill="#0B1013" stroke="#2A4A3A" stroke-width="2.5"/>
<text x="118" y="820" class="icb" style="fill:#8CE8B8">DECIDE PER SOURCE, NOT ONCE FOR THE PLATFORM</text>
<line x1="118" y1="834" x2="1802" y2="834" stroke="#1E3830" stroke-width="2"/>
<text x="118" y="868" class="bxs-s" style="font-size:18px;fill:#A9E8C4">XStore&#8217;s volume argues for Glue. A small, slow-changing reference table argues for zero-ETL &#8212; or for not ingesting it at all and mounting it as a federated catalog (D06).</text>

<!-- PLAIN ENGLISH -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>

<text x="122" y="982" class="plain">Own a van, hire a courier, or have it delivered. The right answer depends on the parcel &#8212; and you are shipping three very different parcels.</text>
