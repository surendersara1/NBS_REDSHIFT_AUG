<text x="90" y="104" class="eyebrow">MODULE 3 · ARCHITECTURE 12 · AS BUILT</text>
<text x="90" y="168" class="title">Catalog And Storage Layers</text>
<text x="90" y="212" class="sub">Five layers between a SQL statement and a byte on disk. Knowing which layer you are debugging is most of the job.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zhow">1 · TOP TO BOTTOM</text>

<!-- L1 ENGINES -->
<rect x="90" y="316" width="1200" height="100" rx="12" fill="#0F1E17" stroke="#2A5A40" stroke-width="2.5"/>
<image href="../../_icons/aws/analytics/redshift.png" x="118" y="338" width="56" height="56"/>
<text x="196" y="362" class="icn" style="font-size:20px">Redshift &#183; Athena &#183; Glue &#183; EMR</text>
<text x="196" y="390" class="icd" style="font-size:17px">the engines &#8212; they all speak the same catalog, so a table means one thing</text>
<line x1="670" y1="424" x2="670" y2="440" stroke="#8296A3" stroke-width="3" marker-end="url(#aw)"/>

<!-- L2 EXTERNAL SCHEMA -->
<rect x="90" y="448" width="1200" height="100" rx="12" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>
<image href="../../_icons/aws/analytics/glue-data-catalog.png" x="118" y="470" width="56" height="56"/>
<text x="196" y="494" class="icn" style="font-size:20px">External schema &#8212; the pointer</text>
<text x="196" y="522" class="code" style="font-size:17px">CREATE EXTERNAL SCHEMA ... FROM DATA CATALOG</text>
<line x1="670" y1="556" x2="670" y2="572" stroke="#8296A3" stroke-width="3" marker-end="url(#aw)"/>

<!-- L3 FEDERATED CATALOG -->
<rect x="90" y="580" width="1200" height="100" rx="12" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<image href="../../_icons/aws/analytics/lake-formation.png" x="118" y="602" width="56" height="56"/>
<text x="196" y="626" class="icn" style="font-size:20px">Federated Glue Catalog + Lake Formation</text>
<text x="196" y="654" class="code" style="font-size:17px;fill:#FF8A92">s3tablescatalog / &lt;bucket&gt; / &lt;namespace&gt; / &lt;table&gt;</text>
<line x1="670" y1="688" x2="670" y2="704" stroke="#8296A3" stroke-width="3" marker-end="url(#aw)"/>

<!-- L4 ICEBERG -->
<rect x="90" y="712" width="1200" height="100" rx="12" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<image href="../../_icons/aws/storage/simple-storage-service-s3.png" x="118" y="734" width="56" height="56"/>
<text x="196" y="758" class="icn" style="font-size:20px">S3 Tables &#8212; Iceberg v2 metadata</text>
<text x="196" y="786" class="icd" style="font-size:17px;fill:#E8D5B0">snapshots &#183; manifests &#183; delete files &#8212; AWS runs compaction and expiry</text>
<line x1="670" y1="820" x2="670" y2="836" stroke="#8296A3" stroke-width="3" marker-end="url(#aw)"/>

<!-- L5 OBJECTS -->
<rect x="90" y="844" width="1200" height="46" rx="10" fill="#14181B" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="874" class="code" style="font-size:18px">Parquet objects on Amazon S3 &#8212; the only thing that is actually a file</text>

<!-- ANNOTATION -->
<rect x="1320" y="316" width="510" height="574" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1348" y="356" class="grp" style="font-size:20px">WHERE IT BITES</text>
<line x1="1348" y1="372" x2="1802" y2="372" stroke="#2C3841" stroke-width="2"/>

<text x="1348" y="410" class="icn" style="font-size:18px;fill:#FF6B73">The Spectrum mirror database</text>
<text x="1348" y="440" class="icd" style="font-size:17px">Spectrum resolves the catalog with the</text>
<text x="1348" y="464" class="icd" style="font-size:17px">account baked in, so a federated catalog</text>
<text x="1348" y="488" class="icd" style="font-size:17px">cannot be referenced directly. A mirror</text>
<text x="1348" y="512" class="icd" style="font-size:17px">database is created for Redshift to point</text>
<text x="1348" y="536" class="icd" style="font-size:17px">at instead.</text>
<line x1="1348" y1="562" x2="1802" y2="562" stroke="#2C3841" stroke-width="2"/>

<text x="1348" y="598" class="icn" style="font-size:18px;fill:#FFB84D">Two grant systems, one table</text>
<text x="1348" y="628" class="icd" style="font-size:17px">Redshift GRANT governs its own tables.</text>
<text x="1348" y="652" class="icd" style="font-size:17px">Lake Formation governs anything read</text>
<text x="1348" y="676" class="icd" style="font-size:17px">through the catalog. &#8220;Works in Athena,</text>
<text x="1348" y="700" class="icd" style="font-size:17px">not in Redshift&#8221; starts here.</text>
<line x1="1348" y1="726" x2="1802" y2="726" stroke="#2C3841" stroke-width="2"/>

<text x="1348" y="762" class="icn" style="font-size:18px;fill:#3FD98A">Maintenance is not optional</text>
<text x="1348" y="792" class="icd" style="font-size:17px">Iceberg v2 writes delete files rather than</text>
<text x="1348" y="816" class="icd" style="font-size:17px">rewriting data. Without compaction and</text>
<text x="1348" y="840" class="icd" style="font-size:17px">snapshot expiry, reads get slower and</text>
<text x="1348" y="864" class="icd" style="font-size:17px">storage grows forever.</text>

<!-- PLAIN ENGLISH -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Address, street index, town plan, land registry, and the actual bricks. When something is missing, first work out which of the five you are looking at.</text>
