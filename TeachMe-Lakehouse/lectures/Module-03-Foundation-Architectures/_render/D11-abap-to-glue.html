<!-- PLAIN ENGLISH -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>

<text x="122" y="982" class="plain">A till roll only makes sense read top to bottom. Shuffle the lines and the receipt stops meaning anything &#8212; which is why we fold, not aggregate.</text>
