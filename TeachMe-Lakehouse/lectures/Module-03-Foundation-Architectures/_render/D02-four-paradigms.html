<text x="90" y="104" class="eyebrow">MODULE 3 · ARCHITECTURE 02</text>
<text x="90" y="168" class="title">Four Paradigms, Four Architectures</text>
<text x="90" y="212" class="sub">The same four words from Module 0 &#8212; but drawn as the services each one actually resolves to on AWS.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zhow">1 · SAME QUESTION, FOUR ANSWERS</text>

<!-- ══ WAREHOUSE ══ -->
<rect x="90" y="316" width="420" height="574" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="grp">WAREHOUSE</text>
<line x1="118" y1="372" x2="482" y2="372" stroke="#2C3841" stroke-width="2"/>
<image href="../../_icons/aws/database/rds.png" x="120" y="392" width="52" height="52"/>
<text x="186" y="412" class="icn" style="font-size:17px">Source database</text>
<text x="186" y="434" class="icd" style="font-size:15px">OLTP, row-oriented</text>
<image href="../../_icons/aws/analytics/glue.png" x="120" y="468" width="52" height="52"/>
<text x="186" y="488" class="icn" style="font-size:17px">ETL</text>
<text x="186" y="510" class="icd" style="font-size:15px">model first, load second</text>
<image href="../../_icons/aws/analytics/redshift.png" x="120" y="544" width="52" height="52"/>
<text x="186" y="564" class="icn" style="font-size:17px">Amazon Redshift</text>
<text x="186" y="586" class="icd" style="font-size:15px">schema on write</text>
<image href="../../_icons/aws/analytics/quicksight.png" x="120" y="620" width="52" height="52"/>
<text x="186" y="640" class="icn" style="font-size:17px">BI</text>
<text x="186" y="662" class="icd" style="font-size:15px">numbers that reconcile</text>
<line x1="118" y1="700" x2="482" y2="700" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="730" class="th">USE WHEN</text>
<text x="118" y="762" class="icd" style="font-size:17px">the shape is known and the</text>
<text x="118" y="786" class="icd" style="font-size:17px">numbers must reconcile</text>
<text x="118" y="828" class="bxt-s" style="font-size:19px;fill:#A9BAC6">BUY: TRUST</text>

<!-- ══ LAKE ══ -->
<rect x="530" y="316" width="420" height="574" rx="16" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>
<text x="558" y="356" class="grp" style="fill:#5AA9FF">LAKE</text>
<line x1="558" y1="372" x2="922" y2="372" stroke="#2E4A66" stroke-width="2"/>
<image href="../../_icons/aws/general/disk.png" x="560" y="392" width="52" height="52"/>
<text x="626" y="412" class="icn" style="font-size:17px">Any files</text>
<text x="626" y="434" class="icd" style="font-size:15px">any shape, as received</text>
<image href="../../_icons/aws/storage/simple-storage-service-s3.png" x="560" y="468" width="52" height="52"/>
<text x="626" y="488" class="icn" style="font-size:17px">Amazon S3</text>
<text x="626" y="510" class="icd" style="font-size:15px">cheap, immutable</text>
<image href="../../_icons/aws/analytics/glue-data-catalog.png" x="560" y="544" width="52" height="52"/>
<text x="626" y="564" class="icn" style="font-size:17px">Glue Data Catalog</text>
<text x="626" y="586" class="icd" style="font-size:15px">schema on read</text>
<image href="../../_icons/aws/analytics/athena.png" x="560" y="620" width="52" height="52"/>
<text x="626" y="640" class="icn" style="font-size:17px">Athena</text>
<text x="626" y="662" class="icd" style="font-size:15px">priced per TB scanned</text>
<line x1="558" y1="700" x2="922" y2="700" stroke="#2E4A66" stroke-width="2"/>
<text x="558" y="730" class="th">USE WHEN</text>
<text x="558" y="762" class="icd" style="font-size:17px">you must keep everything</text>
<text x="558" y="786" class="icd" style="font-size:17px">and decide meaning later</text>
<text x="558" y="828" class="bxt-s" style="font-size:19px;fill:#5AA9FF">BUY: OPTIONALITY</text>

<!-- ══ LAKEHOUSE ══ -->
<rect x="970" y="316" width="420" height="574" rx="16" fill="#231114" stroke="#E3000E" stroke-width="3.5"/>
<text x="998" y="356" class="grp" style="fill:#FF3B47">LAKEHOUSE</text>
<line x1="998" y1="372" x2="1362" y2="372" stroke="#6A2A30" stroke-width="2"/>
<image href="../../_icons/aws/storage/simple-storage-service-s3.png" x="1000" y="392" width="52" height="52"/>
<text x="1066" y="412" class="icn" style="font-size:17px">S3 Tables</text>
<text x="1066" y="434" class="icd" style="font-size:15px;fill:#C08A90">managed Iceberg</text>
<image href="../../_icons/aws/analytics/glue.png" x="1000" y="468" width="52" height="52"/>
<text x="1066" y="488" class="icn" style="font-size:17px">Glue / EMR</text>
<text x="1066" y="510" class="icd" style="font-size:15px;fill:#C08A90">MERGE, never append</text>
<image href="../../_icons/aws/analytics/redshift.png" x="1000" y="544" width="52" height="52"/>
<text x="1066" y="564" class="icn" style="font-size:17px">Redshift</text>
<text x="1066" y="586" class="icd" style="font-size:15px;fill:#C08A90">gold layer only</text>
<image href="../../_icons/aws/analytics/athena.png" x="1000" y="620" width="52" height="52"/>
<text x="1066" y="640" class="icn" style="font-size:17px">Many engines</text>
<text x="1066" y="662" class="icd" style="font-size:15px;fill:#C08A90">one copy of the table</text>
<line x1="998" y1="700" x2="1362" y2="700" stroke="#6A2A30" stroke-width="2"/>
<text x="998" y="730" class="th" style="fill:#C08A90">USE WHEN</text>
<text x="998" y="762" class="icd" style="font-size:17px;fill:#E5B8BC">you need lake economics and</text>
<text x="998" y="786" class="icd" style="font-size:17px;fill:#E5B8BC">warehouse guarantees</text>
<text x="998" y="828" class="bxt-s" style="font-size:19px;fill:#FF3B47">BUY: BOTH &#8212; THIS IS US</text>

<!-- ══ MESH ══ -->
<rect x="1410" y="316" width="420" height="574" rx="16" fill="#14181B" stroke="#3A4854" stroke-width="2.5" stroke-dasharray="10 7"/>
<text x="1438" y="356" class="grp" style="fill:#8296A3">MESH</text>
<line x1="1438" y1="372" x2="1802" y2="372" stroke="#2C3841" stroke-width="2"/>
<image href="../../_icons/aws/analytics/lake-formation.png" x="1440" y="392" width="52" height="52"/>
<text x="1506" y="412" class="icn" style="font-size:17px;fill:#A9BAC6">Lake Formation</text>
<text x="1506" y="434" class="icd" style="font-size:15px">cross-account grants</text>
<image href="../../_icons/aws/security/resource-access-manager.png" x="1440" y="468" width="52" height="52"/>
<text x="1506" y="488" class="icn" style="font-size:17px;fill:#A9BAC6">AWS RAM</text>
<text x="1506" y="510" class="icd" style="font-size:15px">shares the resource</text>
<image href="../../_icons/aws/analytics/redshift.png" x="1440" y="544" width="52" height="52"/>
<text x="1506" y="564" class="icn" style="font-size:17px;fill:#A9BAC6">Datashares</text>
<text x="1506" y="586" class="icd" style="font-size:15px">live, across accounts</text>
<image href="../../_icons/aws/general/users.png" x="1440" y="620" width="52" height="52"/>
<text x="1506" y="640" class="icn" style="font-size:17px;fill:#A9BAC6">Domain teams</text>
<text x="1506" y="662" class="icd" style="font-size:15px">own their data products</text>
<line x1="1438" y1="700" x2="1802" y2="700" stroke="#2C3841" stroke-width="2"/>
<text x="1438" y="730" class="th">USE WHEN</text>
<text x="1438" y="762" class="icd" style="font-size:17px">there are many domain teams</text>
<text x="1438" y="786" class="icd" style="font-size:17px">&#8212; not one platform team</text>
<text x="1438" y="828" class="bxt-s" style="font-size:19px;fill:#8296A3">BUY: AUTONOMY</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Three of these are places to put data. The fourth is a rule about who owns it. Only the third one is a building we are actually putting up.</text>
