<text x="90" y="104" class="eyebrow">MODULE 3 · ARCHITECTURE 07</text>
<text x="90" y="168" class="title">Zero-Copy Access Paths</text>
<text x="90" y="212" class="sub">Four ways to query data you never loaded. None of them is free &#8212; each one just moves the bill somewhere else.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zhow">1 · FOUR DOORS, FOUR DIFFERENT PAYERS</text>

<!-- ══ SPECTRUM ══ -->
<rect x="90" y="316" width="420" height="574" rx="16" fill="#0F1E17" stroke="#2A5A40" stroke-width="2.5"/>
<text x="118" y="356" class="grp" style="fill:#3FD98A">SPECTRUM</text>
<line x1="118" y1="372" x2="482" y2="372" stroke="#2A5A40" stroke-width="2"/>
<image href="../../_icons/aws/storage/simple-storage-service-s3.png" x="160" y="400" width="64" height="64"/>
<text x="192" y="486" class="nlb" text-anchor="middle">S3 / Iceberg</text>
<line x1="238" y1="432" x2="368" y2="432" stroke="#8296A3" stroke-width="2.5" marker-end="url(#aw)"/>
<image href="../../_icons/aws/analytics/redshift.png" x="376" y="400" width="64" height="64"/>
<text x="408" y="486" class="nlb" text-anchor="middle">Redshift</text>
<line x1="118" y1="516" x2="482" y2="516" stroke="#2A5A40" stroke-width="2"/>
<text x="118" y="550" class="icd" style="font-size:17px">External schema over the Glue</text>
<text x="118" y="576" class="icd" style="font-size:17px">catalog. Reads Parquet, ORC,</text>
<text x="118" y="602" class="icd" style="font-size:17px">CSV, JSON, Avro &#8212; plus Iceberg,</text>
<text x="118" y="628" class="icd" style="font-size:17px">Hudi CoW and Delta.</text>
<line x1="118" y1="656" x2="482" y2="656" stroke="#2A5A40" stroke-width="2"/>
<text x="118" y="688" class="th">YOU PAY FOR</text>
<text x="118" y="722" class="icn" style="font-size:18px;fill:#3FD98A">bytes scanned in S3,</text>
<text x="118" y="746" class="icn" style="font-size:18px;fill:#3FD98A">on every single query</text>
<text x="118" y="796" class="th">BEST FOR</text>
<text x="118" y="828" class="icd" style="font-size:18px">cold history you scan rarely</text>

<!-- ══ FEDERATED QUERY ══ -->
<rect x="530" y="316" width="420" height="574" rx="16" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>
<text x="558" y="356" class="grp" style="fill:#5AA9FF">FEDERATED QUERY</text>
<line x1="558" y1="372" x2="922" y2="372" stroke="#2E4A66" stroke-width="2"/>
<image href="../../_icons/aws/database/rds.png" x="600" y="400" width="64" height="64"/>
<text x="632" y="486" class="nlb" text-anchor="middle">RDS / Aurora</text>
<line x1="678" y1="432" x2="808" y2="432" stroke="#8296A3" stroke-width="2.5" marker-end="url(#aw)"/>
<image href="../../_icons/aws/analytics/redshift.png" x="816" y="400" width="64" height="64"/>
<text x="848" y="486" class="nlb" text-anchor="middle">Redshift</text>
<line x1="558" y1="516" x2="922" y2="516" stroke="#2E4A66" stroke-width="2"/>
<text x="558" y="550" class="icd" style="font-size:17px">External schema onto a live</text>
<text x="558" y="576" class="icd" style="font-size:17px">PostgreSQL or MySQL database.</text>
<text x="558" y="602" class="icd" style="font-size:17px">Predicates are pushed down to</text>
<text x="558" y="628" class="icd" style="font-size:17px">the source. Large scans are not.</text>
<line x1="558" y1="656" x2="922" y2="656" stroke="#2E4A66" stroke-width="2"/>
<text x="558" y="688" class="th">YOU PAY FOR</text>
<text x="558" y="722" class="icn" style="font-size:18px;fill:#FF6B73">load on the production</text>
<text x="558" y="746" class="icn" style="font-size:18px;fill:#FF6B73">database, every query</text>
<text x="558" y="796" class="th">BEST FOR</text>
<text x="558" y="828" class="icd" style="font-size:18px">small, live lookups only</text>

<!-- ══ DATASHARE ══ -->
<rect x="970" y="316" width="420" height="574" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="998" y="356" class="grp" style="fill:#FFB84D">DATASHARE</text>
<line x1="998" y1="372" x2="1362" y2="372" stroke="#8A6A3A" stroke-width="2"/>
<image href="../../_icons/aws/analytics/redshift.png" x="1040" y="400" width="64" height="64"/>
<text x="1072" y="486" class="nlb" text-anchor="middle">Producer</text>
<line x1="1118" y1="432" x2="1248" y2="432" stroke="#8296A3" stroke-width="2.5" marker-end="url(#aw)"/>
<image href="../../_icons/aws/analytics/redshift.png" x="1256" y="400" width="64" height="64"/>
<text x="1288" y="486" class="nlb" text-anchor="middle">Consumer</text>
<line x1="998" y1="516" x2="1362" y2="516" stroke="#8A6A3A" stroke-width="2"/>
<text x="998" y="550" class="icd" style="font-size:17px;fill:#E8D5B0">Live data across clusters,</text>
<text x="998" y="576" class="icd" style="font-size:17px;fill:#E8D5B0">accounts and Regions. No copy,</text>
<text x="998" y="602" class="icd" style="font-size:17px;fill:#E8D5B0">no ETL, no lag &#8212; and writes are</text>
<text x="998" y="628" class="icd" style="font-size:17px;fill:#E8D5B0">now possible with allow-writes.</text>
<line x1="998" y1="656" x2="1362" y2="656" stroke="#8A6A3A" stroke-width="2"/>
<text x="998" y="688" class="th" style="fill:#B99A6A">YOU PAY FOR</text>
<text x="998" y="722" class="icn" style="font-size:18px;fill:#FFB84D">the consumer&#8217;s own</text>
<text x="998" y="746" class="icn" style="font-size:18px;fill:#FFB84D">compute, not yours</text>
<text x="998" y="796" class="th" style="fill:#B99A6A">BEST FOR</text>
<text x="998" y="828" class="icd" style="font-size:18px;fill:#E8D5B0">another team&#8217;s warehouse</text>

<!-- ══ ATHENA CONNECTORS ══ -->
<rect x="1410" y="316" width="420" height="574" rx="16" fill="#191233" stroke="#8A5CF0" stroke-width="2.5"/>
<text x="1438" y="356" class="grp" style="fill:#B79BFF">ATHENA CONNECTORS</text>
<line x1="1438" y1="372" x2="1802" y2="372" stroke="#8A5CF0" stroke-width="2"/>
<image href="../../_icons/aws/database/dynamodb.png" x="1480" y="400" width="64" height="64"/>
<text x="1512" y="486" class="nlb" text-anchor="middle">Anything</text>
<line x1="1558" y1="432" x2="1688" y2="432" stroke="#8296A3" stroke-width="2.5" marker-end="url(#aw)"/>
<image href="../../_icons/aws/analytics/athena.png" x="1696" y="400" width="64" height="64"/>
<text x="1728" y="486" class="nlb" text-anchor="middle">Athena</text>
<line x1="1438" y1="516" x2="1802" y2="516" stroke="#8A5CF0" stroke-width="2"/>
<text x="1438" y="550" class="icd" style="font-size:17px">Redshift, DynamoDB, Snowflake</text>
<text x="1438" y="576" class="icd" style="font-size:17px">and more. Two connector types &#8212;</text>
<text x="1438" y="602" class="icd" style="font-size:17px">only the Glue-connection kind</text>
<text x="1438" y="628" class="icd" style="font-size:17px">supports Lake Formation.</text>
<line x1="1438" y1="656" x2="1802" y2="656" stroke="#8A5CF0" stroke-width="2"/>
<text x="1438" y="688" class="th" style="fill:#9A7ACF">YOU PAY FOR</text>
<text x="1438" y="722" class="icn" style="font-size:18px;fill:#B79BFF">Athena scan cost, plus</text>
<text x="1438" y="746" class="icn" style="font-size:18px;fill:#B79BFF">the remote system</text>
<text x="1438" y="796" class="th" style="fill:#9A7ACF">BEST FOR</text>
<text x="1438" y="828" class="icd" style="font-size:18px">one SQL door to everything</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A library card, not a photocopy. You can read the book any time &#8212; but you walk to the other building every single time you open it.</text>
