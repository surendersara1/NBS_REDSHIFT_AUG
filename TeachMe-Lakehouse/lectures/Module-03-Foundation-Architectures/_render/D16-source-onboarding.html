<text x="90" y="104" class="eyebrow">MODULE 3 · ARCHITECTURE 16 · PROPOSED</text>
<text x="90" y="168" class="title">Eight Sources, Three Connectors</text>
<text x="90" y="212" class="sub">The variety lives in the specs, not in the code. That is what makes the ninth source a config change rather than a project.</text>

<!-- CONNECTORS -->
<rect x="570" y="316" width="520" height="574" rx="16" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>
<text x="598" y="356" class="grp" style="fill:#5AA9FF">THREE CONNECTOR CLASSES</text>
<line x1="598" y1="372" x2="1062" y2="372" stroke="#2E4A66" stroke-width="2"/>

<rect x="598" y="396" width="464" height="150" rx="12" fill="#0C141C" stroke="#2E4A66" stroke-width="2"/>
<image href="../../_icons/onprem/database/oracle.png" x="618" y="416" width="48" height="48"/>
<text x="682" y="440" class="icn" style="font-size:19px">Oracle JDBC</text>
<text x="682" y="464" class="icd" style="font-size:16px">serves RMS, SIM and XStore</text>
<text x="618" y="504" class="icd" style="font-size:16px">Parallel reads on a numeric key.</text>
<text x="618" y="528" class="icd" style="font-size:16px">One class, three sources, ~90 specs.</text>

<rect x="598" y="562" width="464" height="150" rx="12" fill="#0C141C" stroke="#2E4A66" stroke-width="2"/>
<image href="../../_icons/aws/general/internet-alt1.png" x="618" y="582" width="48" height="48"/>
<text x="682" y="606" class="icn" style="font-size:19px">Cursor-paged API</text>
<text x="682" y="630" class="icd" style="font-size:16px">serves Epsilon and MoEngage</text>
<text x="618" y="670" class="icd" style="font-size:16px">Rate limits and paging live here,</text>
<text x="618" y="694" class="icd" style="font-size:16px">once &#8212; not per source.</text>

<rect x="598" y="728" width="464" height="140" rx="12" fill="#0C141C" stroke="#2E4A66" stroke-width="2"/>
<image href="../../_icons/aws/general/disk.png" x="618" y="748" width="48" height="48"/>
<text x="682" y="772" class="icn" style="font-size:19px">File drop</text>
<text x="682" y="796" class="icd" style="font-size:16px">serves Vemco and Irisys</text>
<text x="618" y="836" class="icd" style="font-size:16px">Late, duplicate and missing files are</text>
<text x="618" y="858" class="icd" style="font-size:16px">normal &#8212; handled once, here.</text>

<line x1="1098" y1="560" x2="1122" y2="560" stroke="#8296A3" stroke-width="3" marker-end="url(#aw)"/>

<!-- ENGINE -->
<rect x="1130" y="316" width="700" height="574" rx="16" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<image href="../../_icons/aws/analytics/glue.png" x="1158" y="334" width="34" height="34"/>
<text x="1204" y="358" class="icb" style="fill:#FF6B73">ONE ENGINE, MANY SPECS</text>
<line x1="1158" y1="376" x2="1802" y2="376" stroke="#6A2A30" stroke-width="2"/>

<rect x="1158" y="400" width="644" height="88" rx="10" fill="#1A1114" stroke="#7A3A40" stroke-width="2"/>
<text x="1180" y="432" class="icn" style="font-size:18px;fill:#FF8A92">SPEC</text>
<text x="1180" y="462" class="icd" style="font-size:17px;fill:#E5B8BC">what the table <tspan style="fill:#FFFFFF">is</tspan> &#8212; schema, natural key, read mode, source config</text>

<rect x="1158" y="502" width="644" height="88" rx="10" fill="#1A1114" stroke="#7A3A40" stroke-width="2"/>
<text x="1180" y="534" class="icn" style="font-size:18px;fill:#FF8A92">CONNECTOR</text>
<text x="1180" y="564" class="icd" style="font-size:17px;fill:#E5B8BC">where rows come <tspan style="fill:#FFFFFF">from</tspan> &#8212; one class per kind of source, never per table</text>

<rect x="1158" y="604" width="644" height="88" rx="10" fill="#1A1114" stroke="#7A3A40" stroke-width="2"/>
<text x="1180" y="636" class="icn" style="font-size:18px;fill:#FF8A92">WRITER</text>
<text x="1180" y="666" class="icd" style="font-size:17px;fill:#E5B8BC">where rows go <tspan style="fill:#FFFFFF">to</tspan> &#8212; land raw immutably, then MERGE on the key</text>

<rect x="1158" y="706" width="644" height="88" rx="10" fill="#1A1114" stroke="#7A3A40" stroke-width="2"/>
<text x="1180" y="738" class="icn" style="font-size:18px;fill:#FF8A92">CONTROL PLANE</text>
<text x="1180" y="768" class="icd" style="font-size:17px;fill:#E5B8BC">what actually <tspan style="fill:#FFFFFF">happened</tspan> &#8212; runs, watermarks, state, lineage</text>

<rect x="1158" y="812" width="644" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="1180" y="846" class="code" style="font-size:17px;fill:#8CE8B8">add table N+1 = 1 spec file &#8212; no new code, no deploy</text>

<!-- PLAIN ENGLISH -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Build the printer once, not a hundred hand-written letters. Every new table after that is just another page you feed it.</text>
