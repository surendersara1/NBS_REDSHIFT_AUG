<text x="164" y="518" class="icb" style="fill:#FF6B73">AWS GLUE DATA CATALOG &#8212; THREE LEVELS, NOT ONE FLAT LIST</text>
<text x="1802" y="518" class="code" style="font-size:19px;fill:#FF8A92" text-anchor="end">catalog . database . table</text>

<rect x="118" y="536" width="810" height="140" rx="12" fill="#1A1114" stroke="#7A3A40" stroke-width="2"/>
<text x="146" y="570" class="icn" style="font-size:19px;fill:#FF8A92">MANAGED CATALOG</text>
<text x="146" y="602" class="icd" style="font-size:17px;fill:#E5B8BC">A catalog you create. AWS manages the data for you,</text>
<text x="146" y="628" class="icd" style="font-size:17px;fill:#E5B8BC">stored in S3 or in Redshift Managed Storage.</text>
<text x="146" y="658" class="code" style="font-size:16px;fill:#FF8A92">you own the tables and the storage</text>

<rect x="992" y="536" width="810" height="140" rx="12" fill="#1A1114" stroke="#7A3A40" stroke-width="2"/>
<text x="1020" y="570" class="icn" style="font-size:19px;fill:#FF8A92">FEDERATED CATALOG</text>
<text x="1020" y="602" class="icd" style="font-size:17px;fill:#E5B8BC">Mounts a system that already exists. The tables appear;</text>
<text x="1020" y="628" class="icd" style="font-size:17px;fill:#E5B8BC">the bytes never move and it stays the system of record.</text>
<text x="1020" y="658" class="code" style="font-size:16px;fill:#FF8A92">someone else owns the storage</text>
