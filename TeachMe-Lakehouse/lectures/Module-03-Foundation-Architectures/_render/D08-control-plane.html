<rect x="538" y="396" width="5" height="44" rx="2.5" fill="#FF3B47"/>
<text x="562" y="422" class="code" style="font-size:19px;fill:#FF8A92">runs</text>
<text x="562" y="446" class="icd" style="font-size:17px;fill:#E5B8BC">one row per job execution &#8212; status, start, end, rows, error</text>

<rect x="538" y="490" width="5" height="44" rx="2.5" fill="#FF3B47"/>
<text x="562" y="516" class="code" style="font-size:19px;fill:#FF8A92">watermarks</text>
<text x="562" y="540" class="icd" style="font-size:17px;fill:#E5B8BC">the high-water mark per table &#8212; and whether it is dirty</text>

<rect x="538" y="584" width="5" height="44" rx="2.5" fill="#FF3B47"/>
<text x="562" y="610" class="code" style="font-size:19px;fill:#FF8A92">pipeline-state</text>
<text x="562" y="634" class="icd" style="font-size:17px;fill:#E5B8BC">live per-source state, so the dispatcher knows what is safe</text>

<rect x="538" y="678" width="5" height="44" rx="2.5" fill="#FF3B47"/>
<text x="562" y="704" class="code" style="font-size:19px;fill:#FF8A92">lineage_edges</text>
<text x="562" y="728" class="icd" style="font-size:17px;fill:#E5B8BC">which output came from which input &#8212; for impact analysis</text>

<rect x="538" y="772" width="5" height="44" rx="2.5" fill="#FF3B47"/>
<text x="562" y="798" class="code" style="font-size:19px;fill:#FF8A92">coordination</text>
<text x="562" y="822" class="icd" style="font-size:17px;fill:#E5B8BC">single-flight locks &#8212; conditional writes are what make barriers work</text>

<rect x="538" y="844" width="824" height="34" rx="8" fill="#0B1013" stroke="#6A2A30" stroke-width="2"/>
