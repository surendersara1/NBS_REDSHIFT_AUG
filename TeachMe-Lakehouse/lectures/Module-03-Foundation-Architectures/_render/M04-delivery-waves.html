<text x="90" y="104" class="eyebrow">MODULE 3 · MASTER FLOW 04 · APPAREL GROUP</text>
<text x="90" y="168" class="title">Delivery Waves And What Blocks Them</text>
<text x="90" y="212" class="sub">Sources are onboarded in waves, hardest first. What actually delays a wave is almost never the engineering.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<text x="90" y="300" class="zhow">1 · FOUR WAVES, HARDEST FIRST</text>

<rect x="90" y="316" width="420" height="454" rx="16" fill="#231114" stroke="#E3000E" stroke-width="3"/>
<text x="118" y="356" class="grp" style="fill:#FF3B47">WAVE 1 &#183; PROVE IT</text>
<line x1="118" y1="372" x2="482" y2="372" stroke="#6A2A30" stroke-width="2"/>
<image href="../../_icons/onprem/database/oracle.png" x="118" y="392" width="52" height="52"/>
<text x="184" y="424" class="icn" style="font-size:19px">Oracle RMS</text>
<text x="118" y="480" class="icd" style="font-size:17px;fill:#E5B8BC">The reference data everything</text>
<text x="118" y="510" class="icd" style="font-size:17px;fill:#E5B8BC">else joins to &#8212; product, store,</text>
<text x="118" y="540" class="icd" style="font-size:17px;fill:#E5B8BC">supplier, price.</text>
<text x="118" y="586" class="icd" style="font-size:17px;fill:#E5B8BC">Builds dim_product and</text>
<text x="118" y="616" class="icd" style="font-size:17px;fill:#E5B8BC">dim_store first, so every later</text>
<text x="118" y="646" class="icd" style="font-size:17px;fill:#E5B8BC">wave has something to join to.</text>
<line x1="118" y1="676" x2="482" y2="676" stroke="#6A2A30" stroke-width="2"/>
<text x="118" y="708" class="th" style="fill:#C08A90">PROVES</text>
<text x="118" y="742" class="icd" style="font-size:17px;fill:#E5B8BC">the engine works, end to end</text>

<rect x="530" y="316" width="420" height="454" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="558" y="356" class="grp" style="fill:#FFB84D">WAVE 2 &#183; THE VOLUME</text>
<line x1="558" y1="372" x2="922" y2="372" stroke="#8A6A3A" stroke-width="2"/>
<image href="../../_icons/onprem/database/oracle.png" x="558" y="392" width="52" height="52"/>
<text x="624" y="424" class="icn" style="font-size:19px">SIM &#183; XStore</text>
<text x="558" y="480" class="icd" style="font-size:17px;fill:#E8D5B0">The two big transactional</text>
<text x="558" y="510" class="icd" style="font-size:17px;fill:#E8D5B0">sources. XStore is the giant and</text>
<text x="558" y="540" class="icd" style="font-size:17px;fill:#E8D5B0">carries the receipt logic.</text>
<text x="558" y="586" class="icd" style="font-size:17px;fill:#E8D5B0">This is where parallelism, cost</text>
<text x="558" y="616" class="icd" style="font-size:17px;fill:#E8D5B0">and the hard-delete question all</text>
<text x="558" y="646" class="icd" style="font-size:17px;fill:#E8D5B0">get answered for real.</text>
<line x1="558" y1="676" x2="922" y2="676" stroke="#8A6A3A" stroke-width="2"/>
<text x="558" y="708" class="th" style="fill:#B99A6A">PROVES</text>
<text x="558" y="742" class="icd" style="font-size:17px;fill:#E8D5B0">it scales, and it reconciles</text>

<rect x="970" y="316" width="420" height="454" rx="16" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>
<text x="998" y="356" class="grp" style="fill:#5AA9FF">WAVE 3 &#183; THE APIS</text>
<line x1="998" y1="372" x2="1362" y2="372" stroke="#2E4A66" stroke-width="2"/>
<image href="../../_icons/aws/general/internet-alt1.png" x="998" y="392" width="52" height="52"/>
<text x="1064" y="424" class="icn" style="font-size:19px">Epsilon &#183; MoEngage</text>
<text x="998" y="480" class="icd" style="font-size:17px">A different connector class:</text>
<text x="998" y="510" class="icd" style="font-size:17px">rate limits, cursor paging, no</text>
<text x="998" y="540" class="icd" style="font-size:17px">bulk export to fall back on.</text>
<text x="998" y="586" class="icd" style="font-size:17px;fill:#FF8A92">Epsilon carries PII, so this wave</text>
<text x="998" y="616" class="icd" style="font-size:17px;fill:#FF8A92">cannot start until classification</text>
<text x="998" y="646" class="icd" style="font-size:17px;fill:#FF8A92">and sign-off are done.</text>
<line x1="998" y1="676" x2="1362" y2="676" stroke="#2E4A66" stroke-width="2"/>
<text x="998" y="708" class="th">PROVES</text>
<text x="998" y="742" class="icd" style="font-size:17px">governance actually works</text>

<rect x="1410" y="316" width="420" height="454" rx="16" fill="#14181B" stroke="#3A4854" stroke-width="2.5"/>
<text x="1438" y="356" class="grp" style="fill:#A9BAC6">WAVE 4 &#183; THE REST</text>
<line x1="1438" y1="372" x2="1802" y2="372" stroke="#2C3841" stroke-width="2"/>
<image href="../../_icons/aws/general/disk.png" x="1438" y="392" width="52" height="52"/>
<text x="1504" y="424" class="icn" style="font-size:19px">Magento &#183; footfall</text>
<text x="1438" y="480" class="icd" style="font-size:17px">Small volumes, third connector</text>
<text x="1438" y="510" class="icd" style="font-size:17px">class, unreliable arrival.</text>
<text x="1438" y="556" class="icd" style="font-size:17px">Deliberately last: by now the</text>
<text x="1438" y="586" class="icd" style="font-size:17px">landing conventions, alarms and</text>
<text x="1438" y="616" class="icd" style="font-size:17px">idempotency are proven, so late</text>
<text x="1438" y="646" class="icd" style="font-size:17px">and duplicate files are harmless.</text>
<line x1="1438" y1="676" x2="1802" y2="676" stroke="#2C3841" stroke-width="2"/>
<text x="1438" y="708" class="th">PROVES</text>
<text x="1438" y="742" class="icd" style="font-size:17px">the ninth source is cheap</text>

<!-- DEPENDENCY BAND -->
<rect x="90" y="790" width="1740" height="100" rx="14" fill="#231519" stroke="#7A3A40" stroke-width="2.5"/>
<text x="118" y="820" class="icb" style="fill:#FF6B73">THESE BLOCK WAVES AND ARE NOT OURS TO FIX &#8212; TRACK THEM FROM DAY ONE</text>
<line x1="118" y1="834" x2="1802" y2="834" stroke="#4A2228" stroke-width="2"/>
<text x="118" y="868" class="bxs-s" style="font-size:18px;fill:#E5B8BC">Network path to on-prem Oracle &#8594; blocks waves 1&#8211;2 &#8226; PII classification and legal sign-off &#8594; blocks wave 3 &#8226; SaaS API credentials and quota &#8594; blocks wave 3 &#8226; source owners agreeing a contract &#8594; blocks everything</text>

<!-- PLAIN ENGLISH -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Do the hardest source first, while there is still time to be wrong about it. The easy ones at the end are the reward, not the warm-up.</text>
