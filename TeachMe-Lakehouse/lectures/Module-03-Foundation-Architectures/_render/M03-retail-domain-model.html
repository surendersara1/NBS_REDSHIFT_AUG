<text x="90" y="168" class="title">The Retail Domain Model</text>
<text x="90" y="212" class="sub">Four dimensions and four facts. Every dashboard the business asks for is a combination of these eight things.</text>

<!-- ROW 1 · DIMENSIONS -->
<rect x="90" y="316" width="420" height="274" rx="14" fill="#0F1E17" stroke="#2A5A40" stroke-width="2.5"/>

<text x="118" y="474" class="icd" style="font-size:17px">Type 2 &#8212; stores move region</text>

<rect x="530" y="316" width="420" height="274" rx="14" fill="#0F1E17" stroke="#2A5A40" stroke-width="2.5"/>

<line x1="558" y1="372" x2="922" y2="372" stroke="#2A5A40" stroke-width="2"/>
<text x="558" y="406" class="icd" style="font-size:17px">One row per version of an SKU</text>
<text x="558" y="440" class="icd" style="font-size:17px">Fed by Oracle RMS</text>
<text x="558" y="474" class="icd" style="font-size:17px">Type 2 &#8212; hierarchy changes</text>
<text x="558" y="508" class="icd" style="font-size:17px">Brand, department, category</text>
<text x="558" y="552" class="code" style="font-size:16px">product_sk &#183; pack_size parsed</text>

<rect x="970" y="316" width="420" height="274" rx="14" fill="#231114" stroke="#E3000E" stroke-width="3"/>

<text x="998" y="440" class="icd" style="font-size:17px;fill:#E5B8BC">Fed by Epsilon &#8212; <tspan style="fill:#FF8A92">this is PII</tspan></text>
<text x="998" y="474" class="icd" style="font-size:17px;fill:#E5B8BC">Masked at the column, not copied</text>
<text x="998" y="508" class="icd" style="font-size:17px;fill:#E5B8BC">Lake Formation grants apply</text>

<text x="1438" y="440" class="icd" style="font-size:17px">Generated, not sourced</text>
<text x="1438" y="474" class="icd" style="font-size:17px">Fiscal calendar, week, season</text>

<text x="118" y="774" class="icd" style="font-size:17px">Additive: quantity, net, VAT</text>

<text x="558" y="774" class="icd" style="font-size:17px;fill:#FF8A92">Semi-additive &#8212; never sum over time</text>
<text x="558" y="808" class="icd" style="font-size:17px">Snapshot, not a movement log</text>
<text x="558" y="852" class="code" style="font-size:16px">on_hand &#183; on_order &#183; in_transit</text>

<rect x="970" y="616" width="420" height="274" rx="14" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>

<text x="998" y="774" class="icd" style="font-size:17px">Two vendors, one grain &#8212; conform</text>
<text x="998" y="808" class="icd" style="font-size:17px">Small, but arrives unreliably</text>

<rect x="1410" y="616" width="420" height="274" rx="14" fill="#101A24" stroke="#2E4A66" stroke-width="2.5"/>

<text x="1438" y="740" class="icd" style="font-size:17px">Fed by MoEngage</text>
<text x="1438" y="774" class="icd" style="font-size:17px">Joins customers to sales</text>
<text x="1438" y="808" class="icd" style="font-size:17px">Attribution is a business rule</text>
