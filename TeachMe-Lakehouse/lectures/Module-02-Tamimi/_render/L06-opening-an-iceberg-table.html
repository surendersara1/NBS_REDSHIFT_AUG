<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 06</text>
<text x="90" y="168" class="title">What's Actually on Disk</text>
<text x="90" y="212" class="sub">Open a Silver table and you find four levels of pointers sitting on Parquet that is never edited.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE CHAIN ══ -->
<text x="90" y="300" class="cap">1 · THE CHAIN — WHAT AN ENGINE READS, IN ORDER</text>

<!-- b1 metadata.json -->
<rect x="90" y="322" width="400" height="200" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="290" y="366" class="bxt-s" text-anchor="middle" style="fill:#FF6A72">metadata.json</text>
<line x1="118" y1="384" x2="462" y2="384" stroke="#5A2028" stroke-width="2"/>
<text x="290" y="416" class="bxs-s" text-anchor="middle">the table, as of now</text>
<text x="290" y="444" class="bxs-s" text-anchor="middle">schema · partition spec</text>
<text x="290" y="472" class="bxs-s" text-anchor="middle">all snapshots + current id</text>
<text x="290" y="506" class="code-s" text-anchor="middle" style="fill:#FFA0A6">metadata/00007-….metadata.json</text>

<!-- b2 manifest list -->
<rect x="536" y="322" width="400" height="200" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="736" y="366" class="bxt-s" text-anchor="middle">manifest list</text>
<line x1="564" y1="384" x2="908" y2="384" stroke="#2C3841" stroke-width="2"/>
<text x="736" y="416" class="bxs-s" text-anchor="middle">exactly one per snapshot</text>
<text x="736" y="444" class="bxs-s" text-anchor="middle">names the manifests and</text>
<text x="736" y="472" class="bxs-s" text-anchor="middle">their partition ranges</text>
<text x="736" y="506" class="code-s" text-anchor="middle">metadata/snap-8134…-1-….avro</text>

<!-- b3 manifests -->
<rect x="982" y="322" width="400" height="200" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1182" y="366" class="bxt-s" text-anchor="middle">manifests</text>
<line x1="1010" y1="384" x2="1354" y2="384" stroke="#2C3841" stroke-width="2"/>
<text x="1182" y="416" class="bxs-s" text-anchor="middle">the file inventory</text>
<text x="1182" y="444" class="bxs-s" text-anchor="middle">row counts, null counts,</text>
<text x="1182" y="472" class="bxs-s" text-anchor="middle">min/max per column</text>
<text x="1182" y="506" class="code-s" text-anchor="middle">metadata/….-m0.avro</text>

<!-- b4 data files -->
<rect x="1428" y="322" width="402" height="200" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1629" y="366" class="bxt-s" text-anchor="middle">data files</text>
<line x1="1456" y1="384" x2="1802" y2="384" stroke="#2C3841" stroke-width="2"/>
<text x="1629" y="416" class="bxs-s" text-anchor="middle">the rows themselves</text>
<text x="1629" y="444" class="bxs-s" text-anchor="middle" style="fill:#FFB84D">Parquet, immutable —</text>
<text x="1629" y="472" class="bxs-s" text-anchor="middle" style="fill:#FFB84D">never edited in place</text>
<text x="1629" y="506" class="code-s" text-anchor="middle">data/….parquet</text>

<!-- chain arrows -->
<line x1="496" y1="422" x2="530" y2="422" stroke="#FF3B47" stroke-width="4" marker-end="url(#ar)"/>
<line x1="942" y1="422" x2="976" y2="422" stroke="#FF3B47" stroke-width="4" marker-end="url(#ar)"/>
<line x1="1388" y1="422" x2="1422" y2="422" stroke="#FF3B47" stroke-width="4" marker-end="url(#ar)"/>

<!-- banner -->
<rect x="90" y="540" width="1740" height="46" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="112" y="570" class="bxs" style="font-size:20px">Every level is just a file under the table's own prefix. The writer proves it — it splits the pointer on "/metadata/" to find the table root.</text>

<!-- ══ ZONE 2 · SNAPSHOT LOG ══ -->
<text x="90" y="628" class="cap">2 · SNAPSHOTS — AN APPEND-ONLY LOG</text>

<rect x="90" y="650" width="1040" height="238" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="694" class="bxt-s">Every commit appends one snapshot</text>

<rect x="118" y="712" width="210" height="88" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="223" y="744" class="code-s" text-anchor="middle">snapshot 1</text>
<text x="223" y="776" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF">first append</text>

<rect x="350" y="712" width="210" height="88" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="455" y="744" class="code-s" text-anchor="middle">snapshot 2</text>
<text x="455" y="776" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF">MERGE</text>

<rect x="582" y="712" width="210" height="88" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="687" y="744" class="code-s" text-anchor="middle">snapshot 3</text>
<text x="687" y="776" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF">MERGE</text>

<rect x="814" y="712" width="210" height="88" rx="10" fill="#2A1216" stroke="#E3000E" stroke-width="2.5"/>
<text x="919" y="744" class="code-s" text-anchor="middle" style="fill:#FFA0A6">snapshot 4</text>
<text x="919" y="776" class="bxs-s" text-anchor="middle" style="fill:#FF6A72">CURRENT</text>

<line x1="332" y1="756" x2="346" y2="756" stroke="#8296A3" stroke-width="3" marker-end="url(#ag)"/>
<line x1="564" y1="756" x2="578" y2="756" stroke="#8296A3" stroke-width="3" marker-end="url(#ag)"/>
<line x1="796" y1="756" x2="810" y2="756" stroke="#8296A3" stroke-width="3" marker-end="url(#ag)"/>

<text x="118" y="836" class="bxs-s">Nothing is rewritten: snapshot 3 still names exactly the files it named.</text>
<text x="118" y="866" class="bxs-s">That is time travel — and it is why metadata grows until something expires it (Lesson 08).</text>

<!-- ══ ZONE 3 · ATOMIC ══ -->
<text x="1190" y="628" class="cap">3 · WHAT ATOMIC MEANS</text>

<rect x="1190" y="650" width="640" height="238" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="1218" y="694" class="bxt-s" style="fill:#FF6A72">One pointer, swapped</text>
<line x1="1218" y1="710" x2="1802" y2="710" stroke="#5A2028" stroke-width="2"/>
<text x="1218" y="744" class="bxs-s">A commit writes new files first, then</text>
<text x="1218" y="772" class="bxs-s">swaps ONE pointer: which metadata.json</text>
<text x="1218" y="800" class="bxs-s">is the current one. That is the atom.</text>
<text x="1218" y="828" class="bxs-s" style="fill:#FFB84D">A reader on the old pointer sees the</text>
<text x="1218" y="852" class="bxs-s" style="fill:#FFB84D">old table, whole — never a half one.</text>
<text x="1218" y="878" class="code-s" style="fill:#5E7080">writers/s3_tables.py:487-489 · :515-531</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Nothing in an Iceberg table is edited. New files are written, then one pointer moves — and that swap is the whole commit.</text>
