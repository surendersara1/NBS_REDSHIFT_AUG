<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 04</text>
<text x="90" y="168" class="title">The Delta Window</text>
<text x="90" y="212" class="sub">How the WHERE clause is built, why SAP dates are text — and why we would rather re-read a day than store a poisoned watermark.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE PREDICATE ══ -->
<text x="90" y="300" class="cap">1 · HOW THE PREDICATE IS BUILT</text>

<rect x="90" y="322" width="880" height="298" rx="16" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="118" y="364" class="bxt-s" style="font-size:24px">ONE SELF-CONTAINED SELECT</text>
<text x="942" y="364" class="code-s" text-anchor="end" style="fill:#5E9E7C">sap_hana.py:544 _build_query</text>
<line x1="118" y1="382" x2="942" y2="382" stroke="#2A4A3A" stroke-width="2"/>

<rect x="118" y="396" width="824" height="118" rx="8" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="422" class="code" xml:space="preserve" style="fill:#8CE8B8">SELECT "MANDT", "WERKS", "BUDAT", "SEQNO", ...</text>
<text x="138" y="446" class="code" xml:space="preserve" style="fill:#8CE8B8">FROM   SAPHANADB.ZHOCIDC</text>
<text x="138" y="470" class="code" xml:space="preserve" style="fill:#8CE8B8">WHERE  MANDT = '100'</text>
<text x="138" y="494" class="code" xml:space="preserve" style="fill:#FFB84D">  AND  BUDAT &gt; '20260731'</text>

<text x="118" y="548" class="bxs-s">1 · projection — the spec's own schema columns, quoted. Never SELECT *.</text>
<text x="118" y="578" class="bxs-s">2 · client filter — without MANDT the SAP test client leaks into facts.</text>
<text x="118" y="608" class="bxs-s">3 · the delta — spliced ONLY if it matches ISO-8601 or all-digits.</text>

<!-- ══ ZONE 2 · SAP DATES ARE TEXT ══ -->
<text x="1010" y="300" class="cap">2 · SAP DATES ARE TEXT</text>

<rect x="1010" y="322" width="820" height="298" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1038" y="360" class="bxt-s" style="font-size:24px">NVARCHAR(8), NOT DATE</text>
<text x="1802" y="360" class="code-s" text-anchor="end" style="fill:#5E7080">sap_hana.py:644 _fmt_date</text>
<line x1="1038" y1="376" x2="1802" y2="376" stroke="#2C3841" stroke-width="2"/>

<text x="1038" y="406" class="bxs-s">FKDAT · BUDAT · ERDAT · ZDATE · SPTAG are all text columns.</text>
<text x="1038" y="432" class="bxs-s">The job arg arrives ISO; the column has no dashes at all.</text>

<rect x="1038" y="446" width="764" height="34" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="1058" y="469" class="code" xml:space="preserve">watermark_date_format: "YYYYMMDD"   2026-07-01 -&gt; '20260701'</text>

<text x="1038" y="512" class="bxs-s" style="fill:#FFB84D">Forget it and the BETWEEN matches nothing — a windowed load</text>
<text x="1038" y="538" class="bxs-s" style="fill:#FFB84D">landed 0 rows, live 2026-07-17.</text>

<line x1="1038" y1="554" x2="1802" y2="554" stroke="#2C3841" stroke-width="2"/>
<text x="1038" y="582" class="bxs-s">GUARD — configure() REFUSES a spec whose column list</text>
<text x="1038" y="608" class="bxs-s">omits the watermark column. F.max() would raise late.</text>

<!-- ══ ZONE 3 · THE DIRTY WATERMARK ══ -->
<text x="90" y="662" class="cap">3 · WHY WE REFUSE TO PERSIST A DIRTY WATERMARK</text>

<!-- A · what MAX() sees -->
<rect x="90" y="684" width="416" height="206" rx="16" fill="#2A1E12" stroke="#C4841F" stroke-width="3"/>
<text x="118" y="722" class="bxt-s" style="font-size:22px;fill:#FFB84D">WHAT MAX() SEES</text>
<line x1="118" y1="738" x2="478" y2="738" stroke="#5A4520" stroke-width="2"/>
<text x="118" y="770" class="code" style="fill:#FFD08A">'502812'</text>
<text x="256" y="770" class="bxs-s" style="fill:#C6A46A">not a date</text>
<text x="118" y="800" class="code" style="fill:#FFD08A">'22080401'</text>
<text x="256" y="800" class="bxs-s" style="fill:#C6A46A">year 2208</text>
<text x="118" y="830" class="code" style="fill:#FFD08A">'730121V1'</text>
<text x="256" y="830" class="bxs-s" style="fill:#C6A46A">column shift</text>
<text x="118" y="860" class="code" style="fill:#FFD08A">'S'</text>
<text x="256" y="860" class="bxs-s" style="fill:#C6A46A">sorts last</text>

<!-- B · the wedge -->
<rect x="531" y="684" width="416" height="206" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="559" y="722" class="bxt-s" style="font-size:22px;fill:#FF6A72">IF WE STORED IT</text>
<line x1="559" y1="738" x2="919" y2="738" stroke="#5A2028" stroke-width="2"/>
<text x="559" y="768" class="bxs-s">Next cycle builds its predicate</text>
<text x="559" y="796" class="bxs-s">and dies at the splice guard:</text>
<rect x="559" y="810" width="360" height="30" rx="8" fill="#0B1013" stroke="#5A2028" stroke-width="2"/>
<text x="573" y="831" class="code-s" style="fill:#FF8A90">refusing to splice watermark 'S'</text>
<text x="559" y="866" class="bxs-s" style="fill:#FFB84D">Every future run. Wedged.</text>

<!-- C · the defence -->
<rect x="972" y="684" width="416" height="206" rx="16" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="1000" y="722" class="bxt-s" style="font-size:22px">WHAT WE DO</text>
<line x1="1000" y1="738" x2="1360" y2="738" stroke="#2A4A3A" stroke-width="2"/>
<text x="1000" y="770" class="bxs-s">MAX over PLAUSIBLE rows only:</text>
<text x="1000" y="798" class="bxs-s">8 digits · ≥ 19000101 · ≤ today</text>
<text x="1000" y="826" class="bxs-s">Still unspliceable? Keep the</text>
<text x="1000" y="854" class="bxs-s">old value. Forward-only.</text>
<text x="1000" y="880" class="code-s" style="fill:#5E9E7C">sap_hana.py:1167-1223</text>

<!-- D · the policy -->
<rect x="1413" y="684" width="417" height="206" rx="16" fill="#12283F" stroke="#5AA9FF" stroke-width="3"/>
<text x="1441" y="722" class="bxt-s" style="font-size:22px">NO DATE? FULL REFRESH</text>
<line x1="1441" y1="738" x2="1802" y2="738" stroke="#274A6B" stroke-width="2"/>
<text x="1441" y="770" class="bxs-s">27 SAP tables watermark on a</text>
<text x="1441" y="798" class="bxs-s">constant — 25× MANDT, plus</text>
<text x="1441" y="826" class="bxs-s">ZINPUT and DOMNAME. They get</text>
<text x="1441" y="854" class="bxs-s">driver_by_mode {full} instead.</text>
<text x="1441" y="880" class="code-s" style="fill:#8FC4FF">commit cbfa266 · 24/32 tables failed</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The watermark is your bookmark. Better to re-read yesterday's page than to write the bookmark on a page that doesn't exist.</text>
