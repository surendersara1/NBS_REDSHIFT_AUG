<text x="90" y="168" class="title">How Two Jobs Don't Collide</text>
<text x="90" y="212" class="sub">Every source's Step Function ends by calling the same barrier. They can arrive together. Exactly one of them acts.</text>

<text x="468" y="612" class="bxs-s" style="fill:#8FA2AF;font-size:18px">DynamoDB serialises writes to a single item — only one caller can ever find it absent. No queue, no leader election, no timeout to tune.</text>

<!-- ══ ZONE 2 · THE FOUR QUESTIONS ══ -->
<text x="90" y="648" class="cap">2 · WHAT A BARRIER DECIDES, IN THIS ORDER</text>

<rect x="90" y="670" width="1040" height="220" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="114" y="710" class="bxt-s">CONCLUDE A PHASE = RESOLVE THE LATEST STATUS PER TABLE</text>
<line x1="114" y1="726" x2="1106" y2="726" stroke="#2C3841" stroke-width="2"/>

<text x="114" y="756" class="bxt-s" style="fill:#FF3B47;font-size:20px">1</text>
<text x="142" y="756" class="bxs" style="font-size:20px">Has the cycle already concluded?  →  only TERMINAL states no-op (R31).</text>

<text x="114" y="788" class="bxt-s" style="fill:#FF3B47;font-size:20px">2</text>
<text x="142" y="788" class="bxs" style="font-size:20px">Is every expected table terminal?  →  its LATEST run row, by started_at.</text>

<text x="114" y="820" class="bxt-s" style="fill:#FF3B47;font-size:20px">3</text>
<text x="142" y="820" class="bxs" style="font-size:20px">Did it truly reach Bronze?  →  a SUCCEEDED bronze_pull row; chunks ≥ planned.</text>

<text x="114" y="852" class="bxt-s" style="fill:#FF3B47;font-size:20px">4</text>
<text x="142" y="852" class="bxs" style="font-size:20px">Claim the lock, THEN judge  →  any FAILED table = gold_skipped + alert.</text>

<text x="114" y="880" class="code-s" style="fill:#5E7080">coordination.py:598-628 latest_run_by_table · :643-655 tables_missing_bronze</text>

<!-- ══ ZONE 3 · R31 ══ -->
<text x="1180" y="648" class="cap">3 · THE R31 FIX</text>

<rect x="1180" y="670" width="650" height="220" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="1206" y="710" class="bxt-s" style="fill:#FF6A72;font-size:25px">WHY “== running” WAS WRONG</text>
<rect x="1206" y="724" width="598" height="68" rx="8" fill="#0B1013" stroke="#3A1A20" stroke-width="2"/>
<text x="1222" y="750" class="code" xml:space="preserve" style="fill:#FF6A72;font-size:15px">- if cycle.state != "running":  # no-op</text>
<text x="1222" y="776" class="code" xml:space="preserve" style="font-size:15px">+ if cycle.state in CONCLUDED_CYCLE_STATES:</text>
<text x="1206" y="816" class="bxs-s" style="font-size:18px">A cycle ADVANCES: running → download_built →</text>
<text x="1206" y="840" class="bxs-s" style="font-size:18px">transform_built → gold_built. Gating on “running”</text>
<text x="1206" y="864" class="bxs-s" style="fill:#FFB84D;font-size:18px">no-opped every barrier after the download gate.</text>
<text x="1206" y="876" class="code-s" style="fill:#FFA0A6">coordination.py:52-61 · gold_barrier/handler.py:142</text>
