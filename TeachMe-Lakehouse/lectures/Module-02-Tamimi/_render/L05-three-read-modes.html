<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 05</text>
<text x="90" y="168" class="title">Full, Windowed, Backfill</text>
<text x="90" y="212" class="sub">Three read modes chosen by one line — plus the policies that stop a half-loaded table from calling itself done.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · MODE SELECTION ══ -->
<text x="90" y="300" class="cap">1 · MODE SELECTION — THE WHOLE RULE IS ONE LINE</text>

<rect x="90" y="322" width="1740" height="238" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="364" class="bxt-s" style="font-size:24px">PRECEDENCE</text>
<text x="1802" y="364" class="code-s" text-anchor="end" style="fill:#5E7080">glue_engine/jobs/source_download.py:222</text>
<line x1="118" y1="382" x2="1802" y2="382" stroke="#2C3841" stroke-width="2"/>

<rect x="118" y="396" width="1684" height="40" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="138" y="423" class="code" xml:space="preserve">read_mode = "range" if date_from else ("full" if full_snapshot else "incremental")</text>

<!-- chip A · RANGE -->
<rect x="118" y="450" width="540" height="94" rx="12" fill="#161C22" stroke="#4A5A66" stroke-width="2.5"/>
<text x="142" y="482" class="bxt-s" style="font-size:22px">RANGE · a bounded window</text>
<text x="142" y="512" class="bxs-s">--date_from beats --full_snapshot.</text>
<text x="142" y="532" class="bxs-s">read_range(); the watermark never advances.</text>

<!-- chip B · FULL -->
<rect x="690" y="450" width="540" height="94" rx="12" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="714" y="482" class="bxt-s" style="font-size:22px;fill:#FF6A72">FULL · the whole table</text>
<text x="714" y="512" class="bxs-s">--full_snapshot, or DERIVED when the</text>
<text x="714" y="532" class="bxs-s">mapping declares only 'full' (:205-213).</text>

<!-- chip C · INCREMENTAL -->
<rect x="1262" y="450" width="540" height="94" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="1286" y="482" class="bxt-s" style="font-size:22px">INCREMENTAL · the default</text>
<text x="1286" y="512" class="bxs-s">wm_col &gt; stored watermark; returns</text>
<text x="1286" y="532" class="bxs-s">(df, new_wm). Empty keeps the old value.</text>

<!-- ══ ZONE 2 · THE POLICIES ══ -->
<text x="90" y="596" class="cap">2 · THE TWO POLICIES</text>

<!-- policy 1 -->
<rect x="90" y="618" width="560" height="272" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="118" y="660" class="bxt-s" style="font-size:23px;fill:#FF6A72">AN INITIAL LOAD IS FULL</text>
<line x1="118" y1="676" x2="622" y2="676" stroke="#5A2028" stroke-width="2"/>
<text x="118" y="708" class="bxs-s">A full-only mapping never reaches the delta</text>
<text x="118" y="736" class="bxs-s">path: full_snapshot=True, date_from cleared.</text>
<text x="118" y="770" class="bxs-s">It protects the Bronze parity invariant —</text>
<text x="118" y="798" class="bxs-s">Bronze's count MUST equal SAP's, in horizon.</text>
<text x="118" y="834" class="bxs-s" style="fill:#FFB84D">2026-07-16: tvfkt · twewt · twtyt · zzz_mc2t</text>
<text x="118" y="860" class="bxs-s" style="fill:#FFB84D">landed EMPTY from a meaningless window.</text>
<text x="118" y="876" class="code-s" style="fill:#A0666A">source_download.py:205-213 · CLAUDE.md:114</text>

<!-- policy 2 -->
<rect x="690" y="618" width="520" height="272" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="718" y="660" class="bxt-s" style="font-size:23px">AN EMPTY PULL</text>
<line x1="718" y1="676" x2="1182" y2="676" stroke="#2C3841" stroke-width="2"/>
<text x="718" y="708" class="bxs-s" style="fill:#8CE8B8">incremental / backfill → SUCCEED</text>
<text x="718" y="736" class="bxs-s">a quiet window is normal; failing</text>
<text x="718" y="762" class="bxs-s">would break every daily cycle.</text>
<text x="718" y="800" class="bxs-s" style="fill:#FF8A90">full snapshot → FAIL</text>
<text x="718" y="828" class="bxs-s">an empty full extract is almost</text>
<text x="718" y="854" class="bxs-s">always broken. Refuse to land it.</text>
<text x="718" y="876" class="code-s" style="fill:#5E7080">bronze_pull.py:393 · spec on_empty wins</text>
