<text x="1206" y="596" class="bxt" style="fill:#FF6A72;font-size:29px">256 KB · THE HARD EDGE</text>
<line x1="1206" y1="612" x2="1804" y2="612" stroke="#5A2028" stroke-width="2"/>
<text x="1206" y="644" class="bxs-s">StartExecution rejects an input over 262,144 bytes.</text>

<rect x="1206" y="662" width="598" height="90" rx="8" fill="#0B1013" stroke="#3A1A20" stroke-width="2"/>
<text x="1224" y="688" class="code" xml:space="preserve" style="font-size:16px">55 tables x 11 windows  =  605 items</text>
<text x="1224" y="712" class="code" xml:space="preserve" style="font-size:16px">605 items x ~441 bytes  =  266,688 B</text>
<text x="1224" y="738" class="code" xml:space="preserve" style="fill:#FF6A72;font-size:16px">ValidationException     →  started: []</text>

<text x="1206" y="784" class="bxs-s" style="fill:#FFB84D">FIX 1 · slim the item — a P1 item carries no</text>
<text x="1206" y="808" class="bxs-s" style="fill:#FFB84D">Silver keys: ~165 bytes saved on every one.</text>
<text x="1206" y="836" class="bxs-s" style="fill:#8FA2AF;font-size:18px">FIX 2 · widen the chunk: chunk_months 12 → 330 items.</text>
<text x="1206" y="860" class="bxs-s" style="fill:#8FA2AF;font-size:18px">Same 256 KB caps a Map result → ResultPath: null.</text>
<text x="1206" y="876" class="code-s" style="fill:#5E7080">handler.py:426-453 · TICKET-initial-load-sfn-input-size.md</text>
