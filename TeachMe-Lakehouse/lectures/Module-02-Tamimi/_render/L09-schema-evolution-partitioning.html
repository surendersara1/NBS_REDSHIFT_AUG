<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 09</text>
<text x="90" y="168" class="title">Changing a Table Without Breaking It</text>
<text x="90" y="212" class="sub">Adding a column is a metadata edit. Dropping, renaming or re-typing one stops a build — on purpose.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · SAFE vs BREAKING ══ -->
<text x="90" y="300" class="cap">1 · WHAT'S SAFE, WHAT BREAKS</text>

<rect x="90" y="322" width="420" height="280" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="364" class="bxt-s">ADDITIVE — SAFE</text>
<line x1="118" y1="382" x2="482" y2="382" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="416" class="bxs-s">· Add a column at the END</text>
<text x="118" y="444" class="bxs-s">· Iceberg assigns it a new field</text>
<text x="118" y="472" class="bxs-s">  id; old files stay valid</text>
<text x="118" y="500" class="bxs-s">· Old rows read back NULL, so</text>
<text x="118" y="528" class="bxs-s">  backfill before anyone reads it</text>
<text x="118" y="570" class="code-s" style="fill:#5E7080">metadata-only — no data rewritten</text>

<rect x="540" y="322" width="420" height="280" rx="16" fill="#1A1E15" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="568" y="364" class="bxt-s" style="fill:#FFB84D">NON-ADDITIVE — BREAKS</text>
<line x1="568" y1="382" x2="932" y2="382" stroke="#4A431F" stroke-width="2"/>
<text x="568" y="416" class="bxs-s">· Drop or rename a column</text>
<text x="568" y="444" class="bxs-s">· Narrow or re-type one</text>
<text x="568" y="472" class="bxs-s">· Reorder the written frame</text>
<text x="568" y="500" class="bxs-s">· Edit a partition spec and</text>
<text x="568" y="528" class="bxs-s">  expect old data to move</text>
<text x="568" y="570" class="code-s" style="fill:#5E7080">every one of these has bitten us</text>

<!-- ══ ZONE 2 · THE GUARDS ══ -->
<text x="1010" y="300" class="cap">2 · THE THREE GUARDS</text>

<rect x="1010" y="322" width="820" height="88" rx="12" fill="#2A1216" stroke="#E3000E" stroke-width="2.5"/>
<text x="1036" y="356" class="bxt-s" style="fill:#FF6A72;font-size:24px">dbt · on_schema_change: fail</text>
<text x="1036" y="382" class="bxs-s">A new or missing column stops the Gold build instead of being absorbed.</text>
<text x="1036" y="397" class="code-s" style="fill:#5E7080">src/dbt/dbt_project.yml:91 · unified_customer_count.sql:31</text>

<rect x="1010" y="418" width="820" height="88" rx="12" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1036" y="452" class="bxt-s" style="font-size:24px">engine · merge-schema, full rewrites only</text>
<text x="1036" y="478" class="bxs-s">Only full_refresh and create_or_replace evolve; partial writes never do.</text>
<text x="1036" y="493" class="code-s" style="fill:#5E7080">writers/s3_tables.py:337-345, 353-356 · risks.md R54</text>

<rect x="1010" y="514" width="820" height="88" rx="12" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1036" y="548" class="bxt-s" style="font-size:24px">engine · _guard_non_additive_drift</text>
<text x="1036" y="574" class="bxs-s">A rebuild that would DROP a live column is refused by name, not by arity.</text>
<text x="1036" y="589" class="code-s" style="fill:#5E7080">writers/s3_tables.py:297-324</text>

<!-- ══ ZONE 3 · TWO LATE TRAPS ══ -->
<text x="90" y="640" class="cap">3 · TWO TRAPS THAT ONLY SHOW UP ON THE SECOND RUN</text>

<rect x="90" y="662" width="1080" height="226" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="118" y="704" class="bxt-s" style="fill:#FF6A72">cc was BIGINT on Monday, NUMERIC on Tuesday</text>
<line x1="118" y1="720" x2="1142" y2="720" stroke="#5A2028" stroke-width="2"/>
<text x="118" y="752" class="bxs-s">unified_customer_count unions three legs. The actuals legs' raw cc is BIGINT; the budget</text>
<text x="118" y="780" class="bxs-s">leg is SUM(cc_budget), which is fractional. A first build with only actuals materialises</text>
<text x="118" y="808" class="bxs-s">BIGINT — the next run widens it, on_schema_change='fail' trips, Gold needs --full-refresh.</text>
<rect x="118" y="820" width="1024" height="40" rx="8" fill="#0B1013" stroke="#3A1A1E" stroke-width="2"/>
<text x="136" y="846" class="code">CAST(cc AS NUMERIC(38,4))   -- in EVERY leg, so the type can never drift</text>
<text x="118" y="878" class="code-s" style="fill:#5E7080">models/marts/gold/unified_customer_count.sql:36-42, 47, 58, 79 · audit M-28</text>

<rect x="1210" y="662" width="620" height="226" rx="16" fill="#1A1E15" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1238" y="704" class="bxt-s" style="fill:#FFB84D">Partitioning is create-only</text>
<line x1="1238" y1="720" x2="1802" y2="720" stroke="#4A431F" stroke-width="2"/>
<text x="1238" y="752" class="bxs-s">partition_by is consulted ONLY on the</text>
<text x="1238" y="780" class="bxs-s">first write, when the CREATE TABLE is</text>
<text x="1238" y="808" class="bxs-s">issued. Later writes inherit the layout —</text>
<text x="1238" y="836" class="bxs-s">editing the YAML changes nothing.</text>
<text x="1238" y="878" class="code-s" style="fill:#5E7080">writers/s3_tables.py:116-117, 165-172</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Adding a field to a payload breaks nobody. Renaming one breaks every caller — so we stop the build rather than let it guess.</text>
