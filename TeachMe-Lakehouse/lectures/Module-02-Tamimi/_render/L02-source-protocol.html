<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 02</text>
<text x="90" y="168" class="title">The Engine Doesn't Know What SAP Is</text>
<text x="90" y="212" class="sub">It knows five method names. Everything SAP-shaped hides behind them — so the next source is a new class, not a new pipeline.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE CONTRACT ══ -->
<text x="90" y="300" class="cap">1 · THE CONTRACT — FIVE METHODS</text>

<rect x="90" y="322" width="680" height="468" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<rect x="118" y="348" width="624" height="58" rx="8" fill="#0B1013" stroke="#5A2028" stroke-width="2"/>
<text x="136" y="372" class="code" style="fill:#FFA0A6">@runtime_checkable</text>
<text x="136" y="396" class="code" style="fill:#FFA0A6">class SourceConnector(Protocol):</text>

<text x="118" y="440" class="code">configure(source_row, spec)</text>
<text x="140" y="468" class="bxs-s" style="fill:#B7C6CF">creds, endpoint, spec validation — once per run</text>

<text x="118" y="508" class="code">read_full(spark, run_id)</text>
<text x="140" y="536" class="bxs-s" style="fill:#B7C6CF">every row in scope. Returns a DataFrame.</text>

<text x="118" y="576" class="code">read_incremental(spark, wm, run_id)</text>
<text x="140" y="604" class="bxs-s" style="fill:#B7C6CF">rows since wm. Returns (df, new_wm).</text>

<text x="118" y="644" class="code">read_range(spark, from, to, run_id)</text>
<text x="140" y="672" class="bxs-s" style="fill:#B7C6CF">one bounded window. Can't? Raise NotImplementedError.</text>

<text x="118" y="712" class="code">emit_metrics()</text>
<text x="140" y="740" class="bxs-s" style="fill:#B7C6CF">rows_read · retries · rows_with_errors → runs.metrics</text>

<line x1="118" y1="756" x2="742" y2="756" stroke="#5A2028" stroke-width="2"/>
<text x="118" y="780" class="bxs-s" style="fill:#FFB84D">The connector NEVER writes the watermark — it RETURNS it.</text>

<!-- ══ ZONE 2 · THE REGISTRY ══ -->
<text x="810" y="300" class="cap">2 · THE REGISTRY</text>

<rect x="810" y="322" width="560" height="468" rx="16" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<rect x="838" y="348" width="504" height="82" rx="8" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="856" y="372" class="code" style="fill:#6FD8A8">_REGISTRY: dict[str, type] = {}</text>
<text x="856" y="396" class="code" style="fill:#6FD8A8">@register("sap_hana")</text>
<text x="856" y="420" class="code" style="fill:#6FD8A8">class SapHanaConnector: ...</text>

<text x="838" y="464" class="bxs-s">Import-time side effect. Four classes,</text>
<text x="838" y="492" class="bxs-s">four names, one dict:</text>

<rect x="838" y="510" width="504" height="150" rx="8" fill="#0E2417" stroke="#2A4A3A" stroke-width="2"/>
<text x="858" y="540" class="code" style="fill:#8CE8B8">sap_hana</text>
<text x="1120" y="540" class="code-s" style="fill:#5E9E7C">sources/sap_hana.py:158</text>
<text x="858" y="574" class="code" style="fill:#8CE8B8">rds_jdbc</text>
<text x="1120" y="574" class="code-s" style="fill:#5E9E7C">sources/rds_jdbc.py:78</text>
<text x="858" y="608" class="code" style="fill:#8CE8B8">excel_landing</text>
<text x="1120" y="608" class="code-s" style="fill:#5E9E7C">excel_landing.py:42</text>
<text x="858" y="642" class="code" style="fill:#8CE8B8">s3_landing</text>
<text x="1120" y="642" class="code-s" style="fill:#5E9E7C">landed_files.py:75</text>

<text x="838" y="694" class="bxs-s">Register a name twice and it REFUSES.</text>
<text x="838" y="722" class="bxs-s">Ask for a name it doesn't have and the</text>
<text x="838" y="750" class="bxs-s">KeyError lists everything it does.</text>
<text x="838" y="780" class="code-s" style="fill:#6FD8A8">sources/__init__.py:21-51</text>

<!-- ══ ZONE 3 · DRIVER BY MODE ══ -->
<text x="1410" y="300" class="cap">3 · DRIVER BY MODE</text>

<rect x="1410" y="322" width="420" height="468" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1438" y="364" class="bxt-s" style="font-size:23px">WHICH CLASS, PER MODE</text>
<line x1="1438" y1="382" x2="1802" y2="382" stroke="#2C3841" stroke-width="2"/>
<text x="1438" y="414" class="bxs-s">The table's mapping row can pick a</text>
<text x="1438" y="442" class="bxs-s">different connector per read-mode:</text>

<rect x="1438" y="460" width="364" height="118" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="1458" y="486" class="code" xml:space="preserve">driver_by_mode:</text>
<text x="1458" y="510" class="code" xml:space="preserve">  full:        sap_hana</text>
<text x="1458" y="534" class="code" xml:space="preserve">  range:       sap_hana</text>
<text x="1458" y="558" class="code" xml:space="preserve">  incremental: sap_hana</text>

<text x="1438" y="608" class="bxs-s">No entry? Fall back to the spec's own</text>
<text x="1438" y="636" class="bxs-s">source_type — that's every non-SAP</text>
<text x="1438" y="664" class="bxs-s">table, unchanged.</text>
<text x="1438" y="704" class="bxs-s" style="fill:#FFB84D">All three read sap_hana since the</text>
<text x="1438" y="732" class="bxs-s" style="fill:#FFB84D">ODP/CDC path was retired 2026-07-22.</text>
<text x="1438" y="780" class="code-s" style="fill:#5E7080">driver_select.py:18-34</text>

<!-- ══ THE POINT ══ -->
<rect x="90" y="812" width="1740" height="78" rx="14" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="122" y="861" class="plainb" style="fill:#FF6A72">THE POINT</text>
<text x="292" y="861" class="plain">A new source is a new CLASS, not a new PIPELINE. Oracle for Apparel Group = one file, one @register, one DDB row — zero engine edits.</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">It's a plug socket. The engine holds the socket and knows only its shape; SAP, NCR and a spreadsheet are just different plugs.</text>
