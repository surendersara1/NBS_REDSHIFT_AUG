  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF3B47"/></marker>

<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 20</text>
<text x="90" y="168" class="title">How Code Reaches Production</text>
<text x="90" y="212" class="sub">There is no AWS access key anywhere in this pipeline. There is a signed badge, a one-hour pass, and a human on the Prod gate.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · IDENTITY ══ -->
<text x="90" y="300" class="cap">1 · IDENTITY — NO STATIC KEYS, EVER</text>

<!-- b1 -->
<rect x="90" y="322" width="280" height="180" rx="16" fill="#1B2A33" stroke="#3A5766" stroke-width="3"/>
<text x="230" y="364" class="bxt-s" text-anchor="middle" style="font-size:22px">BITBUCKET</text>
<text x="230" y="390" class="bxs-s" text-anchor="middle" style="font-size:18px">the pipeline step</text>
<line x1="118" y1="406" x2="342" y2="406" stroke="#2C3841" stroke-width="2"/>
<text x="230" y="434" class="code" text-anchor="middle">oidc: true</text>
<text x="230" y="460" class="bxs-s" text-anchor="middle" style="font-size:18px">mints a fresh JWT</text>
<text x="230" y="484" class="bxs-s" text-anchor="middle" style="font-size:18px">for THIS step only</text>

<line x1="374" y1="412" x2="400" y2="412" stroke="#FF3B47" stroke-width="4" marker-end="url(#ar)"/>

<!-- b2 -->
<rect x="404" y="322" width="280" height="180" rx="16" fill="#1B2A33" stroke="#3A5766" stroke-width="3"/>
<text x="544" y="364" class="bxt-s" text-anchor="middle" style="font-size:22px">TOKEN ON DISK</text>
<text x="544" y="390" class="bxs-s" text-anchor="middle" style="font-size:18px">not a credential</text>
<line x1="432" y1="406" x2="656" y2="406" stroke="#2C3841" stroke-width="2"/>
<text x="544" y="434" class="code" text-anchor="middle">AWS_WEB_IDENTITY_</text>
<text x="544" y="456" class="code" text-anchor="middle">TOKEN_FILE</text>
<text x="544" y="484" class="bxs-s" text-anchor="middle" style="font-size:18px">written, used, gone</text>

<line x1="688" y1="412" x2="714" y2="412" stroke="#FF3B47" stroke-width="4" marker-end="url(#ar)"/>

<!-- b3 -->
<rect x="718" y="322" width="280" height="180" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="858" y="364" class="bxt-s" text-anchor="middle" style="fill:#FF6A72;font-size:22px">AWS STS</text>
<text x="858" y="390" class="bxs-s" text-anchor="middle" style="font-size:18px">swaps badge for pass</text>
<line x1="746" y1="406" x2="970" y2="406" stroke="#5A2028" stroke-width="2"/>
<text x="858" y="434" class="code" text-anchor="middle" style="fill:#FFA0A6">AssumeRoleWith</text>
<text x="858" y="456" class="code" text-anchor="middle" style="fill:#FFA0A6">WebIdentity</text>
<text x="858" y="484" class="bxs-s" text-anchor="middle" style="font-size:18px">3600 s, then expired</text>

<!-- strip -->
<rect x="90" y="516" width="908" height="96" rx="10" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="112" y="546" class="code" xml:space="preserve">Trust:  sub = "{repo-uuid}:&lt;branch&gt;:*"   ·   aud = workspace ARI</text>
<text x="112" y="572" class="code" xml:space="preserve">Roles:  AWS_ROLE_DEV_ARN · AWS_ROLE_QA_ARN · AWS_ROLE_PROD_ARN</text>
<text x="112" y="600" class="bxs-s" style="fill:#FFB84D">Trap: locals.tf:24 pins dev to "main" — the pipeline deploys Dev from develop.</text>

<!-- ══ ZONE 2 · BRANCH MAP ══ -->
<text x="1040" y="300" class="cap">2 · THE BRANCH DECIDES THE ACCOUNT</text>

<rect x="1040" y="322" width="790" height="290" rx="16" fill="#1A2430" stroke="#4A6A8A" stroke-width="3"/>
<text x="1068" y="366" class="bxt-s" style="fill:#7FBEFF">ONE PIPELINE PER BRANCH</text>
<line x1="1068" y1="384" x2="1802" y2="384" stroke="#2E4A63" stroke-width="2"/>
<text x="1068" y="416" class="bxs-s">Bitbucket picks the pipeline from the branch name;</text>
<text x="1068" y="442" class="bxs-s">the pipeline picks which role ARN to assume.</text>

<rect x="1068" y="458" width="734" height="140" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="1088" y="484" class="code" xml:space="preserve" style="fill:#8296A3">pull-requests  →  lint · mypy · pytest · tf validate</text>
<text x="1088" y="510" class="code" xml:space="preserve" style="fill:#8FD8F0">develop        →  DEV    apply  (auto)</text>
<text x="1088" y="536" class="code" xml:space="preserve" style="fill:#FFB84D">release/*      →  QA     apply  ← MANUAL</text>
<text x="1088" y="562" class="code" xml:space="preserve" style="fill:#FFB84D">main           →  PROD   apply  ← MANUAL</text>
<text x="1088" y="588" class="code" xml:space="preserve" style="fill:#FFB84D">prod-deploy    →  PROD   apply  ← MANUAL</text>

<!-- ══ ZONE 3 · THE GATES ══ -->
<text x="90" y="652" class="cap">3 · WHAT THE PIPELINE REFUSES TO DO</text>

<rect x="90" y="674" width="560" height="214" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="716" class="bxt-s">NO UNATTENDED PROD</text>
<line x1="118" y1="732" x2="622" y2="732" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="762" class="bxs-s">QA and Prod applies sit and wait for a</text>
<text x="118" y="788" class="bxs-s">person to click. Only Dev is automatic.</text>
<rect x="118" y="802" width="504" height="58" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="138" y="826" class="code" xml:space="preserve">trigger: manual</text>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#FFB84D">deployment: production</text>
<text x="118" y="878" class="code-s" style="fill:#5E7080">bitbucket-pipelines.yml:424, 492-495, 692</text>

<rect x="690" y="674" width="560" height="214" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="718" y="716" class="bxt-s">APPLY THE PLAN YOU READ</text>
<line x1="718" y1="732" x2="1222" y2="732" stroke="#2C3841" stroke-width="2"/>
<text x="718" y="762" class="bxs-s">A saved plan fails closed if state moved.</text>
<text x="718" y="788" class="bxs-s">-auto-approve rubber-stamps a fresh one.</text>
<rect x="718" y="802" width="504" height="58" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="738" y="826" class="code" xml:space="preserve">plan -out=/tmp/prod-full.tfplan</text>
<text x="738" y="848" class="code" xml:space="preserve" style="fill:#FFB84D">apply /tmp/prod-full.tfplan</text>
<text x="718" y="878" class="code-s" style="fill:#5E7080">bitbucket-pipelines.yml:569-571 (HIGH-11)</text>

<rect x="1290" y="674" width="540" height="214" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1318" y="716" class="bxt-s">PIN THE SUPPLY CHAIN</text>
<line x1="1318" y1="732" x2="1802" y2="732" stroke="#2C3841" stroke-width="2"/>
<text x="1318" y="762" class="bxs-s">Nothing unversioned lands on a runner</text>
<text x="1318" y="788" class="bxs-s">that is holding cloud credentials.</text>
<rect x="1318" y="802" width="484" height="58" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="1338" y="826" class="code" xml:space="preserve">sha256 ngdbc-2.20.11.jar</text>
<text x="1338" y="848" class="code" xml:space="preserve" style="fill:#FFB84D">uv==0.10.0 pydantic==2.13.4</text>
<text x="1318" y="878" class="code-s" style="fill:#5E7080">bitbucket-pipelines.yml:201-203 (HIGH-18)</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">CI holds no password. It shows AWS a signed badge, gets a one-hour pass to one account — and Prod still waits for a human.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 20</text>
