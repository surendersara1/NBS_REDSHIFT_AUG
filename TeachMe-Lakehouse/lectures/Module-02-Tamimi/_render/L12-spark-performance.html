<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 12</text>
<text x="90" y="168" class="title">Partitions, Shuffles, Skew, Cache</text>
<text x="90" y="212" class="sub">Four levers that decide whether a Glue job finishes in twenty minutes or dies at the 120-minute timeout.</text>

<!-- ══ ZONE 1 · CACHE ══ -->
<text x="90" y="300" class="cap">1 · ONE PULL, THREE ACTIONS</text>
<rect x="90" y="322" width="820" height="258" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="362" class="bxt-s">EVERY ACTION RE-EXECUTES THE READ</text>

<!-- ══ ZONE 2 · PARTITIONS ══ -->
<text x="950" y="300" class="cap">2 · SPLIT THE READ, OR IT TIMES OUT</text>
<rect x="950" y="322" width="880" height="258" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="978" y="362" class="bxt-s">ONE CONNECTION IS NOT A PLAN</text>
<line x1="978" y1="376" x2="1802" y2="376" stroke="#2C3841" stroke-width="2"/>
<rect x="978" y="386" width="824" height="84" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="996" y="410" class="code" xml:space="preserve">jdbc_hash_partitions: "8"      specs/download/sap_zhocidc.yaml</text>
<text x="996" y="434" class="code" xml:space="preserve" style="fill:#7FB6EF">preds = ['"BUDAT" BETWEEN …', …]   # one JDBC connection each</text>
<text x="996" y="458" class="code" xml:space="preserve">self._read(spark, query, run_id, tag, predicates=preds)</text>
<text x="978" y="494" class="bxs-s">R45 · the daily zhocidc delta ran on ONE connection: four consecutive Glue</text>
<text x="978" y="518" class="bxs-s">runs blew the 120-minute timeout and the cycle never reached its barrier.</text>
<text x="978" y="542" class="bxs-s" style="fill:#FFB84D">More is not better — MBEW at 16 saturated HANA; tuned to 4 (≈9M rows each).</text>
<text x="978" y="568" class="code-s" style="fill:#5E7080">sap_hana.py:800-833 · specs/download/sap_mbew.yaml:33-36</text>

<!-- ══ ZONE 3 · SHUFFLE + SKEW ══ -->
<text x="90" y="612" class="cap">3 · WHAT applyInPandas ACTUALLY COSTS</text>

<rect x="90" y="634" width="820" height="256" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="678" class="bxt-s">THE SHUFFLE YOU ASKED FOR</text>
<line x1="118" y1="694" x2="882" y2="694" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="726" class="bxs-s">groupBy(werks, zdate, zptno, zreceipt) moves EVERY ZHOCIDC row across</text>
<text x="118" y="754" class="bxs-s">the network, so one receipt's rows land together on one partition.</text>
<text x="118" y="782" class="bxs-s">applyInPandas then materialises each group as a pandas DataFrame in a</text>
<text x="118" y="810" class="bxs-s">Python worker — the whole group in memory, serialised both ways.</text>
<text x="118" y="838" class="bxs-s">That is the price of ordered logic. Pay it once, on the smallest key.</text>
<text x="118" y="878" class="code-s" style="fill:#5E7080">src/glue/glue_engine/abap/ops.py:86</text>

<rect x="950" y="634" width="880" height="256" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="978" y="678" class="bxt-s" style="fill:#FF6A72">SKEW, AND THE SECOND CACHE</text>
<line x1="978" y1="694" x2="1802" y2="694" stroke="#5A2028" stroke-width="2"/>
<text x="978" y="726" class="bxs-s">A stage ends when its SLOWEST partition ends. One store-day with 10× the</text>
<text x="978" y="754" class="bxs-s">receipts holds the whole stage — that is skew, and no config setting fixes it.</text>
<text x="978" y="782" class="bxs-s">folded.cache() exists because folded is consumed TWICE: once filtered to</text>
<text x="978" y="810" class="bxs-s">_kind='H', once to _kind='I'. Without it the entire fold runs twice.</text>
<text x="978" y="844" class="bxs-s" style="fill:#FFB84D">Rule of thumb: persist any DataFrame you read more than once.</text>
<text x="978" y="878" class="code-s" style="fill:#FFA0A6">src/glue/glue_engine/abap/ops.py:87-91</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A Spark job costs whatever its slowest slice costs. Read once, cut the work into even pieces, and never make the database do the same job three times.</text>
