<text x="90" y="474" class="cap">2 · WORKED ONCE — ORACLE RETAIL RMS · ITEM_MASTER</text>

<!-- panel A -->
<rect x="90" y="488" width="560" height="312" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="524" class="bxt-s" style="font-size:24px">STEP 2 · THE DOWNLOAD SPEC</text>

<rect x="106" y="568" width="528" height="222" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="118" y="592" class="code" xml:space="preserve">table: rms.item_master</text>
<text x="118" y="609" class="code" xml:space="preserve">source_type: rds_jdbc</text>
<text x="118" y="630" class="code" xml:space="preserve">source_config:</text>
<text x="118" y="651" class="code" xml:space="preserve">  jdbc_schema: RMS</text>
<text x="118" y="672" class="code" xml:space="preserve">  jdbc_table: ITEM_MASTER</text>
<text x="118" y="693" class="code" xml:space="preserve" style="fill:#FFB84D">  watermark_column: LAST_UPDATE_DATETIME</text>
<text x="118" y="714" class="code" xml:space="preserve">  jdbc_hash_field: ITEM</text>
<text x="118" y="735" class="code" xml:space="preserve">  jdbc_hash_partitions: "8"</text>
<text x="118" y="756" class="code" xml:space="preserve">landing_prefix: "rms/rms.item_master"</text>
<text x="118" y="777" class="code" xml:space="preserve">schema: [ITEM, ITEM_DESC, DEPT, CLASS, ...]</text>

<rect x="680" y="488" width="560" height="312" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>

<rect x="696" y="568" width="528" height="222" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="708" y="592" class="code" xml:space="preserve">table: rms.item_master</text>
<text x="708" y="609" class="code" xml:space="preserve">source_type: s3_landing</text>
<text x="708" y="630" class="code" xml:space="preserve" style="fill:#FFB84D">merge_key: [ITEM]      # the VERIFIED PK</text>
<text x="708" y="651" class="code" xml:space="preserve">schema: (mirrors the download spec)</text>
<text x="708" y="672" class="code" xml:space="preserve" style="fill:#5E7080">- - - - - - - - - - - - - - - - - - - - -</text>
<text x="708" y="693" class="code" xml:space="preserve">- name: rms.item_master</text>
<text x="708" y="714" class="code" xml:space="preserve">  source: rms</text>
<text x="708" y="735" class="code" xml:space="preserve">  bronze_spec: bronze/rms_item_master.yaml</text>
<text x="708" y="756" class="code" xml:space="preserve">  download_spec: download/rms_item_mas...</text>
<text x="708" y="777" class="code" xml:space="preserve" style="fill:#FFB84D">  driver_by_mode: { full: rds_jdbc, ... }</text>

<rect x="1270" y="488" width="560" height="312" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>

<rect x="1286" y="568" width="528" height="222" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="1298" y="592" class="code" xml:space="preserve">-- stg_rms_item_master.sql</text>
<text x="1298" y="609" class="code" xml:space="preserve">{{ config(materialized='view') }}</text>
<text x="1298" y="630" class="code" xml:space="preserve">SELECT item      AS item_id,</text>
<text x="1298" y="651" class="code" xml:space="preserve">       item_desc AS item_name,</text>
<text x="1298" y="672" class="code" xml:space="preserve">       dept, class, subclass</text>
<text x="1298" y="693" class="code" xml:space="preserve">FROM {{ source('silver','rms_item_master') }}</text>
<text x="1298" y="714" class="code" xml:space="preserve" style="fill:#5E7080">- - - - - - - - - - - - - - - - - - - - -</text>
<text x="1298" y="735" class="code" xml:space="preserve">- name: item_id           # _staging.yml</text>
<text x="1298" y="756" class="code" xml:space="preserve" style="fill:#FFB84D">  tests: [not_null, unique]</text>
<text x="1298" y="777" class="code" xml:space="preserve" style="fill:#5E7080"># Silver, Gold and Power BI never noticed.</text>
