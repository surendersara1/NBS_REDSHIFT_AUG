<!-- ── runs ── -->
<rect x="90" y="322" width="405" height="368" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="90" y="322" width="405" height="7" rx="3.5" fill="#E3000E"/>
<text x="114" y="370" class="bxt" style="font-size:28px">runs</text>
<text x="114" y="402" class="bxs" style="fill:#FFB84D;font-size:20px">“What happened?”</text>
<line x1="114" y1="418" x2="471" y2="418" stroke="#2C3841" stroke-width="2"/>
<text x="114" y="446" class="code" style="font-size:16px">run_id (HASH) + stage (RANGE)</text>
<text x="114" y="480" class="bxs-s" style="font-size:18px">One row PER STAGE, all sharing one</text>
<text x="114" y="506" class="bxs-s" style="font-size:18px">run_id — never overwritten as the</text>
<text x="114" y="532" class="bxs-s" style="font-size:18px">table advances. TTL 90 days.</text>
<text x="114" y="560" class="code-s">GSI by_table → one table's history</text>
<text x="114" y="584" class="code-s">GSI by_cycle → one whole cycle</text>
<line x1="114" y1="602" x2="471" y2="602" stroke="#2C3841" stroke-width="2"/>
<text x="114" y="626" class="bxs-s" style="fill:#7FBEFF;font-size:17px">WRITE  every Glue job, per stage</text>
<text x="114" y="652" class="bxs-s" style="fill:#6FD8A8;font-size:17px">READ   every barrier + the sweeper</text>
<text x="114" y="680" class="code-s" style="fill:#5E7080">control_plane/runs.py:54-104</text>

<!-- ── watermarks ── -->
<rect x="535" y="322" width="405" height="368" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="535" y="322" width="405" height="7" rx="3.5" fill="#E3000E"/>
<text x="559" y="370" class="bxt" style="font-size:28px">watermarks</text>
<text x="559" y="402" class="bxs" style="fill:#FFB84D;font-size:20px">“How far did we get?”</text>
<line x1="559" y1="418" x2="916" y2="418" stroke="#2C3841" stroke-width="2"/>
<text x="559" y="446" class="code" style="font-size:16px">source_id (HASH) + table_name</text>
<text x="559" y="480" class="bxs-s" style="font-size:18px">last_watermark_value is the generic</text>
<text x="559" y="506" class="bxs-s" style="font-size:18px">position; a SAP hybrid also keeps a</text>
<text x="559" y="532" class="bxs-s" style="font-size:18px">JDBC date AND an ODP delta token.</text>
<text x="559" y="560" class="code-s">init_state pending → initial_loaded</text>
<text x="559" y="584" class="code-s" xml:space="preserve">           → cdc → needs_reinit</text>
<line x1="559" y1="602" x2="916" y2="602" stroke="#2C3841" stroke-width="2"/>
<text x="559" y="626" class="bxs-s" style="fill:#7FBEFF;font-size:17px">WRITE  the connector, on success</text>
<text x="559" y="652" class="bxs-s" style="fill:#6FD8A8;font-size:17px">READ   Gate 0, then the next CDC</text>
<text x="559" y="680" class="code-s" style="fill:#5E7080">control_plane/watermarks.py:30-93</text>

<!-- ── pipeline-state ── -->
<rect x="980" y="322" width="405" height="368" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="980" y="322" width="405" height="7" rx="3.5" fill="#E3000E"/>
<text x="1004" y="370" class="bxt" style="font-size:28px">pipeline-state</text>
<text x="1004" y="402" class="bxs" style="fill:#FFB84D;font-size:20px">“Is it healthy right now?”</text>
<line x1="1004" y1="418" x2="1361" y2="418" stroke="#2C3841" stroke-width="2"/>
<text x="1004" y="446" class="code" style="font-size:16px">pipeline_id = '&lt;kind&gt;:&lt;id&gt;'</text>
<text x="1004" y="480" class="bxs-s" style="font-size:18px">One table, four widgets. Pydantic</text>
<text x="1004" y="506" class="bxs-s" style="font-size:18px">picks the payload off state.kind, so</text>
<text x="1004" y="532" class="bxs-s" style="font-size:18px">each kind keeps its own schema.</text>
<text x="1004" y="560" class="code-s">pipeline: · alarm: · freshness:</text>
<text x="1004" y="584" class="code-s">reconciliation: drift vs threshold</text>
<line x1="1004" y1="602" x2="1361" y2="602" stroke="#2C3841" stroke-width="2"/>
<text x="1004" y="626" class="bxs-s" style="fill:#7FBEFF;font-size:17px">WRITE  jobs + the recon harness</text>
<text x="1004" y="652" class="bxs-s" style="fill:#6FD8A8;font-size:17px">READ   dashboard (stream NEW_IMAGE)</text>
<text x="1004" y="680" class="code-s" style="fill:#5E7080">control_plane/pipeline_state.py:83</text>

<!-- ── lineage_edges ── -->
<rect x="1425" y="322" width="405" height="368" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<rect x="1425" y="322" width="405" height="7" rx="3.5" fill="#E3000E"/>
<text x="1449" y="370" class="bxt" style="font-size:28px">lineage_edges</text>
<text x="1449" y="402" class="bxs" style="fill:#FFB84D;font-size:20px">“What came from what?”</text>
<line x1="1449" y1="418" x2="1806" y2="418" stroke="#2C3841" stroke-width="2"/>
<text x="1449" y="446" class="code" style="font-size:16px">edge_id = up|down|edge_type</text>
<text x="1449" y="480" class="bxs-s" style="font-size:18px">The id is deterministic, so re-emitting</text>
<text x="1449" y="506" class="bxs-s" style="font-size:18px">an edge overwrites it — the DAG can</text>
<text x="1449" y="532" class="bxs-s" style="font-size:18px">never grow duplicates.</text>
<text x="1449" y="560" class="code-s">source_to_bronze · bronze_to_silver</text>
<text x="1449" y="584" class="code-s" xml:space="preserve">silver_to_gold   · gold_to_view</text>
<line x1="1449" y1="602" x2="1806" y2="602" stroke="#2C3841" stroke-width="2"/>
<text x="1449" y="626" class="bxs-s" style="fill:#7FBEFF;font-size:17px">WRITE  each transform, at the end</text>
<text x="1449" y="652" class="bxs-s" style="fill:#6FD8A8;font-size:17px">READ   impact analysis · lineage UI</text>
<text x="1449" y="680" class="code-s" style="fill:#5E7080">control_plane/lineage_edges.py:21-59</text>

<!-- ══ ZONE 2 · THE OPS SURFACE ══ -->
<text x="90" y="726" class="cap">2 · THIS IS WHAT THE OPS CONSOLE READS — AND WHAT YOU TYPE AT 3 AM</text>

<rect x="90" y="748" width="1150" height="142" rx="16" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="114" y="788" class="bxt-s" style="fill:#6FE0A6;font-size:24px">EVERY OPERATOR QUESTION IS A DYNAMODB READ</text>
<text x="114" y="822" class="code" xml:space="preserve" style="fill:#6FD8A8;font-size:17px">runs-dev         index by_cycle, cycle_id = 2026-08-10   → per-table status + error_message</text>
<text x="114" y="848" class="code" xml:space="preserve" style="fill:#6FD8A8;font-size:17px">coordination-dev cycle#2026-08-10                        → gold_built | gold_skipped | running</text>
<text x="114" y="878" class="bxs-s" style="fill:#FFB84D;font-size:18px">Never infer success from a Step Functions status — a P1 execution can read SUCCEEDED over failed chunks (R34).</text>

<rect x="1290" y="748" width="540" height="142" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1314" y="788" class="bxt-s" style="font-size:24px">THE OTHER THREE</text>
<text x="1314" y="822" class="bxs-s" style="font-size:18px">coordination — the cycle manifest and</text>
<text x="1314" y="848" class="bxs-s" style="font-size:18px">the single-flight locks (that's L16).</text>
<text x="1314" y="876" class="bxs-s" style="fill:#8FA2AF;font-size:18px">bronze-mapping + source-catalog = config.</text>
