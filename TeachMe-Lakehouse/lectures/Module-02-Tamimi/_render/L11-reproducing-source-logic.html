<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 11</text>
<text x="90" y="168" class="title">Porting ABAP Faithfully</text>
<text x="90" y="212" class="sub">Three ported functions, three kinds of fidelity — a data-driven rate, a derived rule, and an off-by-one we kept on purpose.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · VAT ══ -->
<text x="90" y="300" class="cap">1 · A RATE THAT IS DATA</text>
<rect x="90" y="322" width="560" height="368" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="366" class="bxt-s">vat_split()</text>
<text x="118" y="394" class="bxs-s" style="fill:#8FA2AF">ZMM_GET_RETAIL_WITH_TAX, operation 'M'</text>
<line x1="118" y1="410" x2="622" y2="410" stroke="#2C3841" stroke-width="2"/>
<rect x="118" y="422" width="504" height="112" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="136" y="448" class="code" xml:space="preserve" style="fill:#8FA2AF"># TAKLV = 0  ->  exempt item</text>
<text x="136" y="472" class="code" xml:space="preserve">if exempt or tax_percent == 0:</text>
<text x="136" y="496" class="code" xml:space="preserve" style="fill:#FFB84D">    return (incl, 0.0)</text>
<text x="136" y="520" class="code" xml:space="preserve">excl = incl / (1.0 + tax_percent)</text>
<text x="118" y="566" class="bxs-s">TAKLV = 0 means EXEMPT. A flat /1.15</text>
<text x="118" y="592" class="bxs-s">invents tax SAP never charged.</text>
<text x="118" y="618" class="bxs-s">The rate itself is data — A078/KONP</text>
<text x="118" y="644" class="bxs-s">MWST, keyed by country and date.</text>
<text x="118" y="678" class="code-s" style="fill:#5E7080">src/glue/glue_engine/abap/helpers.py:144-154</text>

<!-- ══ ZONE 2 · STORE TYPE ══ -->
<text x="680" y="300" class="cap">2 · A RULE, NOT A LOOKUP</text>
<rect x="680" y="322" width="560" height="368" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="708" y="366" class="bxt-s">resolve_store_type()</text>
<text x="708" y="394" class="bxs-s" style="fill:#8FA2AF">LZID8F02 get_sites — derived from WERKS</text>
<line x1="708" y1="410" x2="1212" y2="410" stroke="#2C3841" stroke-width="2"/>
<rect x="708" y="422" width="504" height="112" rx="8" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="726" y="448" class="code" xml:space="preserve">E*             -&gt;  EXPRESS</text>
<text x="726" y="472" class="code" xml:space="preserve">S/N/M 301-303  -&gt;  BULK SALES</text>
<text x="726" y="496" class="code" xml:space="preserve">S305 / S306    -&gt;  QCOMMERCE</text>
<text x="726" y="520" class="code" xml:space="preserve">R399           -&gt;  BAKERY PROD.</text>
<text x="708" y="566" class="bxs-s">Derived from the plant code, not a</text>
<text x="708" y="592" class="bxs-s">lookup — so no site can go missing</text>
<text x="708" y="618" class="bxs-s">because a text row was absent.</text>
<text x="708" y="644" class="bxs-s" style="fill:#FFB84D">D* → WAREHOUSE was added 2026-07-30.</text>
<text x="708" y="678" class="code-s" style="fill:#5E7080">src/glue/glue_engine/abap/helpers.py:157-221</text>

<!-- ══ ZONE 3 · PACK SIZE ══ -->
<text x="1270" y="300" class="cap">3 · A BUG, KEPT ON PURPOSE</text>
<rect x="1270" y="322" width="560" height="368" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="1298" y="366" class="bxt-s" style="fill:#FF6A72">parse_pack_size()</text>
<text x="1298" y="394" class="bxs-s" style="fill:#C79098">byte-for-byte port of ABAP strip_maktg</text>
<line x1="1298" y1="410" x2="1802" y2="410" stroke="#5A2028" stroke-width="2"/>
<rect x="1298" y="422" width="504" height="112" rx="8" fill="#0B1013" stroke="#3A2028" stroke-width="2"/>
<text x="1316" y="448" class="code" xml:space="preserve">buf40 = raw[:40].rjust(40)</text>
<text x="1316" y="472" class="code" xml:space="preserve">cnt = 40</text>
<text x="1316" y="496" class="code" xml:space="preserve" style="fill:#FFB84D">while cnt &gt; 1:   # offset 0 unread</text>
<text x="1316" y="520" class="code" xml:space="preserve">    cnt -= 1</text>
<text x="1298" y="566" class="bxs-s">Both passes scan a right-justified</text>
<text x="1298" y="592" class="bxs-s">buffer from 39 down to 1. Offset 0</text>
<text x="1298" y="618" class="bxs-s">is never inspected — an off-by-one</text>
<text x="1298" y="644" class="bxs-s">we kept, so output matches SAP.</text>
<text x="1298" y="678" class="code-s" style="fill:#FFA0A6">src/glue/glue_engine/abap/helpers.py:256-329</text>

<!-- ══ THE RULE ══ -->
<rect x="90" y="726" width="1740" height="158" rx="16" fill="#2A1216" stroke="#E3000E" stroke-width="3"/>
<text x="122" y="770" class="bxt" style="fill:#FF6A72">THE RULE — WHEN TO REPRODUCE A SOURCE BUG ON PURPOSE</text>
<text x="122" y="806" class="bxs">KEEP it when the wrong output is already the answer the business reconciles against — these pack sizes are printed on shelf labels.</text>
<text x="122" y="840" class="bxs" style="fill:#FFB84D">DON'T keep it when the bug DROPS data: zsdcc's inner join lost 273,867 ZDSALES rows / SAR 2.29 bn, so Silver uses LEFT and records why.</text>
<text x="122" y="869" class="bxs">Either way — write the divergence into the spec banner and pin it with a unit test, so nobody helpfully "fixes" it back.</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A port is not a rewrite. Sometimes "correct" means "identical to the thing everyone already trusts" — quirks included. Just write down which you chose.</text>
