<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 19</text>
<text x="90" y="168" class="title">Structure Terraform for Three Environments</text>
<text x="90" y="212" class="sub">One shelf of environment-blind modules, three thin compositions — and state that cannot reach across.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="302" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="94" rx="14" fill="#141A20" stroke="#2C3841" stroke-width="2.5"/>
<rect x="90" y="316" width="7" height="94" rx="3.5" fill="#FF3B47"/>
<text x="122" y="356" class="bxt-s">Copy the stack three times — or build one shelf of modules and vary only values?</text>
<text x="122" y="390" class="bxs-s" style="fill:#8FA2AF">Then answer the second question, which sets your blast radius: what does Dev still share with Prod?</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="452" class="cap">2 · DO THIS</text>
<rect x="90" y="466" width="1108" height="424" rx="16" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="118" y="506" class="doit">ONE SHELF · THREE THIN COMPOSITIONS</text>
<line x1="118" y1="520" x2="1170" y2="520" stroke="#2A4A3A" stroke-width="2"/>

<rect x="118" y="536" width="1052" height="140" rx="10" fill="#0B1A12" stroke="#255C3E" stroke-width="2"/>
<text x="140" y="566" class="code">infra/modules/&lt;name&gt;/     →  main.tf · variables.tf · outputs.tf · versions.tf</text>
<text x="140" y="594" class="bxs-s" style="fill:#8FA2AF">env-blind — no account id, no CIDR, no environment name, ever</text>
<text x="140" y="630" class="code">infra/env/{dev,qa,prod}/  →  main.tf · backend.tf · providers.tf · terraform.tfvars</text>
<text x="140" y="658" class="bxs-s" style="fill:#8FA2AF">composition only — module calls plus one file of values</text>

<rect x="118" y="706" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="716" class="bxs">Pin the provider in every module and in every env root.</text>
<rect x="118" y="748" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="758" class="bxs">Isolate state per environment — its own bucket, its own lock table, its own key.</text>
<rect x="118" y="790" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="800" class="bxs">prevent_destroy on every stateful resource: buckets, keys, the warehouse namespace.</text>
<rect x="118" y="832" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="842" class="bxs">Put the environment in every resource name, and pin the account id on the provider.</text>

<text x="118" y="878" class="code" style="fill:#6FD8A8">aws = "~&gt; 6.28"  ·  allowed_account_ids  ·  lifecycle { prevent_destroy = true }</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1226" y="452" class="cap">3 · WHY</text>
<rect x="1226" y="466" width="604" height="192" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1252" y="504" class="bxt-s">BLAST RADIUS</text>
<line x1="1252" y1="518" x2="1804" y2="518" stroke="#2C3841" stroke-width="2"/>
<text x="1252" y="546" class="bxs-s">One fix in a module lands in all three envs.</text>
<text x="1252" y="574" class="bxs-s">Shared state hands Dev delete rights on Prod.</text>
<rect x="1252" y="588" width="552" height="62" rx="10" fill="#2A1416" stroke="#7A2F35" stroke-width="2"/>
<text x="1274" y="614" class="avoid" style="font-size:17px">WHAT BREAKS IF YOU DON'T</text>
<text x="1274" y="640" class="bxs-s" style="fill:#FFB9BD">A dev mistake can destroy production.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1226" y="690" class="cap">4 · ON APPAREL GROUP</text>
<rect x="1226" y="704" width="604" height="186" rx="16" fill="#221B10" stroke="#C0902E" stroke-width="3"/>
<text x="1252" y="740" class="agbox">AG · DEV · QA · PROD</text>
<line x1="1252" y1="754" x2="1804" y2="754" stroke="#5A4626" stroke-width="2"/>
<text x="1252" y="784" class="bxs-s">One module shelf serves all 8 sources.</text>
<text x="1252" y="812" class="bxs-s">Oracle CIDRs, Epsilon endpoints and</text>
<text x="1252" y="840" class="bxs-s">MoEngage keys are values, never code.</text>
<text x="1252" y="874" class="code-s" style="fill:#5E7080">infra/modules/ · infra/env/{dev,qa,prod}/</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Modules are the parts bin; each environment is its own order sheet — and each sheet locks in its own cabinet.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 19</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
