<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 23</text>
<text x="90" y="168" class="title">Set Up Observability From Day One</text>
<text x="90" y="212" class="sub">Freshness gets a number, lateness gets an alarm, and every alarm reaches a named group.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="302" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="94" rx="14" fill="#141A20" stroke="#2C3841" stroke-width="2.5"/>
<rect x="90" y="316" width="7" height="94" rx="3.5" fill="#FF3B47"/>
<text x="122" y="356" class="bxt-s">When is this table late — and who finds out first, you or the business?</text>
<text x="122" y="390" class="bxs-s" style="fill:#8FA2AF">Failure alarms are the easy half. Nothing fires when a job succeeds on time and produces nothing.</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="452" class="cap">2 · DO THIS</text>
<rect x="90" y="466" width="1108" height="424" rx="16" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="118" y="506" class="doit">A NUMBER · TWO ALARMS · A LIST · A RUNBOOK</text>
<line x1="118" y1="520" x2="1170" y2="520" stroke="#2A4A3A" stroke-width="2"/>

<rect x="118" y="538" width="1052" height="106" rx="10" fill="#0B1A12" stroke="#255C3E" stroke-width="2"/>
<text x="140" y="570" class="code">pipeline_state · freshness:&lt;table&gt; · last_success_at · expected_within_seconds</text>
<text x="140" y="604" class="bxs-s">ALARM A — a run ended FAILED.</text>
<text x="640" y="604" class="bxs-s">ALARM B — nothing succeeded in time.</text>
<text x="140" y="632" class="bxs-s" style="fill:#8FA2AF">Both route to the same list. Both link the stage runbook.</text>

<rect x="118" y="680" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="690" class="bxs">Give every table a freshness SLA — a number in the control plane, not a habit.</text>
<rect x="118" y="720" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="730" class="bxs">Alarm on failure AND on lateness. The silent success is the dangerous one.</text>
<rect x="118" y="760" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="770" class="bxs">Route alerts to a distribution list, never to one person's inbox.</text>
<rect x="118" y="800" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="810" class="bxs">Write the stage runbook in the same pull request as the pipeline.</text>
<rect x="118" y="840" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="850" class="bxs">Build the operator view on the control plane, not on log searches.</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1226" y="452" class="cap">3 · WHY</text>
<rect x="1226" y="466" width="604" height="192" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1252" y="504" class="bxt-s">SILENCE IS NOT HEALTH</text>
<line x1="1252" y1="518" x2="1804" y2="518" stroke="#2C3841" stroke-width="2"/>
<text x="1252" y="546" class="bxs-s">A green run with zero rows looks exactly</text>
<text x="1252" y="574" class="bxs-s">like a healthy day — until month-end.</text>
<rect x="1252" y="588" width="552" height="62" rx="10" fill="#2A1416" stroke="#7A2F35" stroke-width="2"/>
<text x="1274" y="614" class="avoid" style="font-size:17px">WHAT BREAKS IF YOU DON'T</text>
<text x="1274" y="640" class="bxs-s" style="fill:#FFB9BD">The business tells you the data is stale.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1226" y="690" class="cap">4 · ON APPAREL GROUP</text>
<rect x="1226" y="704" width="604" height="186" rx="16" fill="#221B10" stroke="#C0902E" stroke-width="3"/>
<text x="1252" y="740" class="agbox">AG · ONE SLA PER TABLE</text>
<line x1="1252" y1="754" x2="1804" y2="754" stroke="#5A4626" stroke-width="2"/>
<text x="1252" y="784" class="bxs-s">XStore lands overnight; footfall files arrive</text>
<text x="1252" y="812" class="bxs-s">hourly; Epsilon pages on its own cursor.</text>
<text x="1252" y="840" class="bxs-s">One number per table, not one per platform.</text>
<text x="1252" y="874" class="code-s" style="fill:#5E7080">expected_within_seconds · one row per table</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A smoke alarm nobody can hear is decoration. Say in seconds when each table is late, and send that to a list — not to a person.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 23</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
