<div id="slide">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 14 · KEYSTONE</text>
<text x="90" y="168" class="title">Guarantee Correctness by Construction</text>
<text x="90" y="212" class="sub">The dangerous failure is not an error. It is a plausible number that is quietly double.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="300" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="108" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="362" class="bxt">How do you know the numbers are right?</text>
<text x="118" y="398" class="bxs" style="fill:#A9BAC6">Not by looking at them. By building tables whose grain cannot be violated.</text>
<rect x="1080" y="340" width="351" height="60" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="2.5"/>
<text x="1255" y="377" class="doit" text-anchor="middle" style="font-size:19px">DO · DECLARE THE GRAIN</text>
<rect x="1451" y="340" width="351" height="60" rx="12" fill="#241416" stroke="#8A3A42" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1626" y="377" class="avoid" text-anchor="middle" style="font-size:19px">AVOID · TRUSTING TOTALS</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="464" class="cap">2 · DO THIS</text>
<rect x="90" y="482" width="1010" height="408" rx="16" fill="#101E17" stroke="#3FD98A" stroke-width="3"/>
<rect x="90" y="482" width="1010" height="7" rx="3.5" fill="#3FD98A"/>
<text x="118" y="528" class="doit" style="font-size:23px">THE SETUP · FIVE GUARANTEES</text>
<line x1="118" y1="546" x2="1072" y2="546" stroke="#2A4A3A" stroke-width="2"/>

<circle cx="134" cy="575" r="15" fill="#3FD98A"/>
<text x="134" y="582" class="bxs-d" text-anchor="middle" style="font-size:18px">1</text>
<text x="166" y="582" class="bxs">State the grain of every table in one sentence, in the file header.</text>
<text x="166" y="610" class="code">one row = one store × day × style × season</text>

<circle cx="134" cy="637" r="15" fill="#3FD98A"/>
<text x="134" y="644" class="bxs-d" text-anchor="middle" style="font-size:18px">2</text>
<text x="166" y="644" class="bxs">Ask of every join: is my key the whole of the right side's primary key?</text>
<text x="166" y="672" class="code">if not, restrict the remaining key columns before joining</text>

<circle cx="134" cy="699" r="15" fill="#3FD98A"/>
<text x="134" y="706" class="bxs-d" text-anchor="middle" style="font-size:18px">3</text>
<text x="166" y="706" class="bxs">Constrain language- and type-keyed lookups so they cannot fan out.</text>
<text x="166" y="734" class="code">filter the right side to exactly one row per join key</text>

<circle cx="134" cy="761" r="15" fill="#3FD98A"/>
<text x="134" y="768" class="bxs-d" text-anchor="middle" style="font-size:18px">4</text>
<text x="166" y="768" class="bxs">Exclude synthetic rollup rows from every aggregate crossing that axis.</text>
<text x="166" y="796" class="code">WHERE dept != 'All Dept' — in every roll-up, every time</text>

<circle cx="134" cy="823" r="15" fill="#3FD98A"/>
<text x="134" y="830" class="bxs-d" text-anchor="middle" style="font-size:18px">5</text>
<text x="166" y="830" class="bxs">Add a uniqueness test on every merge key, a reconciliation test on totals.</text>
<text x="166" y="858" class="code">rollup row = SUM(detail rows), asserted on every build</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1130" y="464" class="cap">3 · WHY</text>
<rect x="1130" y="482" width="700" height="212" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1158" y="520" class="bxs">A fan-out or a double-counted subtotal does not</text>
<text x="1158" y="550" class="bxs">raise an error. It returns a number that looks</text>
<text x="1158" y="580" class="bxs">entirely normal and is exactly twice the truth.</text>
<line x1="1158" y1="600" x2="1802" y2="600" stroke="#2C3841" stroke-width="2"/>
<text x="1158" y="628" class="code" style="fill:#FF6B73;font-size:16px;letter-spacing:2px">IF YOU DON'T</text>
<text x="1158" y="653" class="bxs" style="fill:#C9A0A4">You hear about it from a business user months</text>
<text x="1158" y="680" class="bxs" style="fill:#C9A0A4">later, after decisions were made on it.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1130" y="732" class="cap">4 · ON APPAREL GROUP</text>
<rect x="1130" y="748" width="700" height="142" rx="16" fill="#1C1A12" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1158" y="784" class="agbox">STYLE · COLOUR · SIZE · SEASON</text>
<text x="1158" y="814" class="bxs" style="fill:#D9CBAE">Apparel dimensions multiply fast: one style</text>
<text x="1158" y="844" class="bxs" style="fill:#D9CBAE">becomes hundreds of SKUs. Grain discipline</text>
<text x="1158" y="874" class="bxs" style="fill:#D9CBAE">matters more here, not less.</text>

<!-- ══ IN PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A number that looks wrong gets fixed in an hour. A number that looks right but is double gets quoted in a board pack.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 14</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
</svg></div></body></html>
