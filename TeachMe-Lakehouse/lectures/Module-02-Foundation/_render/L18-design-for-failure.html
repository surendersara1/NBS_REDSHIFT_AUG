<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 18</text>
<text x="90" y="168" class="title">Design for Failure Before You Ship</text>
<text x="90" y="212" class="sub">At-least-once delivery means a job will run twice. Build for the second run before the first ships.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="298" class="cap">1 · THE DECISION</text>
<rect x="90" y="312" width="1740" height="84" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="348" class="bxt-s" style="font-size:25px">Is re-running the normal move, or the desperate one?</text>
<text x="118" y="378" class="bxs-s" style="fill:#8FA2AF">Retries, duplicate triggers and overlapping windows are ordinary events. Design for them.</text>

<rect x="1000" y="328" width="380" height="52" rx="12" fill="#171C21" stroke="#4A5A66" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="1190" y="360" class="bxs-s" text-anchor="middle" style="fill:#8296A3">&#215; hope it never runs twice</text>
<line x1="1386" y1="354" x2="1414" y2="354" stroke="#3FD98A" stroke-width="3.5" marker-end="url(#ag)"/>
<rect x="1420" y="328" width="384" height="52" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="1612" y="360" class="doit" text-anchor="middle" style="font-size:19px">MAKE IT SAFE TO RUN TWICE</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="430" class="cap">2 · DO THIS</text>
<rect x="90" y="444" width="1086" height="316" rx="16" fill="#101A15" stroke="#2F6B4C" stroke-width="2.5"/>
<text x="116" y="478" class="doit">IDEMPOTENT STAGES &#183; A SWEEPER &#183; NAMED RECOVERY MODES</text>
<line x1="116" y1="488" x2="1150" y2="488" stroke="#274438" stroke-width="2"/>

<text x="116" y="520" class="doit" style="font-size:20px">1</text>
<text x="142" y="520" class="bxs" style="font-size:20px">Make every write repeatable: overwrite a snapshot, or merge on a real key.</text>

<text x="116" y="552" class="doit" style="font-size:20px">2</text>
<text x="142" y="552" class="bxs" style="font-size:20px">Claim work with a create-only write, so a duplicate trigger simply no-ops.</text>

<text x="116" y="584" class="doit" style="font-size:20px">3</text>
<text x="142" y="584" class="bxs" style="font-size:20px">Look for an in-flight job before you start one &#8212; start APIs rarely dedupe.</text>

<text x="116" y="616" class="doit" style="font-size:20px">4</text>
<text x="142" y="616" class="bxs" style="font-size:20px">Add a sweeper that re-checks stuck cycles on a timer, not on an event.</text>

<text x="116" y="648" class="cap" style="font-size:15px;letter-spacing:2.5px">NAME THE RECOVERY MODE &#8212; AND WHO MAY RUN IT</text>

<rect x="116" y="660" width="232" height="86" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="232" y="686" class="bxt-s" text-anchor="middle" style="font-size:18px">RERUN</text>
<text x="232" y="710" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF;font-size:15px">today's failed tables</text>
<text x="232" y="734" class="bxs-s" text-anchor="middle" style="fill:#FFB84D;font-size:15px">on-call engineer</text>

<rect x="378" y="660" width="232" height="86" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="494" y="686" class="bxt-s" text-anchor="middle" style="font-size:18px">BACKFILL</text>
<text x="494" y="710" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF;font-size:15px">old data restated</text>
<text x="494" y="734" class="bxs-s" text-anchor="middle" style="fill:#FFB84D;font-size:15px">owner signs off</text>

<rect x="640" y="660" width="232" height="86" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="756" y="686" class="bxt-s" text-anchor="middle" style="font-size:18px">RE-BASELINE</text>
<text x="756" y="710" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF;font-size:15px">change pointer lost</text>
<text x="756" y="734" class="bxs-s" text-anchor="middle" style="fill:#FFB84D;font-size:15px">platform team</text>

<rect x="902" y="660" width="232" height="86" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="1018" y="686" class="bxt-s" text-anchor="middle" style="font-size:18px">AUTO SWEEP</text>
<text x="1018" y="710" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF;font-size:15px">stuck, nobody asked</text>
<text x="1018" y="734" class="bxs-s" text-anchor="middle" style="fill:#FFB84D;font-size:15px">every 15 minutes</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1206" y="430" class="cap">3 · WHY</text>
<rect x="1206" y="444" width="624" height="316" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1232" y="482" class="bxt-s" style="font-size:24px">THE SECOND RUN IS NOT RARE</text>
<line x1="1232" y1="494" x2="1804" y2="494" stroke="#2C3841" stroke-width="2"/>

<circle cx="1238" cy="520" r="4" fill="#3FD98A"/>
<text x="1256" y="526" class="bxs-s">At-least-once is the normal delivery contract.</text>
<circle cx="1238" cy="552" r="4" fill="#3FD98A"/>
<text x="1256" y="558" class="bxs-s">A timeout hides a side effect you already caused.</text>
<circle cx="1238" cy="584" r="4" fill="#3FD98A"/>
<text x="1256" y="590" class="bxs-s">An event-triggered gate that dies is never retried.</text>
<circle cx="1238" cy="616" r="4" fill="#3FD98A"/>
<text x="1256" y="622" class="bxs-s">Age alone is not evidence a cycle is dead.</text>

<rect x="1226" y="650" width="584" height="94" rx="12" fill="#2A1216" stroke="#7A2A32" stroke-width="2.5"/>
<text x="1246" y="678" class="avoid" style="font-size:17px">WHAT BREAKS IF YOU DON'T</text>
<text x="1246" y="706" class="bxs-s" style="font-size:18px">One duplicate trigger doubles a day's numbers, and</text>
<text x="1246" y="730" class="bxs-s" style="font-size:18px">a wedged cycle blocks every night that follows it.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="90" y="794" class="cap">4 · ON APPAREL GROUP</text>
<rect x="90" y="806" width="1740" height="84" rx="14" fill="#1F1A10" stroke="#7A5F26" stroke-width="2.5"/>
<text x="118" y="854" class="agbox">ON APPAREL GROUP</text>
<line x1="360" y1="820" x2="360" y2="876" stroke="#5A4720" stroke-width="2"/>
<text x="390" y="838" class="bxs" style="font-size:20px">Eight sources, eight ways to fail: Oracle sessions drop, Epsilon and MoEngage throttle, footfall files land late.</text>
<text x="390" y="870" class="bxs" style="font-size:20px">Write the recovery table and name an owner per mode before go-live &#8212; the on-call rota starts on day one.</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Assume the delivery van comes twice. Design the doorstep so the second box is harmless — not a second charge on the card.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 18</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
