  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3FD98A"/></marker>

<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 01</text>
<text x="90" y="168" class="title">Design the Engine Before the Pipelines</text>
<text x="90" y="212" class="sub">Eight source systems and roughly a hundred tables. Decide now what the unit of work is — because you cannot change it later.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="300" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Is the unit of work a job, or a spec?</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Whatever you pick in week one is what the next hundred tables have to live inside.</text>

<rect x="1040" y="336" width="350" height="64" rx="12" fill="#231519" stroke="#7A3A40" stroke-width="2.5" stroke-dasharray="9 6"/>
<line x1="1066" y1="359" x2="1084" y2="377" stroke="#FF6B73" stroke-width="3.5" stroke-linecap="round"/>
<line x1="1084" y1="359" x2="1066" y2="377" stroke="#FF6B73" stroke-width="3.5" stroke-linecap="round"/>
<text x="1100" y="376" class="avoid">One job per table</text>

<rect x="1410" y="336" width="420" height="64" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<polyline points="1440,368 1449,377 1466,357" fill="none" stroke="#3FD98A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1480" y="376" class="doit">One engine · many specs</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="462" class="doit">2 · DO THIS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="520" class="bxt-s" style="font-size:24px">BUILD FOUR SEAMS, THEN WRITE JOBS THAT ONLY WIRE THEM</text>
<line x1="118" y1="538" x2="1182" y2="538" stroke="#2C3841" stroke-width="2"/>

<!-- row 1 SPEC -->
<rect x="118" y="554" width="5" height="40" rx="2.5" fill="#3FD98A"/>
<text x="136" y="576" class="bxt-s" style="font-size:21px;fill:#3FD98A">SPEC</text>
<text x="1182" y="576" class="code-s" text-anchor="end" style="fill:#5E7080">glue_engine/spec.py</text>
<text x="136" y="602" class="bxs-s" style="font-size:18px">What the table <tspan style="fill:#FFFFFF">is</tspan>: schema, natural key, source config — validated before Spark starts.</text>
<line x1="118" y1="608" x2="1182" y2="608" stroke="#1E2830" stroke-width="2"/>

<!-- row 2 CONNECTOR -->
<rect x="118" y="618" width="5" height="40" rx="2.5" fill="#5AA9FF"/>
<text x="136" y="640" class="bxt-s" style="font-size:21px;fill:#5AA9FF">CONNECTOR</text>
<text x="1182" y="640" class="code-s" text-anchor="end" style="fill:#5E7080">sources/protocol.py</text>
<text x="136" y="666" class="bxs-s" style="font-size:18px">Where the rows come <tspan style="fill:#FFFFFF">from</tspan>. One Protocol; one class per kind of source, never per table.</text>
<line x1="118" y1="672" x2="1182" y2="672" stroke="#1E2830" stroke-width="2"/>

<!-- row 3 WRITER -->
<rect x="118" y="682" width="5" height="40" rx="2.5" fill="#FFB84D"/>
<text x="136" y="704" class="bxt-s" style="font-size:21px;fill:#FFB84D">WRITER</text>
<text x="1182" y="704" class="code-s" text-anchor="end" style="fill:#5E7080">writers/s3_tables.py</text>
<text x="136" y="730" class="bxs-s" style="font-size:18px">Where the rows go <tspan style="fill:#FFFFFF">to</tspan>. Land raw immutably, then MERGE into the table on its key.</text>
<line x1="118" y1="736" x2="1182" y2="736" stroke="#1E2830" stroke-width="2"/>

<!-- row 4 CONTROL PLANE -->
<rect x="118" y="746" width="5" height="40" rx="2.5" fill="#C9D6DE"/>
<text x="136" y="768" class="bxt-s" style="font-size:21px">CONTROL PLANE</text>
<text x="1182" y="768" class="code-s" text-anchor="end" style="fill:#5E7080">glue_engine/control_plane.py</text>
<text x="136" y="794" class="bxs-s" style="font-size:18px">What actually <tspan style="fill:#FFFFFF">happened</tspan>: runs per stage, watermarks, live state, lineage. Queryable.</text>

<rect x="118" y="814" width="1064" height="56" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="848" class="code" xml:space="preserve" style="fill:#8CE8B8">add table N+1  =  1 spec file  +  1 catalog row  —  no new code, no deploy</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1270" y="462" class="cap">3 · WHY</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="514" class="bxs-s" style="font-size:18px">One codebase serves a hundred tables, so a</text>
<text x="1298" y="540" class="bxs-s" style="font-size:18px">fix lands once, everywhere. And the config</text>
<text x="1298" y="566" class="bxs-s" style="font-size:18px">path is diffable, reviewable and testable</text>
<text x="1298" y="592" class="bxs-s" style="font-size:18px">without ever starting a cluster.</text>
<line x1="1298" y1="608" x2="1802" y2="608" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="636" class="bxt-s" style="font-size:18px;fill:#FF6B73">IF YOU DON'T</text>
<text x="1298" y="662" class="bxs-s" style="font-size:18px;fill:#C69AA0">A hundred near-identical jobs drift apart.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1270" y="710" class="agbox">4 · ON APPAREL GROUP</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">RMS · SIM · XStore   →   one Oracle class</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Epsilon · MoEngage   →   one API class</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Magento · Vemco · Irisys   →   drop / API</text>
<text x="1298" y="850" class="bxt-s" style="font-size:19px;fill:#FFB84D">8 sources · 3 classes · ~100 specs</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Build the printer once, not a hundred hand-written letters. After that, every new table is just another page you feed it.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 01</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
</svg></div></body></html>
