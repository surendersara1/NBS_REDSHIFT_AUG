  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3FD98A"/></marker>

<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 05</text>
<text x="90" y="168" class="title">Plan the Load Strategy per Table</text>
<text x="90" y="212" class="sub">Full-only master, incremental fact or windowed giant. Classify first — then make day one complete before CDC ever starts.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="300" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">Full, incremental or windowed — and what does day one load?</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">Classify every table before you write its spec — the class decides day one and every day after.</text>

<rect x="1040" y="336" width="350" height="64" rx="12" fill="#231519" stroke="#7A3A40" stroke-width="2.5" stroke-dasharray="9 6"/>
<line x1="1066" y1="359" x2="1084" y2="377" stroke="#FF6B73" stroke-width="3.5" stroke-linecap="round"/>
<line x1="1084" y1="359" x2="1066" y2="377" stroke="#FF6B73" stroke-width="3.5" stroke-linecap="round"/>
<text x="1100" y="376" class="avoid">Let CDC catch up</text>

<rect x="1410" y="336" width="420" height="64" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<polyline points="1440,368 1449,377 1466,357" fill="none" stroke="#3FD98A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1480" y="376" class="doit">Classify, then load</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="462" class="doit">2 · DO THIS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="518" class="bxt-s" style="font-size:24px">CLASSIFY EVERY TABLE INTO ONE OF THREE SHAPES</text>
<line x1="118" y1="534" x2="1182" y2="534" stroke="#2C3841" stroke-width="2"/>

<!-- card 1 -->
<rect x="118" y="552" width="340" height="196" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="2.5"/>
<rect x="118" y="552" width="340" height="7" rx="3.5" fill="#3FD98A"/>
<text x="140" y="594" class="bxt-s" style="font-size:21px;fill:#3FD98A">FULL-ONLY MASTER</text>
<line x1="140" y1="608" x2="436" y2="608" stroke="#2A4A3A" stroke-width="2"/>
<text x="140" y="638" class="bxs-s" style="font-size:18px">No trustworthy change</text>
<text x="140" y="664" class="bxs-s" style="font-size:18px">column, or small enough</text>
<text x="140" y="690" class="bxs-s" style="font-size:18px">not to care. Read it all.</text>
<text x="140" y="724" class="code-s" style="fill:#8CE8B8">read_mode: full</text>

<!-- card 2 -->
<rect x="480" y="552" width="340" height="196" rx="12" fill="#12283F" stroke="#5AA9FF" stroke-width="2.5"/>
<rect x="480" y="552" width="340" height="7" rx="3.5" fill="#5AA9FF"/>
<text x="502" y="594" class="bxt-s" style="font-size:21px;fill:#7FBEFF">INCREMENTAL FACT</text>
<line x1="502" y1="608" x2="798" y2="608" stroke="#2A3F5A" stroke-width="2"/>
<text x="502" y="638" class="bxs-s" style="font-size:18px">Trusted watermark, high</text>
<text x="502" y="664" class="bxs-s" style="font-size:18px">churn. Day 1 is ONE full</text>
<text x="502" y="690" class="bxs-s" style="font-size:18px">load, then daily deltas.</text>
<text x="502" y="724" class="code-s" style="fill:#7FBEFF">read_mode: incremental</text>

<!-- card 3 -->
<rect x="842" y="552" width="340" height="196" rx="12" fill="#2A1E12" stroke="#C4841F" stroke-width="2.5"/>
<rect x="842" y="552" width="340" height="7" rx="3.5" fill="#FFB84D"/>
<text x="864" y="594" class="bxt-s" style="font-size:21px;fill:#FFB84D">WINDOWED GIANT</text>
<line x1="864" y1="608" x2="1160" y2="608" stroke="#5A4520" stroke-width="2"/>
<text x="864" y="638" class="bxs-s" style="font-size:18px">Too big for one pull.</text>
<text x="864" y="664" class="bxs-s" style="font-size:18px">Day 1 is N date windows</text>
<text x="864" y="690" class="bxs-s" style="font-size:18px">in parallel — all finish.</text>
<text x="864" y="724" class="code-s" style="fill:#FFCE85">read_mode: range (chunked)</text>

<rect x="118" y="766" width="520" height="104" rx="12" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="140" y="796" class="bxt-s" style="font-size:20px;fill:#3FD98A">HAND OVER ONCE, NOT PER CHUNK</text>
<text x="140" y="826" class="bxs-s" style="font-size:18px">(none) → initial_loaded → cdc. The phase</text>
<text x="140" y="852" class="bxs-s" style="font-size:18px">gate flips it when every window is done.</text>

<rect x="662" y="766" width="520" height="104" rx="12" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="684" y="796" class="bxt-s" style="font-size:20px;fill:#3FD98A">EMPTY MEANS TWO THINGS</text>
<text x="684" y="826" class="bxs-s" style="font-size:18px">Empty FULL pull = FAIL, before landing.</text>
<text x="684" y="852" class="bxs-s" style="font-size:18px">Empty DELTA = success. A quiet day.</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1270" y="462" class="cap">3 · WHY</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="514" class="bxs-s" style="font-size:18px">An incomplete day one is invisible: every</text>
<text x="1298" y="540" class="bxs-s" style="font-size:18px">later reconciliation is wrong by an amount</text>
<text x="1298" y="566" class="bxs-s" style="font-size:18px">nobody can name. And an empty full pull</text>
<text x="1298" y="592" class="bxs-s" style="font-size:18px">that lands replaces good data with none.</text>
<line x1="1298" y1="608" x2="1802" y2="608" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="636" class="bxt-s" style="font-size:18px;fill:#FF6B73">IF YOU DON'T</text>
<text x="1298" y="662" class="bxs-s" style="font-size:18px;fill:#C69AA0">The error surfaces months after the build.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1270" y="710" class="agbox">4 · ON APPAREL GROUP</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="758" class="bxs-s" style="font-size:18px;fill:#E8D5B0">XStore POS — windowed giant</text>
<text x="1298" y="784" class="bxs-s" style="font-size:18px;fill:#E8D5B0">RMS · SIM facts — incremental</text>
<text x="1298" y="810" class="bxs-s" style="font-size:18px;fill:#E8D5B0">RMS masters · Magento — full-only</text>
<text x="1298" y="836" class="bxs-s" style="font-size:18px;fill:#E8D5B0">Epsilon · MoEngage — cursor delta</text>
<text x="1298" y="866" class="bxt-s" style="font-size:19px;fill:#FFB84D">Vemco · Irisys — full drops</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Moving house: everything moves once, then only the new post. Forward the post too early and the furniture never arrives.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 05</text>
