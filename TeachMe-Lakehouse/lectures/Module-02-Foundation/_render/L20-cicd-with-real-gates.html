<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 20</text>
<text x="90" y="168" class="title">Set Up CI/CD With Real Gates</text>
<text x="90" y="212" class="sub">No stored keys, one approved plan, and a human standing between the merge and production.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="302" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="94" rx="14" fill="#141A20" stroke="#2C3841" stroke-width="2.5"/>
<rect x="90" y="316" width="7" height="94" rx="3.5" fill="#FF3B47"/>
<text x="122" y="356" class="bxt-s">How does a merge become infrastructure — and who is allowed to stop it?</text>
<text x="122" y="390" class="bxs-s" style="fill:#8FA2AF">The pipeline needs AWS credentials it must never store, and an approval that has to mean something.</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="452" class="cap">2 · DO THIS</text>
<rect x="90" y="466" width="1108" height="424" rx="16" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="118" y="506" class="doit">TEST → ASSUME → PLAN → GATE → APPLY THAT PLAN</text>
<line x1="118" y1="520" x2="1170" y2="520" stroke="#2A4A3A" stroke-width="2"/>

<rect x="118" y="540" width="190" height="88" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2.5"/>
<text x="213" y="576" class="bxs" text-anchor="middle">TEST</text>
<text x="213" y="602" class="edge-s" text-anchor="middle" style="fill:#7FBF9C">lint · unit</text>

<rect x="333" y="540" width="190" height="88" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2.5"/>
<text x="428" y="576" class="bxs" text-anchor="middle">OIDC</text>
<text x="428" y="602" class="edge-s" text-anchor="middle" style="fill:#7FBF9C">assume role</text>

<rect x="548" y="540" width="190" height="88" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2.5"/>
<text x="643" y="576" class="bxs" text-anchor="middle">PLAN</text>
<text x="643" y="602" class="edge-s" text-anchor="middle" style="fill:#7FBF9C">-out=file</text>

<rect x="763" y="540" width="190" height="88" rx="10" fill="#3FD98A" stroke="#3FD98A" stroke-width="2.5"/>
<text x="858" y="576" class="bxs-d" text-anchor="middle">GATE</text>
<text x="858" y="602" class="bxs-d" text-anchor="middle" style="font-size:17px">human clicks</text>

<rect x="978" y="540" width="190" height="88" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2.5"/>
<text x="1073" y="576" class="bxs" text-anchor="middle">APPLY</text>
<text x="1073" y="602" class="edge-s" text-anchor="middle" style="fill:#7FBF9C">that same file</text>

<line x1="312" y1="584" x2="329" y2="584" stroke="#3FD98A" stroke-width="3.5" marker-end="url(#ag)"/>
<line x1="527" y1="584" x2="544" y2="584" stroke="#3FD98A" stroke-width="3.5" marker-end="url(#ag)"/>
<line x1="742" y1="584" x2="759" y2="584" stroke="#3FD98A" stroke-width="3.5" marker-end="url(#ag)"/>
<line x1="957" y1="584" x2="974" y2="584" stroke="#3FD98A" stroke-width="3.5" marker-end="url(#ag)"/>

<rect x="118" y="664" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="674" class="bxs">Federate with OIDC — the runner presents a signed token, never a stored key.</text>
<rect x="118" y="704" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="714" class="bxs">Save the plan to a file, then apply that file. Never re-plan inside the apply.</text>
<rect x="118" y="744" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="754" class="bxs">Manual gate on QA and Prod. One deploy role per environment, never shared.</text>
<rect x="118" y="784" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="794" class="bxs">Pin and checksum every tool, driver and layer the runner downloads.</text>
<rect x="118" y="824" width="10" height="10" fill="#3FD98A"/>
<text x="142" y="834" class="bxs">Match the branch in the OIDC trust policy to the branch you deploy from.</text>

<text x="118" y="876" class="code" style="fill:#6FD8A8">plan -out=prod.tfplan  →  show prod.tfplan  →  apply prod.tfplan</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1226" y="452" class="cap">3 · WHY</text>
<rect x="1226" y="466" width="604" height="192" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1252" y="504" class="bxt-s">AN APPROVAL THAT MEANS IT</text>
<line x1="1252" y1="518" x2="1804" y2="518" stroke="#2C3841" stroke-width="2"/>
<text x="1252" y="546" class="bxs-s">A gate approves one specific plan.</text>
<text x="1252" y="574" class="bxs-s">Re-plan after the click and you ship another.</text>
<rect x="1252" y="588" width="552" height="62" rx="10" fill="#2A1416" stroke="#7A2F35" stroke-width="2"/>
<text x="1274" y="614" class="avoid" style="font-size:17px">WHAT BREAKS IF YOU DON'T</text>
<text x="1274" y="640" class="bxs-s" style="fill:#FFB9BD">The human approved a plan that never ran.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1226" y="690" class="cap">4 · ON APPAREL GROUP</text>
<rect x="1226" y="704" width="604" height="186" rx="16" fill="#221B10" stroke="#C0902E" stroke-width="3"/>
<text x="1252" y="740" class="agbox">AG · THREE ENVS, THREE ROLES</text>
<line x1="1252" y1="754" x2="1804" y2="754" stroke="#5A4626" stroke-width="2"/>
<text x="1252" y="784" class="bxs-s">Dev auto-applies. QA and Prod wait for a</text>
<text x="1252" y="812" class="bxs-s">person. The Oracle JDBC driver and every</text>
<text x="1252" y="840" class="bxs-s">SaaS SDK are pinned and checksummed.</text>
<text x="1252" y="874" class="code-s" style="fill:#5E7080">one deploy role per env · no cross-env reuse</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">You approve one exact plan, and that exact plan runs. The runner never keeps a key — it shows ID at the door, every time.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 20</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
