<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 24</text>
<text x="90" y="168" class="title">The Standard Procedure for Adding a Source</text>
<text x="90" y="212" class="sub">Nine steps, in order, worked once against a real table — then it stops being a project.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="286" class="cap">1 · THE DECISION</text>
<rect x="90" y="300" width="1740" height="76" rx="14" fill="#141A20" stroke="#2C3841" stroke-width="2.5"/>
<rect x="90" y="300" width="7" height="76" rx="3.5" fill="#FF3B47"/>
<text x="122" y="336" class="bxt-s">Is a new source an engineering project, or a configuration change?</text>
<text x="122" y="364" class="bxs-s" style="fill:#8FA2AF">You will run this loop eight times in twelve weeks. Decide now what one new table is allowed to cost.</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="402" class="cap">2 · DO THIS</text>
<rect x="90" y="416" width="1740" height="286" rx="16" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="118" y="454" class="doit">NINE STEPS, IN ORDER — NONE OF THEM INSIDE THE ENGINE</text>
<line x1="118" y1="468" x2="1802" y2="468" stroke="#2A4A3A" stroke-width="2"/>

<!-- row 1 -->
<rect x="118" y="486" width="545" height="62" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2"/>
<rect x="132" y="503" width="28" height="28" rx="7" fill="#3FD98A"/>
<text x="146" y="524" class="bxs-d" text-anchor="middle" style="font-size:19px">1</text>
<text x="172" y="514" class="bxs">CLASSIFY THE TABLE</text>
<text x="172" y="536" class="bxs-s" style="fill:#8FA2AF">full master · incremental fact · windowed giant</text>

<rect x="687" y="486" width="545" height="62" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2"/>
<rect x="701" y="503" width="28" height="28" rx="7" fill="#3FD98A"/>
<text x="715" y="524" class="bxs-d" text-anchor="middle" style="font-size:19px">2</text>
<text x="741" y="514" class="bxs">CONFIRM THE PK AND THE WATERMARK</text>
<text x="741" y="536" class="bxs-s" style="fill:#8FA2AF">read the constraint catalog — never assume</text>

<rect x="1256" y="486" width="545" height="62" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="1270" y="503" width="28" height="28" rx="7" fill="#3FD98A"/>
<text x="1284" y="524" class="bxs-d" text-anchor="middle" style="font-size:19px">3</text>
<text x="1310" y="514" class="bxs">CONNECTOR — ONLY IF NEEDED</text>
<text x="1781" y="514" class="code-s" text-anchor="end" style="fill:#FFB84D">CONDITIONAL</text>
<text x="1310" y="536" class="bxs-s" style="fill:#8FA2AF">a branch in the JDBC class, not a new project</text>

<!-- row 2 -->
<rect x="118" y="559" width="545" height="62" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2"/>
<rect x="132" y="576" width="28" height="28" rx="7" fill="#3FD98A"/>
<text x="146" y="597" class="bxs-d" text-anchor="middle" style="font-size:19px">4</text>
<text x="172" y="587" class="bxs">WRITE THE DOWNLOAD SPEC</text>
<text x="172" y="609" class="bxs-s" style="fill:#8FA2AF">projection, watermark column, parallelism</text>

<rect x="687" y="559" width="545" height="62" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2"/>
<rect x="701" y="576" width="28" height="28" rx="7" fill="#3FD98A"/>
<text x="715" y="597" class="bxs-d" text-anchor="middle" style="font-size:19px">5</text>
<text x="741" y="587" class="bxs">WRITE THE BRONZE SPEC</text>
<text x="741" y="609" class="bxs-s" style="fill:#8FA2AF">merge_key, plus the same schema mirrored</text>

<rect x="1256" y="559" width="545" height="62" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2"/>
<rect x="1270" y="576" width="28" height="28" rx="7" fill="#3FD98A"/>
<text x="1284" y="597" class="bxs-d" text-anchor="middle" style="font-size:19px">6</text>
<text x="1310" y="587" class="bxs">ADD THE CATALOG ROW</text>
<text x="1310" y="609" class="bxs-s" style="fill:#8FA2AF">one row per table, one connection per source</text>

<!-- row 3 -->
<rect x="118" y="632" width="545" height="62" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2"/>
<rect x="132" y="649" width="28" height="28" rx="7" fill="#3FD98A"/>
<text x="146" y="670" class="bxs-d" text-anchor="middle" style="font-size:19px">7</text>
<text x="172" y="660" class="bxs">STAGING MODEL + TESTS</text>
<text x="172" y="682" class="bxs-s" style="fill:#8FA2AF">a view, plus not_null and unique on the key</text>

<rect x="687" y="632" width="545" height="62" rx="10" fill="#0B1A12" stroke="#2E7A55" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="701" y="649" width="28" height="28" rx="7" fill="#3FD98A"/>
<text x="715" y="670" class="bxs-d" text-anchor="middle" style="font-size:19px">8</text>
<text x="741" y="660" class="bxs">GOLD MODEL — IF IT REPORTS</text>
<text x="1212" y="660" class="code-s" text-anchor="end" style="fill:#FFB84D">CONDITIONAL</text>
<text x="741" y="682" class="bxs-s" style="fill:#8FA2AF">otherwise stop — runs already prove the pull</text>

<rect x="1256" y="632" width="545" height="62" rx="10" fill="#12331F" stroke="#3FD98A" stroke-width="2.5"/>
<rect x="1270" y="649" width="28" height="28" rx="7" fill="#3FD98A"/>
<text x="1284" y="670" class="bxs-d" text-anchor="middle" style="font-size:19px">9</text>
<text x="1310" y="660" class="bxs">DEPLOY THROUGH THE GATE</text>
<text x="1310" y="682" class="bxs-s" style="fill:#8FA2AF">sync specs · seed catalog · smoke-test in Dev</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="90" y="726" class="cap">3 · WHY</text>
<rect x="90" y="740" width="845" height="150" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="778" class="bxt-s">ONE SOURCE, ONE PULL REQUEST</text>
<line x1="118" y1="792" x2="907" y2="792" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="822" class="bxs">Engine, barriers and control plane stay untouched — only config moves.</text>
<rect x="118" y="838" width="789" height="44" rx="10" fill="#2A1416" stroke="#7A2F35" stroke-width="2"/>
<text x="140" y="866" class="avoid" style="font-size:17px">WHAT BREAKS IF YOU DON'T</text>
<text x="436" y="866" class="bxs-s" style="fill:#FFB9BD">Every new table becomes its own project.</text>

<text x="985" y="726" class="cap">4 · ON APPAREL GROUP</text>

<text x="1033" y="850" class="code" style="fill:#FFC97A">bronze/rms_item_master.yaml    ·  merge_key: [ITEM]</text>

<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Nine steps, none of them inside the engine. Do this once for RMS. Then it's a habit.</text>
