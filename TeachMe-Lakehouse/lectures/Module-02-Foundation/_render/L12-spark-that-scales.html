<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 12</text>
<text x="90" y="168" class="title">Write Spark That Scales</text>
<text x="90" y="212" class="sub">Five rules of thumb that decide whether a job finishes in minutes or dies at the timeout.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="300" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="108" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="362" class="bxt">Why is this job slow — and what do you change first?</text>
<text x="118" y="398" class="bxs" style="fill:#A9BAC6">Almost always one of five things. Measure to find out which one.</text>
<rect x="1080" y="340" width="351" height="60" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="2.5"/>
<text x="1255" y="377" class="doit" text-anchor="middle" style="font-size:19px">DO · MEASURE FIRST</text>
<rect x="1451" y="340" width="351" height="60" rx="12" fill="#241416" stroke="#8A3A42" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1626" y="377" class="avoid" text-anchor="middle" style="font-size:19px">AVOID · BLIND TUNING</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="464" class="cap">2 · DO THIS</text>
<rect x="90" y="482" width="1010" height="408" rx="16" fill="#101E17" stroke="#3FD98A" stroke-width="3"/>
<rect x="90" y="482" width="1010" height="7" rx="3.5" fill="#3FD98A"/>
<text x="118" y="528" class="doit" style="font-size:23px">THE SETUP · FIVE RULES OF THUMB</text>
<line x1="118" y1="546" x2="1072" y2="546" stroke="#2A4A3A" stroke-width="2"/>

<circle cx="134" cy="575" r="15" fill="#3FD98A"/>
<text x="134" y="582" class="bxs-d" text-anchor="middle" style="font-size:18px">1</text>
<text x="166" y="582" class="bxs">Cache any frame you consume more than once. A plan re-runs per action.</text>
<text x="166" y="610" class="code">df.cache() before count / agg / write</text>

<circle cx="134" cy="637" r="15" fill="#3FD98A"/>
<text x="134" y="644" class="bxs-d" text-anchor="middle" style="font-size:18px">2</text>
<text x="166" y="644" class="bxs">Count the actions. count, collect, first and write each re-read the source.</text>
<text x="166" y="672" class="code">3 actions, no cache = 3 full pulls from Oracle</text>

<circle cx="134" cy="699" r="15" fill="#3FD98A"/>
<text x="134" y="706" class="bxs-d" text-anchor="middle" style="font-size:18px">3</text>
<text x="166" y="706" class="bxs">Partition the read. Size for roughly 5–10 M rows per partition.</text>
<text x="166" y="734" class="code">partitions × concurrent tables ≤ source connection ceiling</text>

<circle cx="134" cy="761" r="15" fill="#3FD98A"/>
<text x="134" y="768" class="bxs-d" text-anchor="middle" style="font-size:18px">4</text>
<text x="166" y="768" class="bxs">Never collect to the driver. Aggregate in the cluster and write out.</text>
<text x="166" y="796" class="code">collect() on a fact table = one JVM, one heap</text>

<circle cx="134" cy="823" r="15" fill="#3FD98A"/>
<text x="134" y="830" class="bxs-d" text-anchor="middle" style="font-size:18px">5</text>
<text x="166" y="830" class="bxs">Look for skew before you touch config. A stage waits on its slowest task.</text>
<text x="166" y="858" class="code">one busy executor → skew, or a single-connection read</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1130" y="464" class="cap">3 · WHY</text>
<rect x="1130" y="482" width="700" height="212" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1158" y="520" class="bxs">Spark is lazy: a DataFrame is a plan, and every</text>
<text x="1158" y="550" class="bxs">action runs that plan from the top again.</text>
<text x="1158" y="580" class="bxs">Tuning without a measurement is superstition.</text>
<line x1="1158" y1="600" x2="1802" y2="600" stroke="#2C3841" stroke-width="2"/>
<text x="1158" y="628" class="code" style="fill:#FF6B73;font-size:16px;letter-spacing:2px">IF YOU DON'T</text>
<text x="1158" y="653" class="bxs" style="fill:#C9A0A4">The job does not fail fast — it burns hours, then</text>
<text x="1158" y="680" class="bxs" style="fill:#C9A0A4">times out with nothing written.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1130" y="732" class="cap">4 · ON APPAREL GROUP</text>
<rect x="1130" y="748" width="700" height="142" rx="16" fill="#1C1A12" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1158" y="784" class="agbox">XSTORE IS THE GIANT</text>
<text x="1158" y="814" class="bxs" style="fill:#D9CBAE">Size XStore first — it is the largest read by far.</text>
<text x="1158" y="844" class="bxs" style="fill:#D9CBAE">RMS and SIM masters need almost no parallelism.</text>
<text x="1158" y="874" class="bxs" style="fill:#D9CBAE">Budget connections per source, not per job.</text>

<!-- ══ IN PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A Spark job is a recipe, not a meal. Reading it out three times cooks dinner three times — unless you write the result down once.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 12</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
