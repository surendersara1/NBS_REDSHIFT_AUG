<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 08</text>
<text x="90" y="168" class="title">Plan Table Maintenance on Day One</text>
<text x="90" y="212" class="sub">Every write leaves litter behind. Decide now who sweeps it — the platform, or a job you ship.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="300" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="108" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="362" class="bxt">Who compacts, and who expires the snapshots?</text>
<text x="118" y="398" class="bxs" style="fill:#A9BAC6">Maintenance has no error message. If nobody owns it, nobody notices it is missing.</text>
<rect x="1080" y="340" width="351" height="60" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="2.5"/>
<text x="1255" y="377" class="doit" text-anchor="middle" style="font-size:19px">DO · SHIP THE SCHEDULE</text>
<rect x="1451" y="340" width="351" height="60" rx="12" fill="#241416" stroke="#8A3A42" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1626" y="377" class="avoid" text-anchor="middle" style="font-size:19px">AVOID · WIRE IT LATER</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="464" class="cap">2 · DO THIS</text>
<rect x="90" y="482" width="1120" height="408" rx="16" fill="#101E17" stroke="#3FD98A" stroke-width="3"/>
<rect x="90" y="482" width="1120" height="7" rx="3.5" fill="#3FD98A"/>
<text x="118" y="528" class="doit" style="font-size:23px">THE SETUP · FIVE THINGS TO SETTLE BEFORE GO-LIVE</text>
<line x1="118" y1="546" x2="1182" y2="546" stroke="#2A4A3A" stroke-width="2"/>

<circle cx="134" cy="575" r="15" fill="#3FD98A"/>
<text x="134" y="582" class="bxs-d" text-anchor="middle" style="font-size:18px">1</text>
<text x="166" y="582" class="bxs">Split maintenance into three jobs: compaction, snapshot expiry, file cleanup.</text>
<text x="166" y="610" class="code">three different jobs — never one vague word called "maintenance"</text>

<circle cx="134" cy="637" r="15" fill="#3FD98A"/>
<text x="134" y="644" class="bxs-d" text-anchor="middle" style="font-size:18px">2</text>
<text x="166" y="644" class="bxs">Write down which of the three the platform runs for you, and which you own.</text>
<text x="166" y="672" class="code">managed compaction is common · scheduled snapshot expiry rarely is</text>

<circle cx="134" cy="699" r="15" fill="#3FD98A"/>
<text x="134" y="706" class="bxs-d" text-anchor="middle" style="font-size:18px">3</text>
<text x="166" y="706" class="bxs">Schedule snapshot expiry weekly, keeping a retain floor so rollback survives.</text>
<text x="166" y="734" class="code">expire_snapshots(older_than_days=7, retain_last=100)</text>

<circle cx="134" cy="761" r="15" fill="#3FD98A"/>
<text x="134" y="768" class="bxs-d" text-anchor="middle" style="font-size:18px">4</text>
<text x="166" y="768" class="bxs">Declare unreferenced-file removal on the bucket, in Terraform, at creation.</text>
<text x="166" y="796" class="code">unreferenced_days = 7 on bronze · 30 on silver — declared, not clicked</text>

<circle cx="134" cy="823" r="15" fill="#3FD98A"/>
<text x="134" y="830" class="bxs-d" text-anchor="middle" style="font-size:18px">5</text>
<text x="166" y="830" class="bxs">Ship that schedule in the same pull request as the pipeline, or it never ships.</text>
<text x="166" y="858" class="code">count snapshots per table weekly · alarm when the count stops falling</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1240" y="464" class="cap">3 · WHY</text>
<rect x="1240" y="482" width="590" height="212" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1268" y="518" class="bxs-s">Frequent small writes commit a new snapshot every</text>
<text x="1268" y="546" class="bxs-s">cycle, and query planning walks that metadata chain</text>
<text x="1268" y="574" class="bxs-s">before it reads a single row of data.</text>
<line x1="1268" y1="594" x2="1802" y2="594" stroke="#2C3841" stroke-width="2"/>
<text x="1268" y="622" class="code" style="fill:#FF6B73;font-size:16px;letter-spacing:2px">IF YOU DON'T</text>
<text x="1268" y="650" class="bxs-s" style="fill:#C9A0A4">Reads decay for a year and nothing fails —</text>
<text x="1268" y="676" class="bxs-s" style="fill:#C9A0A4">there is no log line anyone can grep for.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1240" y="732" class="cap">4 · ON APPAREL GROUP</text>
<rect x="1240" y="748" width="590" height="142" rx="16" fill="#1C1A12" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1268" y="784" class="agbox">XSTORE AND SIM DECAY FIRST</text>
<text x="1268" y="816" class="bxs-s" style="fill:#D9CBAE">Both commit on every cycle, so their metadata</text>
<text x="1268" y="844" class="bxs-s" style="fill:#D9CBAE">grows fastest — put them on the weekly expiry</text>
<text x="1268" y="872" class="bxs-s" style="fill:#D9CBAE">job. Vemco and Irisys are the small-file source.</text>

<!-- ══ IN PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Nothing errors — everything just gets slower. Book the cleaner before you move in, because nobody ever books one afterwards.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 08</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
