<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 15</text>
<text x="90" y="168" class="title">Design the Schedule and the Dispatcher</text>
<text x="90" y="212" class="sub">One cron. One cycle id. One function that decides tonight's work from config and state.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="298" class="cap">1 · THE DECISION</text>
<rect x="90" y="312" width="1740" height="84" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="348" class="bxt-s" style="font-size:25px">Where is &#8220;what runs tonight&#8221; actually decided?</text>
<text x="118" y="378" class="bxs-s" style="fill:#8FA2AF">Eight sources, dozens of tables each. Something has to choose, and you should be able to read it.</text>

<rect x="1000" y="328" width="380" height="52" rx="12" fill="#171C21" stroke="#4A5A66" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="1190" y="360" class="bxs-s" text-anchor="middle" style="fill:#8296A3">&#215; a cron rule per table</text>
<line x1="1386" y1="354" x2="1414" y2="354" stroke="#3FD98A" stroke-width="3.5" marker-end="url(#ag)"/>
<rect x="1420" y="328" width="384" height="52" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<text x="1612" y="360" class="doit" text-anchor="middle" style="font-size:19px">ONE CRON &#183; ONE DISPATCHER</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="430" class="cap">2 · DO THIS</text>
<rect x="90" y="444" width="1086" height="316" rx="16" fill="#101A15" stroke="#2F6B4C" stroke-width="2.5"/>
<text x="116" y="480" class="doit">ONE CRON &#183; ONE DISPATCHER &#183; ONE CYCLE ID</text>
<line x1="116" y1="492" x2="1150" y2="492" stroke="#274438" stroke-width="2"/>

<text x="116" y="524" class="doit" style="font-size:20px">1</text>
<text x="142" y="524" class="bxs" style="font-size:20px">One schedule rule fires one dispatcher. The cron carries no instructions.</text>

<text x="116" y="556" class="doit" style="font-size:20px">2</text>
<text x="142" y="556" class="bxs" style="font-size:20px">Stamp one cycle id per night. Every run row, lock and alert joins on it.</text>

<text x="116" y="588" class="doit" style="font-size:20px">3</text>
<text x="142" y="588" class="bxs" style="font-size:20px">Write the cycle manifest first, create-only, before any job starts.</text>

<text x="116" y="620" class="doit" style="font-size:20px">4</text>
<text x="142" y="620" class="bxs" style="font-size:20px">Build tonight's list from config plus state &#8212; never a hardcoded schedule.</text>

<text x="116" y="652" class="doit" style="font-size:20px">5</text>
<text x="142" y="652" class="bxs" style="font-size:20px">Pass references, not rows. Orchestration inputs have a hard size ceiling.</text>

<text x="116" y="684" class="cap" style="font-size:15px;letter-spacing:2.5px">DECLARE THE RUN MODE &#8212; NEVER INFER IT</text>

<rect x="116" y="696" width="232" height="52" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="232" y="718" class="bxt-s" text-anchor="middle" style="font-size:18px">INITIAL</text>
<text x="232" y="733" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF;font-size:15px">complete history, once</text>

<rect x="378" y="696" width="232" height="52" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="494" y="718" class="bxt-s" text-anchor="middle" style="font-size:18px">INCREMENTAL</text>
<text x="494" y="733" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF;font-size:15px">nightly, from watermark</text>

<rect x="640" y="696" width="232" height="52" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="756" y="718" class="bxt-s" text-anchor="middle" style="font-size:18px">RERUN</text>
<text x="756" y="733" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF;font-size:15px">redo today's failures</text>

<rect x="902" y="696" width="232" height="52" rx="10" fill="#12181D" stroke="#2C3841" stroke-width="2"/>
<text x="1018" y="718" class="bxt-s" text-anchor="middle" style="font-size:18px">BACKFILL</text>
<text x="1018" y="733" class="bxs-s" text-anchor="middle" style="fill:#8FA2AF;font-size:15px">date range, own cycle</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1206" y="430" class="cap">3 · WHY</text>
<rect x="1206" y="444" width="624" height="316" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1232" y="482" class="bxt-s" style="font-size:24px">CONFIG SCALES &#183; CODE DOES NOT</text>
<line x1="1232" y1="494" x2="1804" y2="494" stroke="#2C3841" stroke-width="2"/>

<circle cx="1238" cy="520" r="4" fill="#3FD98A"/>
<text x="1256" y="526" class="bxs-s">Config is reviewable; 200 cron rules are not.</text>
<circle cx="1238" cy="552" r="4" fill="#3FD98A"/>
<text x="1256" y="558" class="bxs-s">One decision function you can unit-test.</text>
<circle cx="1238" cy="584" r="4" fill="#3FD98A"/>
<text x="1256" y="590" class="bxs-s">State decides what is due, not the clock.</text>
<circle cx="1238" cy="616" r="4" fill="#3FD98A"/>
<text x="1256" y="622" class="bxs-s">Small payloads survive orchestration limits.</text>

<rect x="1226" y="650" width="584" height="94" rx="12" fill="#2A1216" stroke="#7A2A32" stroke-width="2.5"/>
<text x="1246" y="678" class="avoid" style="font-size:17px">WHAT BREAKS IF YOU DON'T</text>
<text x="1246" y="706" class="bxs-s" style="font-size:18px">Per-table schedules drift apart, and nothing can</text>
<text x="1246" y="730" class="bxs-s" style="font-size:18px">answer &#8220;what ran tonight, and why that list?&#8221;</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="90" y="794" class="cap">4 · ON APPAREL GROUP</text>
<rect x="90" y="806" width="1740" height="84" rx="14" fill="#1F1A10" stroke="#7A5F26" stroke-width="2.5"/>
<text x="118" y="854" class="agbox">ON APPAREL GROUP</text>
<line x1="360" y1="820" x2="360" y2="876" stroke="#5A4720" stroke-width="2"/>
<text x="390" y="838" class="bxs" style="font-size:20px">One nightly cycle covers all eight: RMS &#183; SIM &#183; XStore &#183; Epsilon &#183; MoEngage &#183; Magento &#183; Vemco &#183; Irisys.</text>
<text x="390" y="870" class="bxs" style="font-size:20px">XStore is the giant &#8212; give it chunked initial windows; the two footfall feeds ride the same fan-out.</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">The alarm clock does not know your to-do list. It just rings. One person then reads the list and hands out the jobs.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 15</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
