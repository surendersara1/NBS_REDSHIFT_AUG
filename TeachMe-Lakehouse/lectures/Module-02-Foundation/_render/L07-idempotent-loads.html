<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 07</text>
<text x="90" y="168" class="title">Make Every Load Idempotent</text>
<text x="90" y="212" class="sub">Replays, overlapping windows and retries are normal. Re-running must not change the row count.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="300" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="108" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="362" class="bxt">How do you re-run a load without changing the row count?</text>
<text x="118" y="398" class="bxs" style="fill:#A9BAC6">Replays, overlapping windows and automatic retries are routine, not exceptional.</text>
<rect x="1080" y="340" width="351" height="60" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="2.5"/>
<text x="1255" y="377" class="doit" text-anchor="middle" style="font-size:19px">DO · DEDUPE, THEN MERGE</text>
<rect x="1451" y="340" width="351" height="60" rx="12" fill="#241416" stroke="#8A3A42" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1626" y="377" class="avoid" text-anchor="middle" style="font-size:19px">AVOID · PLAIN APPEND</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="464" class="cap">2 · DO THIS</text>
<rect x="90" y="482" width="1120" height="408" rx="16" fill="#101E17" stroke="#3FD98A" stroke-width="3"/>
<rect x="90" y="482" width="1120" height="7" rx="3.5" fill="#3FD98A"/>
<text x="118" y="528" class="doit" style="font-size:23px">THE SETUP · FIVE STEPS TO AN IDEMPOTENT LOAD</text>
<line x1="118" y1="546" x2="1182" y2="546" stroke="#2A4A3A" stroke-width="2"/>

<circle cx="134" cy="575" r="15" fill="#3FD98A"/>
<text x="134" y="582" class="bxs-d" text-anchor="middle" style="font-size:18px">1</text>
<text x="166" y="582" class="bxs">Find the real primary key in the source DDL. Never infer it from a column name.</text>
<text x="166" y="610" class="code">prove it once: count(*) must equal count(distinct key)</text>

<circle cx="134" cy="637" r="15" fill="#3FD98A"/>
<text x="134" y="644" class="bxs-d" text-anchor="middle" style="font-size:18px">2</text>
<text x="166" y="644" class="bxs">Declare that key on the spec as merge_key. No declared key, no load.</text>
<text x="166" y="672" class="code">merge_key: [store_id, business_date, transaction_no]</text>

<circle cx="134" cy="699" r="15" fill="#3FD98A"/>
<text x="134" y="706" class="bxs-d" text-anchor="middle" style="font-size:18px">3</text>
<text x="166" y="706" class="bxs">Dedupe the source to one row per key before the MERGE ever sees the frame.</text>
<text x="166" y="734" class="code">row_number() over (partition by key order by ingested_at desc) = 1</text>

<circle cx="134" cy="761" r="15" fill="#3FD98A"/>
<text x="134" y="768" class="bxs-d" text-anchor="middle" style="font-size:18px">4</text>
<text x="166" y="768" class="bxs">Upsert with MERGE — matched updates, unmatched inserts. Never a plain append.</text>
<text x="166" y="796" class="code">MERGE INTO t USING s ON t.key = s.key WHEN MATCHED / WHEN NOT MATCHED</text>

<circle cx="134" cy="823" r="15" fill="#3FD98A"/>
<text x="134" y="830" class="bxs-d" text-anchor="middle" style="font-size:18px">5</text>
<text x="166" y="830" class="bxs">Make the landing write overwrite its own cycle prefix, so a retry replaces itself.</text>
<text x="166" y="858" class="code">one cycle id · one prefix · one write — a rerun overwrites, never adds</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1240" y="464" class="cap">3 · WHY</text>
<rect x="1240" y="482" width="590" height="212" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1268" y="518" class="bxs-s">Retries and overlapping windows are routine, and</text>
<text x="1268" y="546" class="bxs-s">append-only turns every one of them into duplicate</text>
<text x="1268" y="574" class="bxs-s">rows. A one-match rule is the engine protecting you.</text>
<line x1="1268" y1="594" x2="1802" y2="594" stroke="#2C3841" stroke-width="2"/>
<text x="1268" y="622" class="code" style="fill:#FF6B73;font-size:16px;letter-spacing:2px">IF YOU DON'T</text>
<text x="1268" y="650" class="bxs-s" style="fill:#C9A0A4">The very first write can land duplicate keys,</text>
<text x="1268" y="676" class="bxs-s" style="fill:#C9A0A4">and once they are in, they are permanent.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1240" y="732" class="cap">4 · ON APPAREL GROUP</text>
<rect x="1240" y="748" width="590" height="142" rx="16" fill="#1C1A12" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1268" y="784" class="agbox">PROVE THE PK BEFORE THE SPEC</text>
<text x="1268" y="816" class="bxs-s" style="fill:#D9CBAE">RMS, SIM and XStore all use composite keys —</text>
<text x="1268" y="844" class="bxs-s" style="fill:#D9CBAE">read the DDL. Magento keys order plus line;</text>
<text x="1268" y="872" class="bxs-s" style="fill:#D9CBAE">Epsilon and MoEngage on event id. Prove each.</text>

<!-- ══ IN PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Idempotent means pressing the button twice changes nothing. The key is the promise; MERGE is how the engine keeps it.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 07</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
