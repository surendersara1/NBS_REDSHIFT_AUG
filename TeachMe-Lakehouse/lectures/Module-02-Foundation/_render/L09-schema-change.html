<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 09</text>
<text x="90" y="168" class="title">Make Schema Change a Controlled Event</text>
<text x="90" y="212" class="sub">The source will add a column. Decide now whether your pipeline stops, or quietly absorbs it.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="300" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="108" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="362" class="bxt">What happens when a source adds or widens a column?</text>
<text x="118" y="398" class="bxs" style="fill:#A9BAC6">It will happen. The only question is whether the pipeline stops or absorbs it silently.</text>
<rect x="1080" y="340" width="351" height="60" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="2.5"/>
<text x="1255" y="377" class="doit" text-anchor="middle" style="font-size:19px">DO · FAIL LOUDLY</text>
<rect x="1451" y="340" width="351" height="60" rx="12" fill="#241416" stroke="#8A3A42" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1626" y="377" class="avoid" text-anchor="middle" style="font-size:19px">AVOID · SILENT DRIFT</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="464" class="cap">2 · DO THIS</text>
<rect x="90" y="482" width="1120" height="408" rx="16" fill="#101E17" stroke="#3FD98A" stroke-width="3"/>
<rect x="90" y="482" width="1120" height="7" rx="3.5" fill="#3FD98A"/>
<text x="118" y="528" class="doit" style="font-size:23px">THE SETUP · FIVE RULES FOR A CONTROLLED CHANGE</text>
<line x1="118" y1="546" x2="1182" y2="546" stroke="#2A4A3A" stroke-width="2"/>

<circle cx="134" cy="575" r="15" fill="#3FD98A"/>
<text x="134" y="582" class="bxs-d" text-anchor="middle" style="font-size:18px">1</text>
<text x="166" y="582" class="bxs">Set the drift policy to fail on every model. Unexpected change stops the build.</text>
<text x="166" y="610" class="code">on_schema_change: fail — never ignore, never sync_all_columns</text>

<circle cx="134" cy="637" r="15" fill="#3FD98A"/>
<text x="134" y="644" class="bxs-d" text-anchor="middle" style="font-size:18px">2</text>
<text x="166" y="644" class="bxs">Classify the change: a new last column is additive, everything else is a migration.</text>
<text x="166" y="672" class="code">drop · rename · retype · reorder · narrow — all migrations, all planned</text>

<circle cx="134" cy="699" r="15" fill="#3FD98A"/>
<text x="134" y="706" class="bxs-d" text-anchor="middle" style="font-size:18px">3</text>
<text x="166" y="706" class="bxs">Allow a schema merge only on writes that rewrite every row, never a partial one.</text>
<text x="166" y="734" class="code">full refresh and create-or-replace only · never append, never merge</text>

<circle cx="134" cy="761" r="15" fill="#3FD98A"/>
<text x="134" y="768" class="bxs-d" text-anchor="middle" style="font-size:18px">4</text>
<text x="166" y="768" class="bxs">Pre-cast numerics to one stable width at the edge of every model and union leg.</text>
<text x="166" y="796" class="code">cast(amount as numeric(38,4)) — the resolved type can then never drift</text>

<circle cx="134" cy="823" r="15" fill="#3FD98A"/>
<text x="134" y="830" class="bxs-d" text-anchor="middle" style="font-size:18px">5</text>
<text x="166" y="830" class="bxs">Set the partition spec when the table is created; a later edit changes nothing.</text>
<text x="166" y="858" class="code">partitioned by (months(business_date)) — old data never moves</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1240" y="464" class="cap">3 · WHY</text>
<rect x="1240" y="482" width="590" height="212" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1268" y="518" class="bxs-s">Silent absorption produces a plausible number,</text>
<text x="1268" y="546" class="bxs-s">not an error — and nobody reviews a report that</text>
<text x="1268" y="574" class="bxs-s">still renders. A loud failure costs an hour.</text>
<line x1="1268" y1="594" x2="1802" y2="594" stroke="#2C3841" stroke-width="2"/>
<text x="1268" y="622" class="code" style="fill:#FF6B73;font-size:16px;letter-spacing:2px">IF YOU DON'T</text>
<text x="1268" y="650" class="bxs-s" style="fill:#C9A0A4">A widened column shifts totals quietly, and</text>
<text x="1268" y="676" class="bxs-s" style="fill:#C9A0A4">finance finds it long before engineering does.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1240" y="732" class="cap">4 · ON APPAREL GROUP</text>
<rect x="1240" y="748" width="590" height="142" rx="16" fill="#1C1A12" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1268" y="784" class="agbox">ORACLE NUMBER IS THE ONE TO WATCH</text>
<text x="1268" y="816" class="bxs-s" style="fill:#D9CBAE">Oracle NUMBER carries no fixed width: pin RMS,</text>
<text x="1268" y="844" class="bxs-s" style="fill:#D9CBAE">SIM and XStore amounts to numeric(38,4) at</text>
<text x="1268" y="872" class="bxs-s" style="fill:#D9CBAE">staging. Magento and MoEngage add fields often.</text>

<!-- ══ IN PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">A build that goes red costs an hour. A number that goes wrong costs a quarter, and nobody notices until someone asks why.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 09</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
