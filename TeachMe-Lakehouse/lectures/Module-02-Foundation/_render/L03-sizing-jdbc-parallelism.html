<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 03</text>
<text x="90" y="168" class="title">Size JDBC Parallelism Properly</text>
<text x="90" y="212" class="sub">Too few readers and the job times out. Too many and the source refuses every connection. Here is the arithmetic you reuse.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="300" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="104" rx="14" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="356" class="bxt-s" style="font-size:24px">How many parallel readers for a giant table?</text>
<text x="118" y="392" class="bxs-s" style="font-size:18px;fill:#A9BAC6">The number is bounded below by row volume and above by what the source will let you open at once.</text>

<rect x="1040" y="336" width="350" height="64" rx="12" fill="#231519" stroke="#7A3A40" stroke-width="2.5" stroke-dasharray="9 6"/>
<line x1="1066" y1="359" x2="1084" y2="377" stroke="#FF6B73" stroke-width="3.5" stroke-linecap="round"/>
<line x1="1084" y1="359" x2="1066" y2="377" stroke="#FF6B73" stroke-width="3.5" stroke-linecap="round"/>
<text x="1100" y="376" class="avoid">Guess, then tune</text>

<rect x="1410" y="336" width="420" height="64" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="3"/>
<polyline points="1440,368 1449,377 1466,357" fill="none" stroke="#3FD98A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1480" y="376" class="doit">Compute, then clamp</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="462" class="doit">2 · DO THIS</text>
<rect x="90" y="478" width="1120" height="412" rx="16" fill="#131A1F" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="518" class="bxt-s" style="font-size:24px">FOUR NUMBERS, IN THIS ORDER — THE CEILING ALWAYS WINS</text>
<line x1="118" y1="534" x2="1182" y2="534" stroke="#2C3841" stroke-width="2"/>
<text x="118" y="560" class="cap" style="font-size:17px">WORKED EXAMPLE · XSTORE POS · 300 M ROWS · 4 LANES · CEILING 160</text>

<rect x="118" y="572" width="1064" height="140" rx="10" fill="#0B1013" stroke="#22303A" stroke-width="2"/>
<text x="138" y="602" class="code" xml:space="preserve">1  partitions   =  rows ÷ 8 M           300 M ÷ 8 M     <tspan style="fill:#C9D6DE">-&gt;  38</tspan></text>
<text x="138" y="630" class="code" xml:space="preserve">2  connections  =  lanes × partitions   4 × 38          <tspan style="fill:#C9D6DE">-&gt;  152</tspan></text>
<text x="138" y="658" class="code" xml:space="preserve">3  budget       =  ceiling × 50 %       160 × 50 %      <tspan style="fill:#FFB84D">-&gt;  80</tspan></text>
<text x="138" y="686" class="code" xml:space="preserve" style="fill:#8CE8B8">4  CLAMP        =  budget ÷ lanes       80 ÷ 4          -&gt;  16 partitions</text>

<rect x="118" y="726" width="1064" height="82" rx="10" fill="#2A1E12" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="140" y="754" class="bxt-s" style="font-size:19px;fill:#FFB84D">WHEN THE CLAMP BITES</text>
<text x="140" y="784" class="bxs-s" style="font-size:18px;fill:#E8D5B0">16 partitions × 19 M rows is over the 5–10 M target — cut lanes, or split the giant into date windows.</text>

<rect x="118" y="820" width="1064" height="52" rx="10" fill="#0B1013" stroke="#2A4A3A" stroke-width="2"/>
<text x="138" y="852" class="code" xml:space="preserve" style="fill:#8CE8B8">connect timeout 60 s  ·  read timeout 120 s  -  the network hop is slower than the query</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1270" y="462" class="cap">3 · WHY</text>
<rect x="1270" y="478" width="560" height="204" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1298" y="514" class="bxs-s" style="font-size:18px">One reader on a 300 M-row table is one socket</text>
<text x="1298" y="540" class="bxs-s" style="font-size:18px">and one very long wait, ending in a timeout.</text>
<text x="1298" y="566" class="bxs-s" style="font-size:18px">Too many and the source's connect pool</text>
<text x="1298" y="592" class="bxs-s" style="font-size:18px">saturates — then every read fails at once.</text>
<line x1="1298" y1="608" x2="1802" y2="608" stroke="#2C3841" stroke-width="2"/>
<text x="1298" y="636" class="bxt-s" style="font-size:18px;fill:#FF6B73">IF YOU DON'T</text>
<text x="1298" y="662" class="bxs-s" style="font-size:18px;fill:#C69AA0">You learn the ceiling from a 2-hour timeout.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1270" y="710" class="agbox">4 · ON APPAREL GROUP</text>
<rect x="1270" y="726" width="560" height="164" rx="16" fill="#1F1A10" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1298" y="760" class="bxs-s" style="font-size:18px;fill:#E8D5B0">XStore POS is the giant — size it first</text>
<text x="1298" y="788" class="bxs-s" style="font-size:18px;fill:#E8D5B0">RMS · SIM facts — 4 to 8 partitions</text>
<text x="1298" y="816" class="bxs-s" style="font-size:18px;fill:#E8D5B0">RMS masters · lookups — 1, unpartitioned</text>
<text x="1298" y="850" class="bxt-s" style="font-size:19px;fill:#FFB84D">Ask the DBA for the ceiling</text>

<!-- ══ PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Checkout lanes: too few and the queue never clears, too many and the doorway jams. Size against the doorway, not the queue.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 03</text>
