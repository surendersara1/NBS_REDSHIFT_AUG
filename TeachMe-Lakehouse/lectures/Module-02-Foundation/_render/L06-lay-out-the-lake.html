<text x="90" y="104" class="eyebrow">MODULE 2 · LESSON 06</text>
<text x="90" y="168" class="title">Lay Out the Lake</text>
<text x="90" y="212" class="sub">Zones, buckets, namespaces and retention — decided once, before the first terabyte lands.</text>
<line x1="90" y1="248" x2="1830" y2="248" stroke="#243039" stroke-width="2"/>

<!-- ══ ZONE 1 · THE DECISION ══ -->
<text x="90" y="300" class="cap">1 · THE DECISION</text>
<rect x="90" y="316" width="1740" height="108" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="118" y="362" class="bxt">Zones, buckets, namespaces — how is storage carved up?</text>
<text x="118" y="398" class="bxs" style="fill:#A9BAC6">You get one attempt. The layout is fixed the moment the first terabyte lands.</text>
<rect x="1080" y="340" width="351" height="60" rx="12" fill="#12331F" stroke="#3FD98A" stroke-width="2.5"/>
<text x="1255" y="377" class="doit" text-anchor="middle" style="font-size:19px">DO · ZONE PER BUCKET</text>
<rect x="1451" y="340" width="351" height="60" rx="12" fill="#241416" stroke="#8A3A42" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1626" y="377" class="avoid" text-anchor="middle" style="font-size:19px">AVOID · ONE BIG BUCKET</text>

<!-- ══ ZONE 2 · DO THIS ══ -->
<text x="90" y="464" class="cap">2 · DO THIS</text>
<rect x="90" y="482" width="1120" height="408" rx="16" fill="#101E17" stroke="#3FD98A" stroke-width="3"/>
<rect x="90" y="482" width="1120" height="7" rx="3.5" fill="#3FD98A"/>
<text x="118" y="528" class="doit" style="font-size:23px">THE SETUP · FIVE DECISIONS, MADE ONCE</text>
<line x1="118" y1="546" x2="1182" y2="546" stroke="#2A4A3A" stroke-width="2"/>

<circle cx="134" cy="575" r="15" fill="#3FD98A"/>
<text x="134" y="582" class="bxs-d" text-anchor="middle" style="font-size:18px">1</text>
<text x="166" y="582" class="bxs">Cut four zones — raw, bronze, silver, gold — and give each one its own bucket.</text>
<text x="166" y="610" class="code">a separate bucket is a separate policy, key and blast radius</text>

<circle cx="134" cy="637" r="15" fill="#3FD98A"/>
<text x="134" y="644" class="bxs-d" text-anchor="middle" style="font-size:18px">2</text>
<text x="166" y="644" class="bxs">Make raw immutable and replayable: write it once per cycle and never edit it.</text>
<text x="166" y="672" class="code">s3://ag-raw-&lt;env&gt;/&lt;source&gt;/&lt;table&gt;/cycle=&lt;cycle_id&gt;/</text>

<circle cx="134" cy="699" r="15" fill="#3FD98A"/>
<text x="134" y="706" class="bxs-d" text-anchor="middle" style="font-size:18px">3</text>
<text x="166" y="706" class="bxs">Give every source system its own namespace. Never mix two systems in one.</text>
<text x="166" y="734" class="code">bronze.rms · bronze.sim · bronze.xstore · bronze.epsilon · bronze.magento</text>

<circle cx="134" cy="761" r="15" fill="#3FD98A"/>
<text x="134" y="768" class="bxs-d" text-anchor="middle" style="font-size:18px">4</text>
<text x="166" y="768" class="bxs">Set lifecycle and retention when the bucket is created, not when it fills up.</text>
<text x="166" y="796" class="code">raw: long retention, then archive · bronze + silver: expire noncurrent</text>

<circle cx="134" cy="823" r="15" fill="#3FD98A"/>
<text x="134" y="830" class="bxs-d" text-anchor="middle" style="font-size:18px">5</text>
<text x="166" y="830" class="bxs">Put the zone and the environment in every bucket name, so a path explains itself.</text>
<text x="166" y="858" class="code">ag-&lt;zone&gt;-&lt;env&gt; — you can read the blast radius of a grant off the name</text>

<!-- ══ ZONE 3 · WHY ══ -->
<text x="1240" y="464" class="cap">3 · WHY</text>
<rect x="1240" y="482" width="590" height="212" rx="16" fill="#191F24" stroke="#3A4854" stroke-width="2.5"/>
<text x="1268" y="518" class="bxs-s">Each zone carries a different retention, cost and</text>
<text x="1268" y="546" class="bxs-s">access profile. A bucket boundary is the only place</text>
<text x="1268" y="574" class="bxs-s">you can enforce all three at once.</text>
<line x1="1268" y1="594" x2="1802" y2="594" stroke="#2C3841" stroke-width="2"/>
<text x="1268" y="622" class="code" style="fill:#FF6B73;font-size:16px;letter-spacing:2px">IF YOU DON'T</text>
<text x="1268" y="650" class="bxs-s" style="fill:#C9A0A4">Fixing the layout later means rewriting every</text>
<text x="1268" y="676" class="bxs-s" style="fill:#C9A0A4">path, spec, job and grant you have written.</text>

<!-- ══ ZONE 4 · ON APPAREL GROUP ══ -->
<text x="1240" y="732" class="cap">4 · ON APPAREL GROUP</text>
<rect x="1240" y="748" width="590" height="142" rx="16" fill="#1C1A12" stroke="#8A6A3A" stroke-width="2.5"/>
<text x="1268" y="784" class="agbox">8 SOURCES → 8 NAMESPACES</text>
<text x="1268" y="816" class="bxs-s" style="fill:#D9CBAE">rms · sim · xstore · epsilon · moengage ·</text>
<text x="1268" y="844" class="bxs-s" style="fill:#D9CBAE">magento · vemco · irisys. XStore sets the</text>
<text x="1268" y="872" class="bxs-s" style="fill:#D9CBAE">size. Epsilon is PII: own prefix, own key.</text>

<!-- ══ IN PLAIN ENGLISH ══ -->
<rect x="90" y="912" width="1740" height="86" rx="14" fill="#1A1E15" stroke="#4A431F" stroke-width="2.5"/>
<text x="122" y="948" class="plainb">IN PLAIN ENGLISH</text>
<text x="122" y="982" class="plain">Four separate warehouses, not four shelves in one room. Each one gets its own lock, its own bill and its own clear-out schedule.</text>

<text x="90" y="1046" class="footc">TeachMe-Lakehouse · Module 2 · Lesson 06</text>
<text x="1830" y="1046" class="foot" text-anchor="end">Apparel Group Data Platform</text>
